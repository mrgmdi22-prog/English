<style>
/* Layout: an answer-sheet notebook — one centred column, option letters drawn as OMR bubbles, soft paper tones (single light theme by the teacher's preference). */
:root{
  --paper:#F6F3FF; --sheet:#FFFFFF; --ink:#231f3a; --ink-soft:#625d7d; --line:#e6e1f5;
  --accent:#6B4BD8; --accent-soft:#EEE9FF; --sun:#FFF4D6;
  --good:#16855F; --good-soft:#E3F7EE; --bad:#C9472B; --bad-soft:#FDECE7;
  --ar:Tajawal, "Segoe UI", Tahoma, sans-serif;
  --en:"Lexend", "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:19px}
body{background:var(--paper);color:var(--ink);font-family:var(--ar);line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.en{font-family:var(--en);direction:ltr;text-align:left;unicode-bidi:isolate}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:44px;height:44px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font-family:var(--en);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.5px}
.brand h1{font-size:1.45rem;font-weight:700}
.brand small{display:block;color:var(--ink-soft);font-size:.82rem;font-weight:400}
.home-btn{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.9rem;color:var(--ink-soft)}
.home-btn:hover{border-color:var(--accent);color:var(--accent)}

/* home */
.intro{font-size:1.05rem;color:var(--ink-soft);max-width:62ch;margin:6px 0 22px}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px;flex:1}
.stat b{display:block;font-size:1.5rem;font-family:var(--en);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:.85rem;color:var(--ink-soft)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:34px}
.quick button{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;text-align:right;display:flex;flex-direction:column;gap:4px}
.quick button:hover{border-color:var(--accent)}
.quick button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.quick button.primary small{color:#E3F5F6}
.quick b{font-size:1.1rem}
.quick small{color:var(--ink-soft);font-size:.86rem;line-height:1.5}
section.block{margin-bottom:34px}
section.block h2{font-size:1.25rem;margin-bottom:4px}
section.block p.sub{color:var(--ink-soft);margin:0 0 14px;font-size:.95rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;display:flex;flex-direction:column;gap:6px}
.cat:hover{border-color:var(--accent);background:var(--accent-soft)}
.cat .nm{font-weight:600;font-size:1rem}
.cat .meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--ink-soft);gap:8px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.note{background:var(--sheet);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;font-size:.88rem;color:var(--ink-soft)}

/* practice */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.ptop h2{font-size:1.2rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.hot{background:var(--sun);color:#8A6A00}
.progress{font-family:var(--en);font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.95rem}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stem{font-size:1.3rem;line-height:1.75;white-space:pre-line;margin-bottom:18px;overflow-wrap:anywhere}
.stem u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--accent)}
.stem .blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--ink-soft);margin:0 2px;transform:translateY(-4px)}
.qar{font-family:var(--ar);direction:rtl;text-align:right;color:var(--ink-soft);font-size:1rem;margin:-8px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:1.15rem;line-height:1.6;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;font-weight:600;font-size:.95rem;color:var(--ink-soft);font-family:var(--en);margin-top:1px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.picked .bub{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:1rem}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b.v{display:block;font-size:1.05rem;margin-bottom:4px}
.feedback .clue{background:var(--sun);border-radius:8px;padding:8px 12px;margin-top:8px}
details.rule{margin-top:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
details.rule summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.rule ul{margin:8px 0 4px;padding-inline-start:20px}
details.rule li{margin-bottom:4px}
.navrow{direction:ltr;display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:11px 22px;font-weight:600;font-size:1rem;background:var(--accent);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}

/* reading */
.rgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){.wrap.wide{max-width:1240px}.rgrid{grid-template-columns:1.05fr 1fr;align-items:start}.passage{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.passage{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.passage h3{font-size:1rem;color:var(--ink-soft);font-weight:500;margin-bottom:8px}
.passage .en p{font-size:1.1rem;line-height:1.85;margin:0 0 12px}
.passage details summary{cursor:pointer;color:var(--accent);font-weight:600}
.tip{font-size:.9rem;color:var(--ink-soft);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}

/* results */
.result{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:24px}
.score{font-family:var(--en);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.rows{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.rowc{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:12px;align-items:center}
.rowc .bar{height:10px}
.rowc span{font-family:var(--en);font-variant-numeric:tabular-nums;text-align:left}
.timer{font-family:var(--en);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-soft)}
footer{margin-top:40px;font-size:.8rem;color:var(--ink-soft);text-align:center;line-height:1.8}
@media (max-width:520px){html{font-size:17px}.qcard{padding:16px 14px}.stem{font-size:1.2rem}.opt{font-size:1.08rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}

.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent);font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.95rem;margin-top:14px}
</style>
</head>

<div class="wrap" id="app" dir="rtl"></div>

<script>
const D = window.STEP_DATA;
const CATS = {
  tenses:'الأزمنة', conditionals:'الجمل الشرطية والتمنّي', passive:'المبني للمجهول', modals:'الأفعال الناقصة',
  gerund_inf:'المصدر وصيغة ing', questions:'تكوين السؤال والأفعال المساعدة', conjunctions:'أدوات الربط',
  relative:'أسماء الموصول', prepositions:'حروف الجر', pronouns:'الضمائر', quantifiers:'أدوات الكمية والتعريف',
  comparatives:'المقارنة والتفضيل', vocab:'مفردات وتراكيب متنوعة',
  word_order:'ترتيب الكلمات', paragraph_order:'ترتيب الجمل في فقرة', add_clause:'إضافة جملة إلى فقرة',
  capitalization:'الحروف الكبيرة', punctuation:'علامات الترقيم', error_id:'تحديد الخطأ وتصحيحه'
};
const GRAMMAR_CATS = ['tenses','conditionals','passive','modals','gerund_inf','questions','conjunctions','relative','prepositions','pronouns','quantifiers','comparatives','vocab'];
const ANALYSIS_CATS = ['word_order','paragraph_order','add_clause','capitalization','punctuation','error_id'];
const RTYPES = {main:'الفكرة الرئيسية', vocab:'معنى كلمة', ref:'عودة الضمير', infer:'الاستنتاج', detail:'تفاصيل من النص', not:'ما لم يُذكر'};

const RULES = {
  tenses:['ابحث أولاً عن كلمة الزمن في الجملة، فهي مفتاح الإجابة.',
    'الماضي البسيط (V2): yesterday / ago / last week / in 2010.',
    'المضارع المستمر (am/is/are + V-ing): now / right now / at the moment / Look!',
    'المضارع التام (have/has + V3): already / yet / just / ever / never / since / for.',
    'الماضي المستمر (was/were + V-ing): حدث كان جارياً حين قطعه حدث آخر بالماضي البسيط (when / while).',
    'الماضي التام (had + V3): الحدث الأسبق من حدثين في الماضي، ومعه غالباً by the time / before / after.',
    'بعد when / after / as soon as في جملة عن المستقبل نستخدم المضارع البسيط لا will.'],
  conditionals:['النوع الأول: If + مضارع بسيط ← will + فعل. (If it rains, I will stay.)',
    'النوع الثاني: If + ماضٍ بسيط ← would + فعل. (If I were rich, I would travel.)',
    'النوع الثالث: If + had + V3 ← would have + V3.',
    'مع I wish / If only للحاضر نستخدم الماضي (were)، وللماضي نستخدم had + V3.',
    'unless تعني if ... not.'],
  passive:['المبني للمجهول = be (بزمن الجملة) + التصريف الثالث V3.',
    'إذا كان الفاعل غير مذكور أو مجهولاً (by someone) فالجملة غالباً مبنية للمجهول.',
    'مثال: The book was written in 1603. / The pizza is going to be delivered.',
    'بعد الأفعال الناقصة: can / should / must + be + V3.'],
  modals:['بعد الأفعال الناقصة يأتي الفعل في المصدر بدون to: must go، لا must to go.',
    'must / have to: الوجوب. had to: الوجوب في الماضي.',
    'could: القدرة في الماضي أو طلب مهذب. would you ...? طلب مهذب.',
    'might / may: الاحتمال. should: النصيحة.',
    'must have + V3: استنتاج مؤكد عن الماضي.'],
  gerund_inf:['بعد حروف الجر يأتي الفعل بصيغة ing: after graduating، interested in learning.',
    'أفعال يتبعها ing: enjoy, finish, stop, keep, avoid, mind, suggest.',
    'أفعال يتبعها to + فعل: want, decide, hope, plan, need, agree, ask someone to.',
    'stop + ing = توقف عن الفعل. stop + to = توقف لكي يفعل شيئاً.',
    'make / let + مفعول + فعل بدون to: let him stay.'],
  questions:['الفعل المساعد يتبع زمن الجملة: Do / Does للمضارع، Did للماضي.',
    'بعد do / does / did يأتي الفعل في المصدر: Did you remember...?',
    'في السؤال غير المباشر (I don\'t know where...) يأتي الترتيب كالجملة الخبرية: where the files are kept.'],
  conjunctions:['because / since: للسبب. so: للنتيجة.',
    'but / however / although / even though: للتناقض. however يسبقها غالباً فاصلة منقوطة.',
    'neither ... nor / either ... or / both ... and: أزواج ثابتة.',
    'in order to + فعل: للغرض. for example: لضرب مثال. in addition: للإضافة.'],
  relative:['who: للعاقل (فاعل). whom: للعاقل (مفعول به). which: لغير العاقل.',
    'whose: للملكية (The boy whose bike...). where: للمكان.',
    'لا نكرر الضمير بعد اسم الموصول: who works، لا who he works.'],
  prepositions:['in: الشهور والسنوات والمدن وأجزاء اليوم (in May, in the evening).',
    'on: الأيام والتواريخ (on Monday). at: الوقت المحدد والأماكن الدقيقة (at 7 PM, at night).',
    'for + مدة (for three years). since + نقطة بداية (since 2005).'],
  pronouns:['ضمائر الفاعل: I, he, she, we, they. ضمائر المفعول: me, him, her, us, them.',
    'ضمائر الملكية المستقلة: mine, yours, his, hers, ours, theirs (a friend of mine).',
    'الضمائر الانعكاسية: myself, yourself, themselves... ولا وجود لـ theirselves.',
    'each other: كل منهما للآخر.'],
  quantifiers:['many / a few / few: مع المعدود (friends, pages).',
    'much / a little / little: مع غير المعدود (money, experience, water).',
    'a lot of / lots of: مع النوعين. any: في النفي والسؤال غالباً.',
    'the: لشيء محدد معروف للطرفين.'],
  comparatives:['المقارنة بين اثنين: صفة + er + than أو more + صفة + than.',
    'التفضيل: the + صفة + est أو the most + صفة.',
    'المساواة: as + صفة + as.',
    'لا نجمع بين more و er: earlier، لا more earlier.'],
  vocab:['اقرأ الجملة كاملة قبل النظر في الخيارات.',
    'جرّب وضع كل خيار في الفراغ واقرأ الجملة بصوت داخلي.',
    'انتبه للكلمات المصاحبة الثابتة مثل: look after, interested in, too ... to.'],
  word_order:['ابدأ بالخيار الذي يبدو طبيعياً: فاعل ← فعل ← مفعول ← مكان ← زمان.',
    'استبعد الخيارات التي تفصل الفعل عن مفعوله أو تبدأ بأداة ربط بلا معنى.',
    'العبارة الوصفية تأتي بجوار الاسم الذي تصفه مباشرة.'],
  paragraph_order:['ابحث عن الجملة الافتتاحية: تقدّم الشخص أو الموضوع ولا تحتوي على ضمير يعود على شيء سابق.',
    'كلمات التسلسل تدلك على الترتيب: First / To start ← Then ← Eventually / Finally.',
    'الضمائر (he, she, it) تأتي بعد ذكر الاسم.'],
  add_clause:['اقرأ الجملة المطلوب إضافتها وحدد علاقتها: سبب؟ زمن؟ نتيجة؟',
    'ضعها مع كل جملة في الفقرة واختر الأنسب معنى.'],
  capitalization:['تبدأ بحرف كبير: بداية الجملة، الضمير I، أسماء الأشخاص والأماكن والدول واللغات والجنسيات.',
    'الأيام والشهور: Monday, August. أما الفصول فلا: summer, winter.',
    'الألقاب قبل الاسم: Mr., Doctor, Princess Layla. وأسماء المؤسسات: King Saud University.',
    'المواد الدراسية لا تبدأ بحرف كبير إلا اللغات: math, chemistry, English.'],
  punctuation:['الفاصلة بعد العبارة الافتتاحية: After school ended, we...',
    'الفاصلة المنقوطة قبل however وبين جملتين مستقلتين.',
    'الفاصلة العليا للملكية: Ali\'s car، وللاختصار: doesn\'t, who\'s.',
    'علامة الاستفهام للسؤال، وعلامة التعجب بعد What a ...!'],
  error_id:['اقرأ الجملة كاملة وابحث عن خطأ في: الزمن، توافق الفعل مع الفاعل، صيغة الفعل، الجمع.',
    'أخطاء متكررة: he have ← has، childs ← children، like run ← like running، explained me ← explained to me.',
    'تكرار الضمير بعد الفاعل خطأ: My father he gave ← My father gave.']
};
const RTIPS = {
  main:'اقرأ الجملة الأولى من كل فقرة، فالفكرة الرئيسية تشمل النص كله لا تفصيلاً واحداً.',
  vocab:'ارجع إلى الكلمة في الفقرة المذكورة، واستبدلها بكل خيار، واختر ما يحافظ على المعنى.',
  ref:'الضمير يعود غالباً على أقرب اسم مناسب قبله في الجملة نفسها أو السابقة.',
  infer:'الإجابة غير مكتوبة حرفياً، لكنها تُفهم من النص. استبعد ما يناقضه.',
  detail:'خذ كلمة مميزة من السؤال (اسم، رقم، تاريخ) وابحث عنها في النص.',
  not:'تحقق من كل خيار في النص، والخيار الذي لا تجده هو الإجابة.'
};

/* ---------- storage (per student, in this browser) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('step.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('step.'+k, JSON.stringify(v)); }catch(e){} }
};
let stats = store.get('stats', {});     // key -> [right, total]
let wrongs = store.get('wrongs', {});   // qkey -> 1
// Honor-board points: each question answered right counts once (step.ok = {qkey: 1}), 7 points + the streak bonus 🔥.
let okKeys = store.get('ok', {});
function record(key, cat, ok){
  const s = stats[cat] || [0,0]; s[1]++; if(ok) s[0]++; stats[cat] = s;
  if(ok) delete wrongs[key]; else wrongs[key] = 1;
  const fresh = ok && !okKeys[key]; if(fresh){ okKeys = store.get('ok', okKeys); okKeys[key] = 1; store.set('ok', okKeys); }
  store.set('stats', stats); store.set('wrongs', wrongs);
  if(window.clubCombo) window.clubCombo.hit(ok, fresh);
  return fresh;
}

/* ---------- question model ---------- */
const G = D.g.map((q,i)=>({key:'g'+i, kind:'g', cat:q[0], stem:q[1], options:q[2], answer:q[3], freq:q[4], hint:q[5]}));
const R = D.r.map((p,i)=>({key:'p'+i, title:p[0], paras:p[1], freq:p[2],
  qs:p[3].map((q,j)=>({key:'p'+i+'.'+j, kind:'r', pi:i, cat:'r_'+q[4], rtype:q[4], stem:q[0], ar:q[1], options:q[2], answer:q[3], freq:q[5]}))}));
const RQ = R.flatMap(p=>p.qs);
const LR = (window.STEP_LISTEN||[]);
const LQ = LR.flatMap((r,ri)=>r.q.map((q,j)=>({key:'l'+ri+'.'+j, kind:'l', ri, cat:'listen', stem:q[0], options:q[1], answer:q[2], freq:1, hint:''})));
/* speech */
let VOICES = [];
function loadVoices(){ try{ VOICES = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
function pickVoice(n){ if(!VOICES.length) return null; const us = VOICES.filter(v=>/en[-_]US/i.test(v.lang)); const pool = us.length>1?us:VOICES; return pool[n % pool.length]; }
let speakingRi = null;
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} speakingRi = null; const b=document.getElementById('playBtn'); if(b) b.textContent='▶ استمع إلى التسجيل'; }
function playRec(ri, rate){
  try{ speechSynthesis.cancel(); }catch(e){}
  const r = LR[ri]; if(!r || !window.speechSynthesis){ alertNoTTS(); return; }
  speakingRi = ri; const b=document.getElementById('playBtn'); if(b) b.textContent='⏸ إيقاف';
  r.L.forEach((ln,i)=>{
    const u = new SpeechSynthesisUtterance(ln[1]);
    u.lang = 'en-US'; u.rate = rate||0.95;
    const v = pickVoice(ln[0]); if(v) u.voice = v;
    if(r.k==='conv' && ln[0]===1 && (!v || VOICES.length<2)) u.pitch = 1.35;
    if(i===r.L.length-1) u.onend = ()=>{ if(speakingRi===ri) stopSpeech(); };
    speechSynthesis.speak(u);
  });
}
function alertNoTTS(){ const n=document.getElementById('ttsNote'); if(n) n.hidden=false; }

const WB = (window.STEP_WORDS||[]).map((w,i)=>({w:w[0], m:w[1], ar:w[2], i}));
function wordQ(x){
  const others = shuffle(WB.filter(y=>y.m!==x.m)).slice(0,3).map(y=>y.m);
  const opts = shuffle([x.m, ...others]);
  return {key:'w'+x.i, kind:'w', cat:'words', stem:'The word “'+x.w+'” is closest in meaning to ______', options:opts, answer:opts.indexOf(x.m), freq:1, hint:'«'+x.w+'» = '+x.ar+' ('+x.m+')'};
}
const BYKEY = Object.fromEntries([...G, ...RQ, ...LQ].map(q=>[q.key,q]));
WB.forEach(x=>{ BYKEY['w'+x.i] = wordQ(x); });

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const app = $('#app');

function stemHTML(q){
  let h = esc(q.stem).replace(/_{3,}/g, '<span class="blank"></span>');
  if(q.cat === 'error_id' && !/replace/i.test(q.stem)){
    const seen = new Set();
    q.options.map(o=>o.replace(/[.\s]+$/,'')).sort((a,b)=>b.length-a.length).forEach(o=>{
      if(o.length < 2 || seen.has(o)) return; seen.add(o);
      const re = new RegExp('(^|[^\\w>])(' + esc(o).replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![\\w<])', 'i');
      h = h.replace(re, (m,a,b)=>a+'<u>'+b+'</u>');
    });
  }
  return h;
}

/* ---------- views ---------- */
function header(showHome){
  return `<a class="back" href="../index.html">→ مسار النخبة</a><header class="top"><div class="brand"><div class="mark">STEP</div><div><h1>مِران ستيب <span dir="ltr" style="font-size:.7em;opacity:.75">STEP Drill</span></h1><small>مسار النخبة · تدريب على اختبار كفايات اللغة الإنجليزية</small></div></div>${showHome?'<button class="home-btn" id="home">قائمة ستيب</button>':''}</header>`;
}
function catTile(cat, n, label){
  const s = stats[cat]; const pct = s && s[1] ? Math.round(100*s[0]/s[1]) : null;
  return `<button class="cat" data-cat="${cat}"><span class="nm">${label}</span>
    <span class="meta"><span>${n} سؤالاً</span><span>${pct===null?'لم تبدأ بعد':'إتقانك '+pct+'٪'}</span></span>
    <span class="bar"><i style="width:${pct||0}%"></i></span></button>`;
}
function home(){
  app.classList.remove('wide');
  const count = c => G.filter(q=>q.cat===c).length;
  const rcount = t => RQ.filter(q=>q.rtype===t).length;
  const answered = Object.values(stats).reduce((a,s)=>a+s[1],0);
  const nWrong = Object.keys(wrongs).filter(k=>BYKEY[k]).length;
  const nHot = G.filter(q=>q.freq>=3).length;
  app.innerHTML = header(false) + `
  <p class="intro">بنك أسئلة مُعاد تنظيمه من نماذج ستيب المتداولة، مصنّف حسب المهارة. اختر مهارة وتدرّب عليها، وستظهر لك الإجابة الصحيحة مع القاعدة بعد كل سؤال.</p>
  <div class="stats-row">
    <div class="stat"><b>${G.length}</b><span>سؤال قواعد وتحليل كتابي</span></div>
    <div class="stat"><b>${R.length}</b><span>قطعة قراءة (${RQ.length} سؤالاً)</span></div>
    <div class="stat"><b>${answered}</b><span>إجابة سجّلتها حتى الآن</span></div>
  </div>
  <div class="quick">
    <button class="primary" id="mock"><b>اختبار محاكٍ</b><small>20 سؤال استماع + 40 قراءة + 40 قواعد وتحليل كتابي، مع مؤقت ونتيجة لكل مهارة</small></button>
    <button id="hot"><b>الأسئلة الأكثر تكراراً</b><small>${nHot} سؤالاً ظهرت في ثلاثة نماذج أو أكثر</small></button>
    <button id="mistakes" ${nWrong?'':'disabled'}><b>مراجعة أخطائي</b><small>${nWrong?nWrong+' سؤالاً أخطأت فيها':'ستظهر هنا الأسئلة التي تخطئ فيها'}</small></button>
  </div>
  <section class="block"><h2>الاستماع</h2><p class="sub">محاضرات ومحادثات قصيرة بأسلوب ستيب، يقرؤها جهازك بصوت مسموع. استمع ثم أجب، ويظهر لك نص التسجيل بعد الإجابة.</p>
    <div class="cats">${catTile('listen', LQ.length, 'تسجيلات الاستماع ('+LR.length+' تسجيلاً)')}</div></section>
  <section class="block"><h2>القواعد</h2><p class="sub">اختر باباً لتتدرب على أسئلته.</p>
    <div class="cats">${GRAMMAR_CATS.filter(c=>count(c)).map(c=>catTile(c,count(c),CATS[c])).join('')}</div></section>
  <section class="block"><h2>التحليل الكتابي</h2><p class="sub">ترتيب الكلمات والجمل، الحروف الكبيرة، علامات الترقيم، وتحديد الخطأ.</p>
    <div class="cats">${ANALYSIS_CATS.filter(c=>count(c)).map(c=>catTile(c,count(c),CATS[c])).join('')}</div></section>
  <section class="block"><h2>استيعاب المقروء</h2><p class="sub">قطعة كاملة وأسئلتها، مع ترجمة عربية للسؤال عند الحاجة.</p>
    <div class="cats">${catTile('r_all', RQ.length, 'كل القطع بالترتيب')}${Object.keys(RTYPES).filter(t=>rcount(t)>2).map(t=>catTile('r_'+t, rcount(t), RTYPES[t])).join('')}</div></section>
  <section class="block"><h2>مفردات القراءة المتكررة</h2><p class="sub">كلمات يتكرر السؤال عن معناها في قطع ستيب: اختر المعنى الأقرب، وتظهر لك ترجمتها العربية بعد الإجابة.</p>
    <div class="cats">${catTile('words', WB.length, 'معنى الكلمة')}</div></section>
  <p class="note">🏆 كل سؤال تجيبه صحيحاً = <b>7 نقاط</b> في لوحة الشرف (مرة واحدة لكل سؤال)، وتتضاعف مع التسلسل 🔥: ثلاث صحيحة متتالية ×1.5، وخمس فأكثر ×2. أسئلة الاستماع من تأليفنا، والصوت يقرؤه جهازك. إن لاحظت سؤالاً فيه خطأ فأخبر معلمك.</p>
  <footer>إعداد: أ. أحمد آل سالم — الأسئلة مجمّعة من نماذج ستيب المتداولة (تجميعات د. برق وأكاديمية ستيب المجانية)، وأُعيد تنظيمها وتصنيفها للتدريب.</footer>`;
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>startCat(b.dataset.cat));
  $('#mock').onclick = startMock;
  $('#hot').onclick = ()=>startSession('الأسئلة الأكثر تكراراً', shuffle(G.filter(q=>q.freq>=3)));
  const m = $('#mistakes'); if(m) m.onclick = ()=>startSession('مراجعة أخطائي', shuffle(Object.keys(wrongs).map(k=>BYKEY[k]).filter(Boolean)));
  window.scrollTo(0,0);
}
function startCat(cat){
  if(cat==='listen') return startSession('الاستماع', shuffle(LR.map((r,ri)=>ri)).flatMap(ri=>LQ.filter(q=>q.ri===ri)));
  if(cat==='words') return startSession('مفردات القراءة المتكررة', shuffle(WB).map(wordQ));
  if(cat==='r_all') return startSession('استيعاب المقروء', RQ.slice());
  if(cat.startsWith('r_')){ const t=cat.slice(2); return startSession('استيعاب المقروء: '+RTYPES[t], shuffle(RQ.filter(q=>q.rtype===t))); }
  startSession(CATS[cat], shuffle(G.filter(q=>q.cat===cat)));
}

/* ---------- session ---------- */
let S = null;
function startSession(title, list, mock){
  S = {title, list, i:0, answers:{}, mock:!!mock, t0:Date.now()};
  if(window.clubCombo) window.clubCombo.start('sp', '*', mock ? {quiet:true} : null);
  renderQ();
}
function ruleBox(q){
  if(q.kind==='w') return '';
  if(q.kind==='l') return `<details class="rule"><summary>نص التسجيل</summary><div class="en" style="margin-top:8px">${LR[q.ri].L.map(l=>`<p style="margin:0 0 8px">${LR[q.ri].k==='conv'?'<b>'+(l[0]?'B':'A')+':</b> ':''}${esc(l[1])}</p>`).join('')}</div></details>`;
  if(q.kind==='r') return `<div class="tip"><b>طريقة الحل: </b>${RTIPS[q.rtype]||RTIPS.detail}</div>`;
  const r = RULES[q.cat]; if(!r) return '';
  return `<details class="rule"><summary>قاعدة الباب: ${CATS[q.cat]}</summary><ul>${r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`;
}
function renderQ(){
  const q = S.list[S.i];
  if(!q){ return finish(); }
  const picked = S.answers[S.i];
  const done = picked !== undefined;
  const showFeedback = done && !S.mock;
  const letters = 'ABCD';
  const opts = q.options.map((o,k)=>{
    let cls = 'opt';
    if(showFeedback){ if(k===q.answer) cls+=' right'; else if(k===picked) cls+=' wrong'; }
    else if(done && k===picked) cls+=' picked';
    return `<button class="${cls} en" data-k="${k}" ${showFeedback?'disabled':''}><span class="bub">${letters[k]}</span><span class="tx">${esc(o)}</span></button>`;
  }).join('');
  let passage = '';
  if(q.kind==='l'){
    const r = LR[q.ri];
    passage = `<div class="passage"><h3>${r.k==='conv'?'محادثة':'محاضرة'} قصيرة — استمع ثم أجب</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" id="playBtn">▶ استمع إلى التسجيل</button>
      <label style="font-size:.9rem;color:var(--ink-soft)">السرعة <select id="rate" style="font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:4px"><option value="0.95">عادية</option><option value="0.8">أبطأ</option><option value="0.65">بطيئة جداً</option></select></label></div>
      <p id="ttsNote" class="tip" hidden style="margin-top:10px">جهازك لا يدعم القراءة الصوتية. جرّب متصفح Chrome، أو افتح «نص التسجيل» بعد الإجابة.</p></div>`;
  }
  if(q.kind==='r'){
    const p = R[q.pi];
    passage = `<div class="passage"><h3>${p.title?esc(p.title):'قطعة القراءة'}</h3><div class="en">${p.paras.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div>`;
  }
  let fb = '';
  if(showFeedback){
    const ok = picked===q.answer;
    fb = `<div class="feedback ${ok?'ok':'no'}"><b class="v">${ok?'إجابة صحيحة.':'الإجابة الصحيحة: '+letters[q.answer]}</b>
      ${!ok?`<div class="en" style="font-size:1.05rem">${esc(q.options[q.answer])}</div>`:''}
      ${q.hint?`<div class="clue">${esc(q.hint)}</div>`:''}</div>${ruleBox(q)}`;
  } else if(q.kind==='r' && !S.mock){ fb = ''; }
  const hot = q.freq>=3 ? `<span class="chip hot">متكرر في ${q.freq} نماذج</span>` : '';
  const catChip = `<span class="chip">${q.kind==='r'?RTYPES[q.rtype]:q.kind==='w'?'معنى الكلمة':q.kind==='l'?'الاستماع':CATS[q.cat]}</span>`;
  const timer = S.mock ? `<span class="timer" id="timer"></span>` : '';
  const qcard = `<div class="qcard"><div class="qmeta">${catChip}${hot}</div>
      <div class="stem en">${stemHTML(q)}</div>
      ${q.ar?`<details class="qar"><summary style="cursor:pointer;color:var(--accent)">ترجمة السؤال</summary>${esc(q.ar)}</details>`:''}
      <div class="opts">${opts}</div>${fb}
      <div class="navrow"><button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>← السابق</button>
      <button class="btn" id="next" ${(!done && !S.mock)?'disabled':''}>${S.i===S.list.length-1?(S.mock?'إنهاء الاختبار':'إنهاء'):'التالي →'}</button></div></div>`;
  app.classList.toggle('wide', q.kind==='r'||q.kind==='l');
  if(speakingRi!==null && (q.kind!=='l' || q.ri!==speakingRi)) stopSpeech();
  app.innerHTML = header(true) + `<div class="ptop"><h2>${esc(S.title)}</h2><span class="progress" dir="ltr">${S.i+1} / ${S.list.length}</span>${timer}</div>` +
    ((q.kind==='r'||q.kind==='l') ? `<div class="rgrid">${passage}<div>${qcard}</div></div>` : qcard);
  const pb = document.getElementById('playBtn');
  if(pb){ if(speakingRi===q.ri) pb.textContent='⏸ إيقاف'; pb.onclick = ()=>{ if(speakingRi===q.ri) stopSpeech(); else playRec(q.ri, +document.getElementById('rate').value); }; }
  $('#home').onclick = ()=>{ stopSpeech(); S=null; home(); };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(showFeedback) return;
    const k = +b.dataset.k;
    if(!S.mock){ record(q.key, q.cat, k===q.answer); try{ window.clubSfx && window.clubSfx(k===q.answer?'good':'bad'); }catch(e){} }
    S.answers[S.i] = k; renderQ();
    if(!S.mock){ const f=$('.feedback'); if(f) f.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  });
  $('#prev').onclick = ()=>{ S.i--; renderQ(); };
  $('#next').onclick = ()=>{ S.i++; renderQ(); if(S && S.list[S.i] && (S.list[S.i].kind!==q.kind || (q.kind==='r' && S.list[S.i].pi!==q.pi) || (q.kind==='l' && S.list[S.i].ri!==q.ri))) window.scrollTo(0,0); };
  tick();
}
function tick(){
  const el = $('#timer'); if(!el || !S) return;
  const s = Math.floor((Date.now()-S.t0)/1000);
  el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
setInterval(tick, 1000);

function startMock(){
  // ~40 reading questions from whole passages, 26 grammar + 14 analysis
  const ps = shuffle(R.filter(p=>p.qs.length>=2)); const reading = [];
  for(const p of ps){ if(reading.length>=40) break; reading.push(...p.qs.slice(0, 40-reading.length)); }
  const gram = shuffle(G.filter(q=>GRAMMAR_CATS.includes(q.cat))).slice(0,26);
  const ana = shuffle(G.filter(q=>ANALYSIS_CATS.includes(q.cat))).slice(0,14);
  const listen = []; for(const ri of shuffle(LR.map((r,i)=>i))){ if(listen.length>=20) break; listen.push(...LQ.filter(q=>q.ri===ri).slice(0, 20-listen.length)); }
  startSession('اختبار محاكٍ', [...listen, ...reading, ...shuffle([...gram, ...ana])], true);
}
function finish(){
  const list = S.list; let right = 0; const by = {};
  list.forEach((q,i)=>{
    const a = S.answers[i]; const ok = a===q.answer;
    if(S.mock && a!==undefined) record(q.key, q.cat, ok);
    if(ok) right++;
    const g = q.kind==='l' ? 'الاستماع' : q.kind==='w' ? 'مفردات القراءة' : q.kind==='r' ? 'استيعاب المقروء' : (ANALYSIS_CATS.includes(q.cat)?'التحليل الكتابي':CATS[q.cat]);
    by[g] = by[g] || [0,0]; by[g][1]++; if(ok) by[g][0]++;
  });
  const pct = Math.round(100*right/list.length);
  try{ window.clubSfx && window.clubSfx('win'); }catch(e){}
  const mins = Math.round((Date.now()-S.t0)/60000);
  const rows = Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,v])=>{
    const p = Math.round(100*v[0]/v[1]);
    return `<div><div style="display:flex;justify-content:space-between;font-size:.95rem"><span>${k}</span><span class="en" style="font-variant-numeric:tabular-nums">${v[0]} / ${v[1]}</span></div><div class="bar" style="height:10px"><i style="width:${p}%;background:${p>=70?'var(--good)':p>=50?'var(--accent)':'var(--bad)'}"></i></div></div>`;
  }).join('');
  app.classList.remove('wide');
  app.innerHTML = header(true) + `<div class="result"><h2 style="font-size:1.2rem;margin-bottom:6px">${esc(S.title)}: النتيجة</h2>
    <div class="score" dir="ltr" style="text-align:right">${right} / ${list.length}</div>
    <p style="color:var(--ink-soft);margin:4px 0 0">نسبة ${pct}٪ ${S.mock?'— الوقت '+mins+' دقيقة':''}</p>${window.clubCombo?window.clubCombo.line():''}
    <h3 style="font-size:1rem;margin-top:20px">حسب المهارة (الأضعف أولاً)</h3><div class="rows">${rows}</div>
    <div class="navrow"><button class="btn" id="again">${S.mock?'اختبار جديد':'إعادة التدريب'}</button><button class="btn ghost" id="review">مراجعة الإجابات</button></div></div>`;
  $('#home').onclick = ()=>{ stopSpeech(); S=null; home(); };
  $('#again').onclick = ()=> S.mock ? startMock() : startSession(S.title, shuffle(list));
  $('#review').onclick = ()=>{ S.mock=false; S.i=0; renderQ(); };
  window.scrollTo(0,0);
}
home();
</script>
