<title>Core Quest · English Club</title>
<style>
:root{--bg:#f4f9ff;--card:#ffffff;--ink:#1f3a5f;--mute:#5b7391;--line:#cfe2f5;--accent:#3b8fe0;--accent-soft:#dcedff;--good:#2f9e6b;--good-soft:#dff5ea;--bad:#d9683b;--bad-soft:#fdeadf;--gold:#f2b632;--gold-soft:#fff4d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:20px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:34px}
h2{font-size:28px;margin:6px 0 4px}
.sub{color:var(--mute);font-size:20px;margin:0 0 14px}
.pts{background:var(--gold-soft);border:2px solid var(--gold);border-radius:999px;padding:6px 18px;font-weight:700;font-size:22px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:transform .12s,border-color .12s;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.card b{font-size:24px;display:block}
.card span{color:var(--mute);font-size:18px}
.bar{height:12px;background:var(--accent-soft);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.set{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;font:inherit;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer}
.set small{display:block;font-weight:400;color:var(--mute);font-size:16px}
.set.done{background:var(--good-soft);border-color:var(--good)}
.set:hover,.set:focus-visible{border-color:var(--accent);outline:none}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 26px;font:inherit;font-weight:700;font-size:22px;cursor:pointer}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn:hover{filter:brightness(.95)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:10px;font-size:20px}
.steps{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-radius:12px;background:var(--accent-soft);color:var(--mute);font-weight:700;text-align:center;font-size:18px}
.step.on{background:var(--accent);color:#fff}
.step.ok{background:var(--good-soft);color:var(--good)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center}
.word{font-size:46px;font-weight:800;margin:6px 0}
.sent{font-size:28px;margin:10px 0 18px}
.sent u{display:inline-block;min-width:110px;text-decoration:none;border-bottom:4px solid var(--accent);color:var(--accent);font-weight:800}
.opts{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:16px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.word{font-size:38px}.sent{font-size:24px}}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:24px;font-weight:600;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
input.t{font:inherit;font-size:28px;text-align:center;padding:12px;border:3px solid var(--line);border-radius:14px;width:min(100%,420px);color:var(--ink);background:#fff}
input.t:focus{outline:none;border-color:var(--accent)}
.hint{color:var(--mute);font-size:20px;margin-top:8px;letter-spacing:2px}
.msg{min-height:34px;margin-top:14px;font-size:24px;font-weight:700}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.count{color:var(--mute);font-size:18px;margin-bottom:6px}
.big{font-size:64px}
.fw{font-size:18px;color:var(--mute);margin-top:30px;text-align:center}
</style>
</head>

  app.innerHTML=h+`</div>`;window.scrollTo(0,0)}
let S=null;
function run(z,i){S={z,i,g:sets[z][i],step:0,idx:0,q:[],miss:0};if(window.clubCombo)clubCombo.start('cq',z+'-'+i);learn()}
function stepbar(){const n=['1 · Learn','2 · Choose','3 · Spell'];return `<div class="steps">${n.map((t,k)=>`<div class="step ${k<S.step?'ok':k===S.step?'on':''}">${t}</div>`).join('')}</div>`}
function shell(inner){app.innerHTML=head()+`<button class="back" onclick="zone(${S.z})">← Back to ${ZONES[S.z][0]}</button>`+stepbar()+`<div class="panel">${inner}</div>`;window.scrollTo(0,0)}
// STEP 1
function learn(){S.step=0;const w=S.g[S.idx];
  shell(`<div class="count">Word ${S.idx+1} of ${S.g.length}</div><div class="word">${esc(w.w)}</div><div class="sent">${esc(w.s)}</div>
  <div class="row"><button class="btn ghost" onclick="speak(S.g[S.idx].w)">🔊 Word</button><button class="btn ghost" onclick="speak(S.g[S.idx].s)">🔊 Sentence</button></div>
  <div class="row">${S.idx>0?'<button class="btn ghost" onclick="S.idx--;learn()">← Previous</button>':''}<button class="btn" onclick="${S.idx<S.g.length-1?'S.idx++;learn()':'startChoose()'}">${S.idx<S.g.length-1?'Next →':'Start practice →'}</button></div>`)}
// STEP 2
function startChoose(){S.step=1;S.q=shuffle(S.g.map(x=>x));S.idx=0;choose()}
function blank(w){return esc(w.s).replace(new RegExp(esc(w.a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),'<u>&nbsp;</u>')}
function choose(){
  if(!S.q.length)return startSpell();
  const w=S.q[0],multi=w.a.includes(' ');
  let pool=shuffle(W.filter(x=>x.c===S.z&&x.n!==w.n&&x.a.toLowerCase()!==w.a.toLowerCase()&&x.a.includes(' ')===multi));
  const seen=new Set([w.a.toLowerCase()]),opts=[w.a];
  for(const p of pool){if(opts.length>=4)break;if(!seen.has(p.a.toLowerCase())){seen.add(p.a.toLowerCase());opts.push(p.a)}}
  const o=shuffle(opts);
  shell(`<div class="count">${S.q.length} left</div><div class="sent">${blank(w)}</div><div>Choose the missing word:</div>
  <div class="opts">${o.map(x=>`<button class="opt" data-v="${esc(x)}" onclick="pick(this)">${esc(x)}</button>`).join('')}</div><div class="msg" id="msg"></div>`)}
function pick(b){
  const w=S.q[0];if(document.querySelector('.opt.right'))return;
  if(b.dataset.v===w.a){if(window.clubCombo)clubCombo.hit(true);b.classList.add('right');$('msg').className='msg good';$('msg').textContent='Great! ✔';speak(w.s);S.q.shift();setTimeout(choose,1300)}
  else{if(window.clubCombo)clubCombo.hit(false);b.classList.add('wrong');$('msg').className='msg bad';$('msg').textContent='Not quite. We will ask it again.';S.miss++;S.q.push(S.q.shift());
    document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.v===w.a)x.classList.add('right')});setTimeout(choose,1800)}}
// STEP 3
function startSpell(){S.step=2;S.q=shuffle(S.g.map(x=>x));spell()}
function hint(w){return w.a.split('').map((c,i)=>c===' '?'  ':(i===0?c:'_')).join(' ')}
function spell(){
  if(!S.q.length)return finish();
  const w=S.q[0];
  shell(`<div class="count">${S.q.length} left</div><div class="sent">${blank(w)}</div><div>Type the missing word:</div>
  <div class="hint">${esc(hint(w))}</div><div style="margin-top:14px"><input class="t" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="row"><button class="btn" id="chk" onclick="check()">Check</button><button class="btn ghost" onclick="speak(S.q[0].s.replace(S.q[0].a,'blank'))">🔊 Listen</button></div><div class="msg" id="msg"></div>`);
  const i=$('inp');i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
let lock=false;
function check(){
  if(lock)return;const w=S.q[0],v=$('inp').value.trim().toLowerCase().replace(/’/g,"'");
  if(!v)return;
  if(v===w.a.toLowerCase().replace(/’/g,"'")){lock=true;if(window.clubCombo)clubCombo.hit(true);$('msg').className='msg good';$('msg').textContent='Perfect! ✔ '+w.a;speak(w.s);S.q.shift();setTimeout(()=>{lock=false;spell()},1400)}
  else{lock=true;if(window.clubCombo)clubCombo.hit(false);$('msg').className='msg bad';$('msg').innerHTML='Answer: <b>'+esc(w.a)+'</b>. We will ask it again.';S.miss++;S.q.push(S.q.shift());setTimeout(()=>{lock=false;spell()},2200)}}
function finish(){
  const key=S.z+'-'+S.i,first=!store.done[key];let got=0;
  if(first){got=PTS;store.done[key]=1;store.pts+=PTS;save();
    try{window.dispatchEvent(new CustomEvent('coreQuestPoints',{detail:{points:PTS,zone:S.z,set:S.i+1}}))}catch(e){}}
  S.step=3;
  const next=sets[S.z][S.i+1]?`<button class="btn" onclick="run(${S.z},${S.i+1})">Next set →</button>`:'';
  app.innerHTML=head()+`<div class="panel"><div class="big">🎉</div><h2>Set ${S.i+1} complete!</h2>
  <p>${first?`You earned <b>+${PTS} points</b>.`:'Practice again any time. Points are given only the first time.'}</p>
  <p>Words learned: <b>${S.g.length}</b> · Mistakes fixed: <b>${S.miss}</b></p>${window.clubCombo?clubCombo.line():''}
  <div class="row">${next}<button class="btn ghost" onclick="zone(${S.z})">Back to ${ZONES[S.z][0]}</button></div></div>`}
home();
</script>
