<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/icons/kids-apple-180.png?v=2"><link rel="icon" type="image/png" href="../assets/icons/kids-192.png?v=2"><meta name="apple-mobile-web-app-title" content="نادي البراعم"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>نادي البراعم · English Club Kids</title>
<meta name="description" content="English for young learners: letters, numbers, colors, shapes, words with pictures and simple phrases — with sound and games.">
<meta name="theme-color" content="#FFC93C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="../assets/sfx.js?v=9"></script>
<style>
/* Kids club: big picture cards, sound on every tap, short "listen and touch" games with stars and stickers. */
:root{color-scheme:light;--bg:#FFF9EC;--card:#fff;--ink:#2A2440;--muted:#6B6585;--line:#F1E6CC;--ok:#22A060;--bad:#E5484D;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;--en:"Baloo 2","Comic Sans MS","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--ar);font-size:20px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:radial-gradient(#FBE7B4 1.4px,transparent 1.4px);background-size:26px 26px}
[hidden]{display:none!important}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.homeBtn,.backBtn{font:inherit;font-weight:800;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink);font-size:1rem}
.stars{font-family:var(--en);font-weight:800;font-size:1.3rem;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;box-shadow:3px 3px 0 var(--ink)}
.hero{text-align:center;margin:8px 0 18px}
.hero .mascot{font-size:4.2rem;line-height:1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.hero h1{margin:6px 0 0;font-size:clamp(2.1rem,8vw,3rem);line-height:1.15}
.hero h1 .en{display:block;font-size:.62em;color:#FF7A1A}
.hero p{margin:6px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--t,#fff);border:3px solid var(--ink);border-radius:26px;padding:14px 8px 12px;text-align:center;box-shadow:5px 5px 0 var(--ink);transition:transform .15s var(--ease)}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tile:focus-visible{outline:4px solid #FF7A1A;outline-offset:3px}
.tile .i{display:block;font-size:3rem;line-height:1.2}
.tile b{display:block;font-size:1.25rem;line-height:1.3}
.tile .en{display:block;font-size:1.05rem;color:var(--c,#555);font-weight:800}
h2.sec{font-size:1.4rem;margin:26px 4px 12px}
.panel h2{margin:4px 0 4px;font-size:1.6rem;text-align:center}
.panel .sub{text-align:center;color:var(--muted);margin:0 0 14px}
.modes{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.modes button{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:8px 20px;cursor:pointer;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.modes button[aria-pressed=true]{background:#FFD23F}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 6px;text-align:center;transition:transform .15s var(--ease),border-color .2s}
.card:hover{border-color:var(--ink)}
.card.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.12) rotate(-3deg)}}
.card .big{display:block;font-size:3.2rem;line-height:1.25}
.card .w{display:block;font-family:var(--en);font-weight:800;font-size:1.35rem;direction:ltr;line-height:1.2}
.card .a{display:block;direction:rtl;color:var(--muted);font-size:1rem}
.letter{font-family:var(--en);font-weight:800;font-size:3rem;line-height:1.1;direction:ltr;display:block}
.blob{width:72px;height:72px;border-radius:50%;margin:4px auto;border:3px solid var(--ink);display:block}
.shape svg{width:78px;height:78px;display:block;margin:2px auto}
.shape svg *{fill:var(--sc,#FF7A1A);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.phr{display:grid;gap:10px}
.ph{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px 14px}
.ph .big{font-size:2.4rem;flex:none}
.ph .w{font-family:var(--en);font-weight:800;font-size:1.35rem;direction:ltr;text-align:left;flex:1}
.ph .a{color:var(--muted);font-size:1rem;flex:none;max-width:42%}
.ph.pop{animation:pop .45s var(--ease)}
/* game */
.game{text-align:center}
.gtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;background:#EDE3C8;border:2px solid var(--ink)}.dots i.on{background:#FFD23F}
.ask{font-size:1.25rem;font-weight:800;margin:6px 0 10px}
.again{font:inherit;font-weight:800;font-size:1.2rem;border:3px solid var(--ink);background:#FF7A1A;color:#fff;border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.count{font-size:2.6rem;line-height:1.3;letter-spacing:4px;margin:0 0 14px;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:460px;margin:0 auto}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:24px;min-height:130px;display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink);padding:8px}
.opt .big{font-size:3.6rem;line-height:1}
.opt .letter{font-size:3.6rem}
.opt.right{background:#DFF7E8;border-color:var(--ok);animation:pop .45s var(--ease)}
.opt.wrong{background:#FDE4E4;border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.done{text-align:center;padding:10px}
.done .big{font-size:5rem;line-height:1.2}
.done h3{font-size:1.8rem;margin:6px 0}
.burst{position:fixed;pointer-events:none;font-size:2rem;z-index:50;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.pgnav,.pgnav button,.wbtns,.wbtns button{direction:ltr}
.voicetip{background:#FFF1DC;color:#6b3d00;border-radius:16px;padding:10px 14px;font-size:1rem;margin-top:16px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.book span{background:#fff;border:3px dashed #E8D9B5;border-radius:18px;font-size:2.6rem;display:grid;place-items:center;aspect-ratio:1}
.book span.got{border:3px solid var(--ink);background:#FFF3C4}
.book span:not(.got){filter:grayscale(1);opacity:.35}
.acc{display:flex;justify-content:center;gap:6px;margin-top:20px;color:var(--muted);font-size:1rem;align-items:center}
.acc button{font:inherit;font-weight:800;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:3px 12px;cursor:pointer}
.acc button[aria-pressed=true]{background:var(--ink);color:#fff}
.wrow{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.wchip{flex:none;font-family:var(--en);font-weight:800;font-size:1.3rem;min-width:46px;height:46px;border:3px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink)}
.wchip.ok{background:#E1F6EC;border-color:#9ED8B8}.wchip.on{border-color:var(--ink);background:#FFD23F}
.wboard{position:relative;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:5px 5px 0 var(--ink);touch-action:none;overflow:hidden;max-width:560px;margin:0 auto}
.wboard canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.wpic{position:absolute;top:8px;right:10px;text-align:center;pointer-events:none;line-height:1.1}
.wpic span{display:block;font-size:2.2rem}.wpic b{font-size:1rem;color:var(--muted)}
.wmsg{text-align:center;font-weight:800;font-size:1.2rem;min-height:2em;margin:12px 0 6px}.wmsg.ok{color:var(--ok)}.wmsg.no{color:var(--bad)}
.wbtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.wbtns button{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.wbtns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.inst{display:flex;align-items:center;gap:12px;background:#FFFBEA;margin-top:12px!important;border:3px solid var(--ink);border-radius:24px;padding:10px 14px;box-shadow:4px 4px 0 var(--ink);margin:0 0 6px;flex-wrap:wrap}
.inst img{width:58px;height:58px;border-radius:14px;flex:none}
.inst .tx{flex:1;min-width:160px}.inst .tx>b{display:block;font-size:1.15rem}.inst ol b{color:var(--ink)}.inst small{display:block;color:var(--muted);font-size:1rem;line-height:1.6}
.inst button{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid var(--ink);background:#FFD23F;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--ink)}
.inst ol{margin:6px 0 0;padding-inline-start:22px;font-size:1.05rem;line-height:1.8}
.rpic{display:grid;place-items:center;min-height:120px;margin:4px 0 14px}.rpic .big{font-size:5rem;line-height:1.1}.rpic .letter{font-size:5rem}.rpic .blob{width:100px;height:100px}.rpic .shape svg{width:110px;height:110px}
.ropts{display:grid;gap:10px;max-width:460px;margin:0 auto}
.ropt{min-height:64px;font-family:var(--en);font-weight:800;font-size:1.45rem;direction:ltr;padding:8px 14px}
.slots{display:flex;justify-content:center;gap:8px;direction:ltr;margin:6px 0 16px;flex-wrap:wrap}
.slot{width:56px;height:64px;border-bottom:5px solid var(--ink);font-family:var(--en);font-weight:800;font-size:2.4rem;display:grid;place-items:center;color:var(--ok)}
.ltiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;direction:ltr;max-width:480px;margin:0 auto}
.lt{all:unset;cursor:pointer;width:62px;height:62px;border:3px solid var(--ink);border-radius:16px;background:#FFF3C4;font-family:var(--en);font-weight:800;font-size:2rem;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.lt.used{visibility:hidden}.lt.wrong{background:#FDE4E4;border-color:var(--bad);animation:shake .4s}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto}
@media(min-width:560px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mc{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;min-height:84px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;background:#0D9488;color:#fff;font-size:2rem;box-shadow:3px 3px 0 var(--ink);transition:transform .2s}
.mc.open{background:#fff;color:var(--ink)}.mc.got{background:#DFF7E8;border-color:var(--ok);cursor:default}
.mc .big{font-size:2.6rem}.mc .w{font-family:var(--en);font-weight:800;font-size:1.15rem;direction:ltr;line-height:1.1;padding:2px;text-align:center}
.fb{min-height:1.7em;font-weight:800;font-size:1.25rem;text-align:center;margin:10px 0 4px}.fb.no{color:#C2410C}.fb.ok{color:var(--ok)}
.hint{animation:glow 1s ease-in-out infinite;border-color:var(--ok)!important;background:#F0FDF4!important}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(34,160,96,.28),3px 3px 0 var(--ink)}}
.tag{display:inline-block;background:#FFF3C4;border:2px dashed #B7791F;color:#7A4B00;border-radius:14px;padding:4px 12px;font-weight:800;font-size:1.05rem;margin:0 0 8px}
.gwrap{text-align:center}
.revbox{background:#FFF8E1;border:3px solid var(--ink);border-radius:24px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);margin:8px 0 6px;text-align:center}
.revbox b{font-size:1.3rem;display:block}.revbox small{display:block;color:var(--muted);font-size:1.05rem;margin:2px 0 8px}
.revbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.revbtns button{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.lvh{font-size:1.25rem;margin:18px 0 8px;font-weight:800}.lvh small{display:block;color:var(--muted);font-size:1rem;font-weight:700}
.pg.long .s{font-size:clamp(1.15rem,5vw,1.5rem);line-height:1.4}.pg.long .pic{font-size:clamp(3rem,13vw,4.4rem)}.pg.long .ta{font-size:1.05rem}
.pg.vocab{background:linear-gradient(160deg,#ECFDF5,#D1FAE5);gap:4px;padding-top:14px}.pg.vocab h3{font-size:1.6rem}.pg.vocab .cv-ar{font-size:1.05rem}
.vlist{display:grid;gap:6px;width:100%;max-width:340px}
.vw{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px;box-shadow:2px 2px 0 var(--ink)}
.vw b{font-family:var(--en);font-size:1.2rem;direction:ltr}.vw span{font-size:1.1rem;font-weight:700;color:var(--muted)}
.vlist.two{grid-template-columns:1fr 1fr;max-width:380px}.vlist.two .vw{flex-direction:column;gap:0;padding:4px 6px;text-align:center}.vlist.two .vw b{font-size:1.15rem}.vlist.two .vw span{font-size:1rem}
.qopts-t{display:grid;gap:10px;max-width:460px;margin:0 auto}
.storyhub{background:linear-gradient(135deg,#F3E8FF,#FFF1F8 60%,#FFF7D6);border:3px solid var(--ink);border-radius:28px;box-shadow:5px 5px 0 var(--ink);padding:14px 14px 16px;margin:4px 0 8px}
.storyhub .hd{display:flex;align-items:center;gap:12px}
.storyhub .hd .bk{font-size:3.2rem;line-height:1;animation:bob 2.8s ease-in-out infinite}
.storyhub h2{margin:0;font-size:1.55rem}.storyhub p{margin:2px 0 0;color:var(--muted);font-size:1.05rem}
.today{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 12px;margin:12px 0 10px;box-shadow:3px 3px 0 var(--ink)}
.today .ic{font-size:3rem;line-height:1;width:72px;height:72px;display:grid;place-items:center;border-radius:18px;flex:none}
.today small{display:block;color:#9333EA;font-weight:800;font-size:1rem}.today b{display:block;font-size:1.3rem}.today .en{color:var(--muted);font-weight:800;font-size:1.05rem}
.today .go{margin-inline-start:auto;font-size:1.6rem}
.covers{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.cov{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:118px;scroll-snap-align:start;border:3px solid var(--ink);border-radius:8px 18px 18px 8px;padding:10px 6px;text-align:center;box-shadow:3px 3px 0 var(--ink);position:relative}
.cov .ic{font-size:2.6rem;line-height:1.2;display:block}.cov b{display:block;font-size:1rem;line-height:1.25;margin-top:4px}
.cov .lv{position:absolute;top:-10px;inset-inline-start:6px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.8rem;padding:0 6px}
.allbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:#9333EA;color:#fff;font-weight:800;font-size:1.2rem;border:3px solid var(--ink);border-radius:999px;padding:10px;box-shadow:3px 3px 0 var(--ink)}
.advhub{background:linear-gradient(135deg,#E0F2FE,#EDE9FE);border:3px solid var(--ink);border-radius:28px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:4px 0 8px}
.advhub>p{margin:0 0 12px;color:var(--muted);font-size:1.05rem;text-align:center}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--ink);color:var(--ok)}
.gsent{font-family:var(--en);font-weight:800;font-size:clamp(1.5rem,6.5vw,2rem);direction:ltr;margin:6px 0 2px;line-height:1.35}
.gar{color:var(--muted);font-size:1.15rem;margin:0 0 12px}
.opp{font-family:var(--en);font-weight:800;font-size:2.2rem;direction:ltr;margin:4px 0 12px}
.oslots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:ltr;min-height:64px;border:3px dashed #CFC3A3;border-radius:18px;padding:10px;margin:8px 0 14px;background:#fff}
.oslots .ow{background:#DFF7E8;border-color:var(--ok)}
.owords{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:ltr}
.ow{all:unset;cursor:pointer;font-family:var(--en);font-weight:800;font-size:1.45rem;border:3px solid var(--ink);border-radius:14px;background:#FFF3C4;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.ow.used{visibility:hidden}.ow.wrong{background:#FDE4E4;border-color:var(--bad);animation:shake .4s}
.slots.sm .slot{width:34px;height:48px;font-size:1.8rem;border-bottom-width:4px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bookwrap{perspective:1800px;max-width:470px;margin:0 auto;padding:4px 10px 10px 4px}
.sbook{position:relative;height:0;padding-bottom:133%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.sbook::before,.sbook::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border:3px solid var(--ink);border-radius:6px 22px 22px 6px;background:#F6EEDB}
.sbook::before{transform:translate(8px,8px)}.sbook::after{transform:translate(4px,4px);background:#FBF5E8}
.leaf,.flip{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1}
.flip{z-index:3;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.flip .shade{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:6px 22px 22px 6px;background:linear-gradient(90deg,rgba(42,36,64,0),rgba(42,36,64,.35));opacity:var(--sh,0);pointer-events:none}
.pg{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,#E9DCBF 0,#FFF9EC 7%,#FFFDF7 60%,#FFF8EA 100%);border:3px solid var(--ink);border-radius:6px 22px 22px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 20px 40px 28px;text-align:center;overflow:hidden}
.pg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(90deg,rgba(42,36,64,.18),rgba(42,36,64,0))}
.pg .pic{font-size:clamp(3.6rem,17vw,5.6rem);line-height:1.2;letter-spacing:4px;direction:ltr}
.pg .s{font-family:var(--en);font-weight:800;font-size:clamp(1.45rem,6.4vw,1.95rem);line-height:1.35;margin:10px 0 0;direction:ltr}
.pg .wd{cursor:pointer;border-radius:8px;padding:0 2px}
.pg .wd.hl{animation:hl .9s}
@keyframes hl{0%,60%{background:#FFD23F}100%{background:transparent}}
.pg .ta{color:var(--muted);font-size:1.15rem;margin:4px 0 0}
.pg .no{position:absolute;bottom:10px;left:0;right:0;font-family:var(--en);font-weight:800;color:#B9AE95;font-size:1rem}
.pg .spk{position:absolute;top:12px;right:12px;font-size:1.5rem;border:3px solid var(--ink);background:#FFD23F;border-radius:50%;width:52px;height:52px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pg.cover{background:linear-gradient(160deg,#B794F6,#7C3AED);color:#fff}
.pg.cover::before{width:22px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.cv-ic{font-size:6rem;line-height:1.1;background:#fff;border:4px solid var(--ink);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;box-shadow:4px 4px 0 var(--ink)}
.pg h3{font-family:var(--en);font-size:2.1rem;margin:12px 0 0;line-height:1.15}
.cv-ar{font-size:1.3rem;font-weight:800;margin:0}
.cv-hint{position:absolute;bottom:14px;font-size:1rem;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:2px 14px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px)}}
.pg.end{background:linear-gradient(160deg,#FFF3C4,#FFE08A)}
.scene{background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:5px 5px 0 var(--ink);padding:18px 14px;text-align:center;max-width:560px;margin:0 auto}
.scene .pic{font-size:4.6rem;line-height:1.2;min-height:120px;display:grid;place-items:center;letter-spacing:4px}
.scene .s{all:unset;cursor:pointer;display:block;font-family:var(--en);font-weight:800;font-size:1.7rem;direction:ltr;line-height:1.35;margin:10px 0 4px}
.scene .ta{color:var(--muted);font-size:1.15rem}
.pgnav{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:560px;margin:14px auto 0}
.pgnav button{font:inherit;font-weight:800;font-size:1.1rem;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pgnav button:disabled{opacity:.35;cursor:default}
footer{text-align:center;color:var(--muted);font-size:.95rem;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 {lv:2,t:'The Lost Kitten',ar:'القطة الضائعة',ic:'🐈',v:[['rainy','ممطر'],['lost','ضائع'],['warm','دافئ'],['poster','ملصق'],['knock','يطرق']],p:[['🌧️👦','It is a rainy day. Omar is walking home.','إنه يوم ممطر. عمر يمشي إلى البيت.'],['🐱😿','He hears a small sound: "Meow, meow!"','يسمع صوتاً صغيراً: «مياو، مياو!»'],['👦🐱','"Hello, little kitten. Are you lost?"','«مرحباً أيتها القطة الصغيرة. هل أنتِ ضائعة؟»'],['🏠🧣🐱','Omar takes the kitten home. He gives it a warm blanket.','يأخذ عمر القطة إلى البيت. يعطيها بطانية دافئة.'],['📝🐱','Omar and his mother make a poster: "Lost kitten!"','يصنع عمر وأمه ملصقاً: «قطة ضائعة!»'],['🚪✊','The next day, a woman knocks on the door.','في اليوم التالي، تطرق امرأة الباب.'],['👩🐱❤️','"That is my kitten, Snowy! Thank you, Omar!"','«هذه قطتي سنوي! شكراً لك يا عمر!»'],['👦😊','Omar is happy. He helped a friend.','عمر سعيد. لقد ساعد صديقاً.']],
  q:[['What is the weather?','كيف الجو؟','🌧️','☀️','❄️'],['What does Omar give the kitten?','ماذا يعطي عمر القطة؟','a blanket','a ball','an apple'],['What is the kitten\'s name?','ما اسم القطة؟','Snowy','Mimi','Bunny'],['Is Omar kind?','هل عمر لطيف؟','Yes','No']]},
 {lv:2,t:'Sports Day',ar:'يوم الرياضة',ic:'🏃',v:[['race','سباق'],['fast','بسرعة'],['fall down','يسقط'],['together','معاً'],['clap','يصفق']],p:[['🏫🏃','Today is sports day at school.','اليوم هو يوم الرياضة في المدرسة.'],['👦👦','Fahd and Saad are in the race.','فهد وسعد في السباق.'],['🏁📣','"Ready, set, go!" says the teacher.','«استعد، انطلق!» يقول المعلم.'],['🏃💨🏃','Fahd runs fast. Saad runs fast, too.','يجري فهد بسرعة. ويجري سعد بسرعة أيضاً.'],['👦💥','Oh no! Saad falls down.','يا للأسف! يسقط سعد.'],['👦🤝👦','Fahd stops. "Are you OK? Take my hand."','يتوقف فهد. «هل أنت بخير؟ خذ يدي.»'],['🏁👬','They run to the finish line together.','يجريان معاً إلى خط النهاية.'],['👏🏅','Everyone claps. "You are good friends!"','يصفق الجميع. «أنتما صديقان رائعان!»']],
  q:[['Who falls down?','من يسقط؟','Saad','Fahd','the teacher'],['What does Fahd say?','ماذا يقول فهد؟','Are you OK?','Go away!','Good night!'],['How do they finish?','كيف ينهيان السباق؟','👬','🏃','🚌'],['Fahd is a good …','فهد…','friend','cat','teacher']]},
 {lv:2,t:'The Little Seed',ar:'البذرة الصغيرة',ic:'🌱',v:[['seed','بذرة'],['soil','تراب'],['water','يسقي / ماء'],['grow','ينمو'],['sunflower','دوّار الشمس']],p:[['👧🌰','Lina has a tiny seed.','لدى لينا بذرة صغيرة جداً.'],['🪴👧','She puts it in a pot with soil.','تضعها في أصيص فيه تراب.'],['💧🪴','Every day, she gives it water.','تسقيها كل يوم.'],['☀️🪴','The seed needs the sun, too.','البذرة تحتاج إلى الشمس أيضاً.'],['🌱😮','One morning, Lina sees a little green plant!','في صباح أحد الأيام، ترى لينا نبتة خضراء صغيرة!'],['🌿📏','The plant grows tall, taller and taller.','تنمو النبتة طويلة، وأطول، وأطول.'],['🌻','Now it is a big yellow sunflower!','الآن هي زهرة دوّار شمس صفراء كبيرة!'],['🌻👧👫','Lina gives new seeds to her friends.','تعطي لينا بذوراً جديدة لأصدقائها.']],
  q:[['What does Lina put in the pot?','ماذا تضع لينا في الأصيص؟','🌰','🍎','⚽'],['What does the plant need?','ماذا تحتاج النبتة؟','💧','🍫','📺'],['What grows first?','ماذا ينمو أولاً؟','🌱','🌻','🌳'],['What color is the sunflower?','ما لون دوّار الشمس؟','yellow','blue','black']]},
 {lv:2,t:'Grandpa\'s Farm',ar:'مزرعة جدي',ic:'👴',v:[['mountains','جبال'],['farm','مزرعة'],['goat','ماعز'],['hen','دجاجة'],['honey','عسل']],p:[['🚗⛰️','We drive to the mountains to see Grandpa.','نذهب بالسيارة إلى الجبال لزيارة جدي.'],['👴🏡','Grandpa has a farm. "Welcome!" he says.','لدى جدي مزرعة. «أهلاً وسهلاً!» يقول.'],['🐐🐐🐐','I see three goats. "Maa, maa!"','أرى ثلاث معزات. «ماع، ماع!»'],['🐓🥚🥚','The hen has two eggs.','لدى الدجاجة بيضتان.'],['🍇🧺','We pick sweet grapes.','نقطف عنباً حلواً.'],['🍯😋','Grandpa gives us honey. It is very sweet!','يعطينا جدي عسلاً. إنه حلو جداً!'],['🌙🫖👴','At night, we sit with Grandpa and drink tea.','في الليل نجلس مع جدي ونشرب الشاي.'],['❤️👴','I love Grandpa\'s farm!','أحب مزرعة جدي!']],
  q:[['Where is the farm?','أين المزرعة؟','in the mountains','at the beach','in the city'],['How many goats?','كم معزة؟','3️⃣','2️⃣','5️⃣'],['What do they pick?','ماذا يقطفون؟','🍇','🍌','🥕'],['What does Grandpa give us?','ماذا يعطينا جدي؟','honey','milk','juice']]},
 /* Level 3: longer stories told in the past, with a lesson */
 {lv:3,t:'The Clever Crow',ar:'الغراب الذكي',ic:'🐦',v:[['thirsty','عطشان'],['jar','جرة'],['stone','حجر'],['idea','فكرة'],['give up','يستسلم']],p:[['🐦☀️','It was a very hot day. A crow was very thirsty.','كان يوماً حاراً جداً. وكان الغراب عطشان جداً.'],['🐦🔍','He flew and flew. He looked for water.','طار وطار، وبحث عن الماء.'],['🏺','At last, he saw a tall jar. There was a little water at the bottom.','أخيراً رأى جرة طويلة. كان في قاعها قليل من الماء.'],['🐦😟','He put his beak in the jar, but he could not reach the water.','وضع منقاره في الجرة، لكنه لم يستطع الوصول إلى الماء.'],['🐦💡','The crow stopped and thought. "I have an idea!"','توقف الغراب وفكّر. «لديّ فكرة!»'],['🪨🏺','He picked up a small stone and dropped it into the jar. Plop!','التقط حجراً صغيراً وأسقطه في الجرة. بلوب!'],['🪨🪨🪨','One stone, two stones, three stones… The water came up, up, up!','حجر، حجران، ثلاثة أحجار… وارتفع الماء إلى الأعلى!'],['🐦💧😊','Now the crow could drink. He was not thirsty anymore.','الآن استطاع الغراب أن يشرب. ولم يعد عطشان.'],['💡💪','Think hard, and do not give up!','فكّر جيداً، ولا تستسلم!']],
  q:[['What was the problem?','ما المشكلة؟','He was thirsty.','He was hungry.','He was cold.'],['What did he put in the jar?','ماذا وضع في الجرة؟','🪨','🍎','🪶'],['What did the water do?','ماذا حدث للماء؟','It came up.','It went down.','It turned red.'],['What is the lesson?','ما الدرس؟','Think and do not give up.','Sleep all day.','Eat a lot.']]},
 {lv:3,t:'Noura\'s First Day',ar:'أول يوم لنورة',ic:'🎒',v:[['first','أول'],['shy','خجول'],['smile','يبتسم'],['share','يشارك'],['break time','الفسحة']],p:[['👧🎒🏫','It was Noura\'s first day at a new school.','كان أول يوم لنورة في مدرسة جديدة.'],['👧😟','She felt shy. She did not know anyone.','شعرت بالخجل. لم تكن تعرف أحداً.'],['👩‍🏫😊','The teacher smiled. "Welcome, Noura! Please sit here."','ابتسمت المعلمة. «أهلاً يا نورة! اجلسي هنا من فضلك.»'],['👧🖍️👧','A girl sat next to her. "Hi! I am Reem. Do you want to share my colors?"','جلست بجانبها بنت. «مرحباً! أنا ريم. هل تريدين أن تشاركيني ألواني؟»'],['🎨🌈','They drew a big rainbow together.','رسمتا معاً قوس قزح كبيراً.'],['🥪🧃','At break time, they ate sandwiches and talked.','في وقت الفسحة، أكلتا الشطائر وتحدثتا.'],['👧🏃👩','After school, Noura ran to her mother. "I have a new friend!"','بعد المدرسة، ركضت نورة إلى أمها. «لديّ صديقة جديدة!»'],['😊💛','A smile can make a new friend.','الابتسامة تصنع صديقاً جديداً.']],
  q:[['How did Noura feel at first?','كيف شعرت نورة في البداية؟','shy','angry','sleepy'],['Who is Reem?','من هي ريم؟','a new friend','the teacher','her sister'],['What did they draw?','ماذا رسمتا؟','🌈','🏠','🚗'],['What did Noura tell her mother?','ماذا قالت نورة لأمها؟','I have a new friend!','I am hungry!','Good night!']]},
 {lv:3,t:'A Trip to the Moon',ar:'رحلة إلى القمر',ic:'🚀',v:[['sky','سماء'],['dream','حلم'],['rocket','صاروخ'],['space','الفضاء'],['astronaut','رائد فضاء']],p:[['👦🔭🌙','Yousef loved the night sky. Every night, he looked at the moon.','كان يوسف يحب سماء الليل. كل ليلة كان ينظر إلى القمر.'],['🚀😮','One night, he had a dream. He was in a big rocket!','في إحدى الليالي حلم حلماً. كان في صاروخ كبير!'],['🔟➡️1️⃣','"Ten, nine, eight… three, two, one… Go!"','«عشرة، تسعة، ثمانية… ثلاثة، اثنان، واحد… انطلق!»'],['🚀✨','The rocket flew up into space. It was dark and quiet.','طار الصاروخ إلى الفضاء. كان المكان مظلماً وهادئاً.'],['🌍','Yousef looked out of the window. The Earth was small, blue and beautiful.','نظر يوسف من النافذة. كانت الأرض صغيرة وزرقاء وجميلة.'],['🌕👣','He landed on the moon. He jumped high, high, high!','هبط على القمر، وقفز عالياً، عالياً، عالياً!'],['⏰🛏️','Then… ring, ring! It was morning. It was only a dream.','ثم… رن، رن! كان الصباح. كان ذلك مجرد حلم.'],['👦👨‍🚀','"When I grow up, I want to be an astronaut!" said Yousef.','قال يوسف: «عندما أكبر أريد أن أكون رائد فضاء!»']],
  q:[['What did Yousef love?','ماذا كان يوسف يحب؟','🌙','⚽','🍕'],['What color was the Earth?','ما لون الأرض؟','blue','red','yellow'],['Was the trip real?','هل كانت الرحلة حقيقية؟','No, it was a dream.','Yes, it was real.'],['What does Yousef want to be?','ماذا يريد يوسف أن يكون؟','👨‍🚀','👨‍🍳','👨‍🚒']]},
 {lv:3,t:'The Honest Boy',ar:'الصبي الأمين',ic:'👛',v:[['market','سوق'],['wallet','محفظة'],['worried','قلق'],['honest','أمين'],['proud','فخور']],p:[['👨👦🛒','Khalid went to the market with his father.','ذهب خالد إلى السوق مع أبيه.'],['👛👀','On the ground, he saw a brown wallet.','رأى على الأرض محفظة بنية.'],['👛💵','He opened it. There was a lot of money inside!','فتحها. كان فيها مال كثير!'],['👦🤔','"This is not mine," said Khalid. "Someone is looking for it."','قال خالد: «هذه ليست لي. هناك من يبحث عنها.»'],['👴😟','He saw an old man. The man looked at the ground. He looked worried.','رأى رجلاً كبيراً في السن ينظر إلى الأرض. كان يبدو قلقاً.'],['👦👛👴','"Excuse me, sir. Is this your wallet?"','«عفواً يا عم، هل هذه محفظتك؟»'],['👴😊','"Yes! Thank you, my son. You are an honest boy."','«نعم! شكراً لك يا بني. أنت صبي أمين.»'],['👨👦❤️','His father smiled. "I am proud of you, Khalid."','ابتسم أبوه: «أنا فخور بك يا خالد.»']],
  q:[['Where did Khalid go?','إلى أين ذهب خالد؟','to the market','to the beach','to the zoo'],['What did he find?','ماذا وجد؟','👛','⚽','📱'],['How did the old man feel first?','كيف كان شعور الرجل أولاً؟','worried','happy','sleepy'],['Khalid is …','خالد…','honest','lazy','angry']]},
 /* Level 4: advanced — longer stories, dialogue, true/false questions */
 {lv:4,t:'The Lion and the Mouse',ar:'الأسد والفأر',ic:'🦁',v:[['net','شبكة'],['roar','يزأر'],['caught','أمسك / وقع'],['rope','حبل'],['free','حرّ'],['bite','يقضم']],p:[['🦁😴','One hot afternoon, a big lion was sleeping under a tree.','في ظهيرة يوم حار، كان أسد كبير نائماً تحت شجرة.'],['🐭🏃','A little mouse ran over his nose by mistake.','ركض فأر صغير فوق أنفه بالخطأ.'],['🦁🐾🐭','The lion woke up and caught the mouse in his paw.','استيقظ الأسد وأمسك الفأر بمخلبه.'],['🐭🙏','"Please let me go!" cried the mouse. "One day I will help you."','صاح الفأر: «أرجوك اتركني! سأساعدك يوماً ما.»'],['🦁😂','The lion laughed. "How can a tiny mouse help a king?" But he let him go.','ضحك الأسد: «كيف يساعد فأر صغير ملكاً؟» لكنه تركه.'],['🪢🦁','A few days later, the lion was caught in a hunter\'s net.','بعد أيام قليلة، وقع الأسد في شبكة صياد.'],['🦁📢','He roared and roared, but he could not get out.','زأر وزأر، لكنه لم يستطع الخروج.'],['🐭🦷🪢','The mouse heard him. He ran to the net and bit the ropes.','سمعه الفأر، فركض إلى الشبكة وقضم الحبال.'],['🦁🎉🐭','Snap! The lion was free. "Thank you, my little friend!"','طق! تحرّر الأسد. «شكراً لك يا صديقي الصغير!»'],['💡','Small friends can be great friends.','الأصدقاء الصغار قد يكونون أصدقاء عظماء.']],
  q:[['Where was the lion sleeping?','أين كان الأسد نائماً؟','under a tree','in a house','in the sea'],['Why did the lion laugh?','لماذا ضحك الأسد؟','The mouse was very small.','He saw a funny cat.','He was hungry.'],['How did the mouse help the lion?','كيف ساعد الفأر الأسد؟','He bit the ropes.','He called the hunter.','He gave him water.'],['True or false: The lion let the mouse go.','صح أم خطأ: ترك الأسد الفأر يذهب.','True','False'],['What is the lesson?','ما الدرس؟','Small friends can be great friends.','Lions are always angry.','Mice like cheese.']]},
 {lv:4,t:'The Tortoise and the Hare',ar:'السلحفاة والأرنب',ic:'🐢',v:[['race','سباق'],['slow','بطيء'],['laugh','يضحك'],['rest','يرتاح'],['won','فاز'],['too late','فات الأوان']],p:[['🐇💨','Hare was very fast. He always said, "Nobody is faster than me!"','كان الأرنب سريعاً جداً. وكان يقول دائماً: «لا أحد أسرع مني!»'],['🐢','Tortoise was slow, but he never gave up.','كانت السلحفاة بطيئة، لكنها لم تستسلم أبداً.'],['🐢🗣️🐇','One day, Tortoise said, "Let\'s have a race."','في أحد الأيام قالت السلحفاة: «هيا نتسابق.»'],['🐇😂','Hare laughed. "You? A race with me? OK, let\'s go!"','ضحك الأرنب: «أنتِ؟ تتسابقين معي؟ حسناً، هيا!»'],['🏁🐇💨','The race started. Hare ran far away. Tortoise walked slowly.','بدأ السباق. ركض الأرنب بعيداً، ومشت السلحفاة ببطء.'],['🐇🌳😴','Hare looked back. "She is too slow. I can rest a little." He fell asleep.','نظر الأرنب خلفه: «إنها بطيئة جداً. أستطيع أن أرتاح قليلاً.» ثم نام.'],['🐢🚶','Tortoise walked and walked. She did not stop.','مشت السلحفاة ومشت، ولم تتوقف.'],['🐢🏁','When Hare woke up, Tortoise was near the finish line!','عندما استيقظ الأرنب، كانت السلحفاة قريبة من خط النهاية!'],['🐇💨😱','Hare ran very fast, but it was too late. Tortoise won!','ركض الأرنب بسرعة كبيرة، لكن فات الأوان. فازت السلحفاة!'],['💡','Slow and steady wins the race.','البطء مع المثابرة يفوز بالسباق.']],

function pickVoice(){
  try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}
  const lg=v=>(v.lang||'').replace('_','-').toLowerCase(),want=ACC.toLowerCase(),en=voices.filter(v=>lg(v).startsWith('en'));
  const same=en.filter(v=>lg(v)===want),good=v=>/google|natural|enhanced|premium|samantha|daniel|serena|karen/i.test(v.name);
  VOICE=same.find(good)||same.find(v=>v.localService)||same[0]||en.find(good)||en[0]||null;
  const tip=$('voiceTip');if(tip)tip.hidden=!(voices.length&&!en.length);
}
if(SYN){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){speechSynthesis.onvoiceschanged=pickVoice;}}
let waited=false;
function say(t,rate){
  if(!SYN||!t)return;
  const go=()=>{try{speechSynthesis.cancel();setTimeout(()=>{try{const u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang.replace('_','-'):ACC;if(VOICE)u.voice=VOICE;
    u.rate=rate||.8;u.pitch=1.05;speechSynthesis.speak(u);speechSynthesis.resume&&speechSynthesis.resume();}catch(e){}},70);}catch(e){}};
  if(!VOICE)pickVoice();
  if(!VOICE&&!waited){waited=true;let d=false;const f=()=>{if(d)return;d=true;pickVoice();go();};try{speechSynthesis.addEventListener('voiceschanged',f,{once:true});}catch(e){}setTimeout(f,800);return;}
  go();
}

/* "listen and touch" game: 6 rounds, 4 choices; a star for each first-try answer.
   A wrong answer: try again (the right one glows after two tries), and the question comes back 2 rounds later */
function game(list,read){
  const sec=(read?'r-':'')+SEC.id,N=Math.min(6,list.length),due=fixDue(sec),old=list.filter(x=>due.includes(String(x.key))).slice(0,3);
  const R=shuffle([...old.map(x=>({x,old:1})),...shuffle(list.filter(x=>!old.includes(x))).slice(0,N-old.length).map(x=>({x}))]);
  let r=0,got=0,fixed=0;
  function round(){
    if(r>=R.length)return endScreen(got,N,sec,()=>game(list,read),fixed?FIXNOTE:'');
    const cur=R[r],x=cur.x,opts=shuffle([x,...shuffle(list.filter(y=>y!==x)).slice(0,3)]);let tries=0;
    const numPic=!read&&SEC.id==='num'&&x.key<=10,isPh=SEC.id==='phr'||SEC.id==='cls';
    const top=`<div class="gtop"><div class="dots">${R.map((_,i)=>`<i class="${i<r?'on':''}"></i>`).join('')}</div><span>⭐ ${got}</span></div><div class="gwrap">${tagHTML(cur)}</div>`;
    if(read){
      $('pn').innerHTML=`<div class="game">${top}
        <p class="ask">${isPh?'اقرأ واختر الجملة المناسبة للصورة 📖':'اقرأ واختر الكلمة المناسبة للصورة 📖'}</p><div class="rpic" dir="ltr">${x.pic||x.big}</div>
        <div class="ropts" dir="ltr">${opts.map(o=>`<button class="opt ropt" data-k="${esc(String(o.key))}">${esc(o.w)}</button>`).join('')}</div><p class="fb" id="fb"></p></div>`;
    }else
    $('pn').innerHTML=`<div class="game">${top}
      ${numPic?`<p class="ask">كم عددها؟ اسمع واختر 👂</p><div class="count">${'🍎'.repeat(x.key)}</div>`:`<p class="ask">${SEC.id==='phr'?'اسمع الجملة واختر الصورة المناسبة 👂':SEC.id==='abc'?'اسمع الكلمة واختر الحرف الذي تبدأ به 👂':'اسمع واختر 👂'}</p>`}
      <button class="again" id="again">🔊 اسمع مرة أخرى</button>
      <div class="opts" dir="ltr">${opts.map(o=>`<button class="opt" data-k="${esc(String(o.key))}" aria-label="${esc(o.w)}">${o.opt}</button>`).join('')}</div><p class="fb" id="fb"></p></div>`;
    const play=()=>say(SEC.id==='abc'?x.q:x.say);if(!read){setTimeout(play,350);$('again').onclick=play;}
    const btns=[...$('pn').querySelectorAll('.opt')],good=btns.find(b=>b.dataset.k===String(x.key));
    btns.forEach(b=>b.onclick=()=>{
      if(b.disabled)return;
      if(b===good){b.classList.remove('hint');b.classList.add('right');praise(tries);
        if(!tries){if(!cur.again)got++;else fixed++;if(cur.old)fixRight(sec,x.key);}
        const r0=b.getBoundingClientRect();burst(r0.left+r0.width/2,r0.top+r0.height/2);
        btns.forEach(c=>c.disabled=true);setTimeout(()=>{say(x.say);},150);setTimeout(()=>{r++;round();},1700);}
      else{
        if(!tries&&!cur.again){fixMiss(sec,x.key);R.splice(Math.min(R.length,r+3),0,{x,again:1});}
        tries++;b.disabled=true;b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),450);nudge(tries,good);
        if(!read)say(SEC.id==='abc'?x.q:x.say);}
    });
  }
  round();
}

/* spell it: see the picture, tap the letters in order. A misspelled word comes back 2 words later */
function spell(LIST,KEY){
  LIST=LIST||SPELL;KEY=KEY||'spl';
  const s=SEC;panel(s,KEY==='spl2'?'كلمات أطول للأبطال! اضغط الحروف بالترتيب ✏️':'انظر إلى الصورة، واضغط الحروف بالترتيب لتكتب الكلمة ✏️');
  const N=6,due=fixDue(KEY),old=LIST.filter(x=>due.includes(x[1])).slice(0,3);
  const R=shuffle([...old.map(x=>({x,old:1})),...shuffle(LIST.filter(x=>!old.includes(x))).slice(0,N-old.length).map(x=>({x}))]);
  let r=0,got=0,fixed=0;
  function round(){
    if(r>=R.length)return endScreen(got,N,KEY,()=>spell(LIST,KEY),fixed?FIXNOTE:'');
    const cur=R[r],[pic,w]=cur.x;let i=0,miss=0,tries=0;
    const extra=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!w.includes(c))).slice(0,Math.max(1,6-w.length));
    const tiles=shuffle([...w.split(''),...extra]);
    $('pn').innerHTML=`<div class="game"><div class="gtop"><div class="dots">${R.map((_,k)=>`<i class="${k<r?'on':''}"></i>`).join('')}</div><span>⭐ ${got}</span></div><div class="gwrap">${tagHTML(cur)}</div>
      <div class="rpic"><span class="big">${pic}</span></div><button class="again" id="again">🔊 اسمع الكلمة</button>
      <div class="slots${w.length>6?' sm':''}">${w.split('').map(()=>'<span class="slot"></span>').join('')}</div>
      <div class="ltiles">${tiles.map((c,k)=>`<button class="lt" data-c="${c}" data-k="${k}">${c}</button>`).join('')}</div><p class="fb" id="fb"></p></div>`;
    $('again').onclick=()=>say(w);
    const lts=[...$('pn').querySelectorAll('.lt')],next=()=>lts.find(t=>!t.classList.contains('used')&&t.dataset.c===w[i]);
    lts.forEach(b=>b.onclick=()=>{
      if(b.classList.contains('used'))return;
      if(b.dataset.c===w[i]){lts.forEach(t=>t.classList.remove('hint'));tries=0;$('fb').textContent='';$('pn').querySelectorAll('.slot')[i].textContent=w[i];b.classList.add('used');i++;window.clubSfx&&clubSfx('tap');
        if(i===w.length){if(miss===0){if(!cur.again)got++;else fixed++;if(cur.old)fixRight(KEY,w);}praise(miss);
          window.clubSfx&&clubSfx('good');const r0=$('pn').querySelector('.slots').getBoundingClientRect();burst(r0.left+r0.width/2,r0.top+20);say(w);setTimeout(()=>{r++;round();},1700);}}
      else{if(!miss&&!cur.again){fixMiss(KEY,w);R.splice(Math.min(R.length,r+3),0,{x:cur.x,again:1});}
        miss++;tries++;b.classList.add('wrong');window.clubSfx&&clubSfx('bad');setTimeout(()=>b.classList.remove('wrong'),450);
        nudge(tries,next(),' استمع للكلمة 🔊');if(tries===2)say(w);}
    });
  }
  round();
}
/* memory: find each picture and its word */

  const cards=shuffle(pairs.flatMap((x,k)=>[{k,face:`<span class="big">${x[0]}</span>`},{k,face:`<span class="w">${esc(x[1])}</span>`}]));
  let open=[],found=0,moves=0,lock=false;

function sample(cmds){
  const pts=[];let cx=null,cy=null;
  const push=(x,y)=>{pts.push([x,y]);cx=x;cy=y;};
  const lineTo=(x,y)=>{if(cx===null){push(x,y);return;}const x0=cx,y0=cy,n=Math.max(1,Math.ceil(Math.hypot(x-x0,y-y0)/.04));for(let i=1;i<=n;i++)push(x0+(x-x0)*i/n,y0+(y-y0)*i/n);};
  const rad=d=>d*Math.PI/180;
  for(const c of cmds){
    if(c[0]==='M'||c[0]==='D')push(c[1],c[2]);
    else if(c[0]==='L')lineTo(c[1],c[2]);
    else{const[,ax,ay,rx,ry,a0,a1]=c;lineTo(ax+rx*Math.cos(rad(a0)),ay+ry*Math.sin(rad(a0)));
      const n=Math.max(8,Math.ceil(Math.abs(a1-a0)/4));for(let i=1;i<=n;i++){const a=rad(a0+(a1-a0)*i/n);push(ax+rx*Math.cos(a),ay+ry*Math.sin(a));}}
  }
  return pts;
}


return {SH,sample};
})();
let WSET='up',WIDX=0;
function writer(){
  const sets={up:LETTERS.map(l=>l[0]),lo:LETTERS.map(l=>l[0].toLowerCase()),dg:'0123456789'.split('')};
  let done={up:[],lo:[],dg:[]};try{const s=JSON.parse(store.get('kd-write')||'null');if(s&&s.up)done=s;}catch(e){}

    <div class="modes" id="wSet" dir="ltr"><button data-s="up">A B C</button><button data-s="lo">a b c</button><button data-s="dg">1 2 3</button></div>
    <div class="wrow" id="wChips" dir="ltr"></div>
    <div class="wboard" id="wBoard"><canvas id="wG"></canvas><canvas id="wI"></canvas><div class="wpic" id="wPic"></div></div>
    <p class="wmsg" id="wMsg"></p>
    <div class="wbtns" dir="ltr"><button id="wPrev"><bdi>←</bdi> <bdi>السابق</bdi></button><button id="wDemo">👀 شاهد</button><button id="wSay">🔊 اسمع</button><button id="wRe">🔁 من جديد</button><button id="wNext"><bdi>التالي</bdi> <bdi>→</bdi></button></div></div>`;
  const board=$('wBoard'),gc=$('wG'),ic=$('wI'),g=gc.getContext('2d'),k=ic.getContext('2d');
  let W=0,H=0,dpr=1,u=60,ty=0,penW=16,R=30,strokes=[],si=0,miss=0,active=false,cpi=0,live=[],lastP=null,noProg=0,demoing=false,raf=0;
  const cur=()=>sets[WSET][WIDX],d2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const COL=['#FF7A1A','#2D9CDB','#D94BA0','#22A060','#8B5CF6'];
  function word(){const c=cur();if(WSET==='dg')return null;return LETTERS.find(l=>l[0]===c.toUpperCase());}
  function speak(){const c=cur();if(WSET==='dg'){const n=NUMBERS.find(n=>String(n[0])===c);return say(n?n[1]:'zero');}const l=word();say(c.toUpperCase()+' is for '+l[2]);}
  function chips(){
    $('wChips').innerHTML=sets[WSET].map((c,i)=>`<button class="wchip${i===WIDX?' on':''}${done[WSET].includes(c)?' ok':''}" data-i="${i}">${c}</button>`).join('');
    $('wChips').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
    const on=$('wChips').querySelector('.on');if(on)setTimeout(()=>{try{on.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}},0);
    $('wSet').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===WSET));

  }
  function build(){
    const raw=KW.SH[cur()].map(cm=>({dot:cm[0][0]==='D',pts:KW.sample(cm)}));
    let mn=1e9,mx=-1e9;raw.forEach(s=>s.pts.forEach(p=>{mn=Math.min(mn,p[0]);mx=Math.max(mx,p[0]);}));

    strokes=raw.map(s=>{const px=s.pts.map(p=>[ox+p[0]*u,ty+p[1]*u]),cum=[0];for(let i=1;i<px.length;i++)cum.push(cum[i-1]+d2(px[i],px[i-1]));return{dot:s.dot,px,cum,len:cum[cum.length-1]};});
  }
  function resize(){

  }
  function poly(c,pts,col,w,n){if(!pts.length)return;c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0][0],pts[0][1]);n=n==null?pts.length:n;for(let i=1;i<n;i++)c.lineTo(pts[i][0],pts[i][1]);if(n===1)c.lineTo(pts[0][0]+.1,pts[0][1]);c.stroke();}
  function hline(y){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  function badge(p,n,fill,txt,r,border){g.fillStyle=fill;g.beginPath();g.arc(p[0],p[1],r,0,Math.PI*2);g.fill();if(border){g.strokeStyle=border;g.lineWidth=3;g.stroke();}
    g.fillStyle=txt;g.font=`800 ${Math.round(r*1.2)}px "Baloo 2",Tahoma,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(n),p[0],p[1]+1);}
  const idxAt=(s,d)=>{let i=0;while(i<s.cum.length-1&&s.cum[i]<d)i++;return i;};
  function arrows(s,col){const gap=Math.max(40,u*.7);g.strokeStyle=col;g.lineWidth=4;g.lineCap='round';g.lineJoin='round';
    for(let d=gap*.8;d<s.len-gap*.25;d+=gap){const i=idxAt(s,d),a=s.px[Math.max(0,i-2)],b=s.px[Math.min(s.px.length-1,i+2)],p=s.px[i],ang=Math.atan2(b[1]-a[1],b[0]-a[0]),z=11;
      g.beginPath();g.moveTo(p[0]-z*Math.cos(ang-.6),p[1]-z*Math.sin(ang-.6));g.lineTo(p[0],p[1]);g.lineTo(p[0]-z*Math.cos(ang+.6),p[1]-z*Math.sin(ang+.6));g.stroke();}}
  function guide(){
    g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);g.setLineDash([]);
    g.strokeStyle='#F3C9D9';g.lineWidth=3;hline(ty);hline(ty+2*u);g.strokeStyle='#BFD9F2';g.setLineDash([12,10]);hline(ty+u);g.setLineDash([]);g.globalAlpha=.5;hline(ty+3*u);g.globalAlpha=1;
    strokes.forEach((s,i)=>{const col=i<si?COL[i%COL.length]:'#EFE6D2';if(s.dot){g.fillStyle=col;g.beginPath();g.arc(s.px[0][0],s.px[0][1],penW*.6,0,Math.PI*2);g.fill();}else poly(g,s.px,col,penW*1.25);});
    g.setLineDash([3,10]);strokes.forEach((s,i)=>{if(i>=si&&!s.dot)poly(g,s.px,'#B9AE95',3);});g.setLineDash([]);
    for(let i=strokes.length-1;i>si;i--)badge(strokes[i].px[0],i+1,'#fff','#8A8070',13,'#B9AE95');
    if(si<strokes.length){const s=strokes[si];if(!s.dot)arrows(s,'#E0457B');badge(s.px[0],si+1,'#22A060','#fff',18,'#2A2440');}
  }
  const clearInk=()=>{k.setTransform(dpr,0,0,dpr,0,0);k.clearRect(0,0,W,H);};
  const drawLive=col=>{clearInk();poly(k,live,col||COL[si%COL.length],penW);};
  const msg=(h,c)=>{const m=$('wMsg');m.innerHTML=h;m.className='wmsg '+(c||'');};
  function reset(){demoing=false;cancelAnimationFrame(raf);active=false;si=0;miss=0;live=[];build();guide();clearInk();}
  function complete(){
    live=[];si++;clearInk();guide();
    if(si<strokes.length){window.clubSfx&&clubSfx('good');msg(`👍 رائع! الآن الخط رقم ${si+1}`,'ok');return;}
    const st=miss===0?3:miss<=2?2:1;
    msg(`<span dir="ltr">${'⭐'.repeat(st)}</span> ${['أحسنت! جرّب مرة أخرى','جميل جداً!','ممتاز! 🏆'][st-1]}`,'ok');
    window.clubSfx&&clubSfx('win');const b=board.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2);
    setTimeout(speak,400);
    if(!done[WSET].includes(cur())){done[WSET].push(cur());store.set('kd-write',JSON.stringify(done));addStars(1);}
    chips();
  }
  function fail(t){active=false;miss++;window.clubSfx&&clubSfx('bad');msg(t,'no');drawLive('#E5484D');setTimeout(()=>{if(!active&&!demoing)clearInk();},450);}
  function advance(q){const s=strokes[si],ahead=Math.max(R*1.3,u*.5);let i=idxAt(s,cpi),best=-1,bd=1e9;

  function pos(e){const r=ic.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}

  function demo(){reset();demoing=true;msg('👀 شاهد كيف نكتبه…','');const sp=Math.max(150,u*2.1);let i=0,t=0,pause=.3,prev=performance.now();
    function part(s,len,col){if(s.dot){k.fillStyle=col;k.beginPath();k.arc(s.px[0][0],s.px[0][1],penW*.6,0,Math.PI*2);k.fill();return s.px[0];}const n=Math.max(1,idxAt(s,len)+1);poly(k,s.px,col,penW,n);return s.px[n-1];}

}
