<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<script src="../assets/gate.js?v=9"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عوالم النادي وجواز السفر · نادي اللغة الإنجليزية</title>
<meta name="theme-color" content="#f4f7ff">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Lexend:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* عوالم النادي: one journey through all the club's sections. Each world (a capsule theme) has 4 stations taken from
   different sections (capsule, Word Quest words, a story, a conversation) and a world challenge; passing it with all the
   stations done stamps the world in the student's passport. The passport also stamps every section visited / completed. */
:root{color-scheme:light;--paper:#f6f8ff;--card:#fff;--ink:#232c47;--muted:#5a6482;--line:#e3e8f4;--gold:#c99a1c;--ok:#17855c;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;--en:"Lexend","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:20px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #4b62e0;outline-offset:3px;border-radius:14px}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.home{text-decoration:none;font-weight:800;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1rem}
.tabs{display:flex;gap:8px}
.tabs a{text-decoration:none;font-weight:800;font-size:1.02rem;border-radius:999px;padding:8px 18px;background:#fff;border:1.5px solid var(--line)}
.tabs a.on{background:#4b62e0;color:#fff;border-color:#4b62e0}
.hero{margin-top:16px;border-radius:30px;padding:26px 20px;text-align:center;background:linear-gradient(135deg,#eef1ff,#e8f7f1 55%,#fff5e0);border:1px solid #e3e6fa}
.hero h1{margin:0;font-size:2rem;line-height:1.3;color:#3446c4}
.hero p{margin:8px auto 0;max-width:640px;color:var(--muted);font-size:1.08rem}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.stats span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:800}
.howto{margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px 18px;font-size:1.02rem}
.howto b{color:#3446c4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.world{position:relative;display:flex;gap:14px;align-items:center;text-align:right;width:100%;cursor:pointer;background:linear-gradient(120deg,var(--t),#fff 78%);
  border:2px solid var(--line);border-radius:24px;padding:16px;transition:transform .2s var(--ease),box-shadow .2s;color:var(--ink)}
.world:hover{transform:translateY(-2px);box-shadow:0 14px 30px -24px var(--c)}
.world .ic{font-size:2.6rem;line-height:1;flex:none;width:64px;height:64px;display:grid;place-items:center;background:#fff;border-radius:20px;border:2px solid var(--t)}
.world .tx{flex:1;min-width:0}
.world b{display:block;font-size:1.25rem;color:var(--c)}
.world small{display:block;color:var(--muted);font-size:.95rem;line-height:1.5}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e6e9f3;border:2px solid #fff;box-shadow:0 0 0 1px #d9deec}
.dots i.on{background:var(--c)}
.world .stamp{flex:none;font-size:2rem}
.world.locked{cursor:default;opacity:.62;filter:grayscale(.5)}
.world.locked:hover{transform:none;box-shadow:none}
.world .lk{position:absolute;top:10px;left:12px;font-size:.88rem;font-weight:800;color:var(--muted);background:#fff;border-radius:999px;padding:0 10px;border:1px solid var(--line)}
/* world view */
.whead{margin-top:16px;border-radius:28px;padding:22px 18px;text-align:center;background:linear-gradient(135deg,var(--t),#fff 80%);border:2px solid var(--t)}
.whead .big{font-size:3.4rem;line-height:1}
.whead h1{margin:6px 0 0;color:var(--c);font-size:1.9rem}
.whead p{margin:6px 0 0;color:var(--muted)}
.prog{height:14px;border-radius:999px;background:#eef0f7;overflow:hidden;margin:14px auto 0;max-width:420px}
.prog i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .6s var(--ease)}
.stations{display:grid;gap:12px;margin-top:18px}
.st{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 16px}
.st.done{border-color:#bfe5d3;background:linear-gradient(120deg,#effaf4,#fff 70%)}
.st .n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--t);color:var(--c);font-size:1.15rem}
.st.done .n{background:var(--ok);color:#fff}
.st .tx{flex:1;min-width:0}
.st b{display:block;font-size:1.15rem}
.st small{display:block;color:var(--muted);font-size:.95rem;line-height:1.55}
.st .en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.st .go{flex:none;text-decoration:none;font-weight:800;border-radius:999px;padding:9px 16px;background:var(--c);color:#fff;white-space:nowrap;border:0;cursor:pointer}
.st.done .go{background:#fff;color:var(--ok);border:2px solid #bfe5d3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips a{text-decoration:none;font-family:var(--en);font-size:.88rem;border-radius:999px;padding:1px 10px;background:var(--t);color:var(--c);border:1px solid transparent;direction:ltr}
.chips a.ok{background:#e6f6ee;color:var(--ok)}
.final{margin-top:16px;border-radius:24px;padding:18px;text-align:center;border:2px dashed var(--c);background:#fff}
.final h2{margin:0;color:var(--c);font-size:1.4rem}
.final p{margin:6px 0 0;color:var(--muted)}
.btn{display:inline-block;margin-top:12px;font-weight:800;font-size:1.1rem;border:0;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--c,#4b62e0);color:#fff;text-decoration:none}
.btn.soft{background:#fff;color:var(--c,#4b62e0);border:2px solid var(--c,#4b62e0)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{display:inline-block;margin-top:14px;text-decoration:none;font-weight:800;color:var(--muted)}
/* quiz */
.qbox{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--muted)}
.qbar{height:10px;border-radius:999px;background:#eef0f7;overflow:hidden;margin:10px 0 16px}
.qbar i{display:block;height:100%;background:var(--c);transition:width .4s}
.qa{font-weight:800;color:var(--c);font-size:1.05rem}
.qq{font-size:1.4rem;font-weight:700;margin:8px 0 14px;line-height:1.6}
.qq.en{font-family:var(--en);direction:ltr;text-align:left}
.say{border:0;background:var(--t);color:var(--c);border-radius:999px;padding:4px 14px;font-weight:800;cursor:pointer;font-size:1rem}
.opts{display:grid;gap:10px}
.opt{text-align:start;background:#fbfcff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:1.15rem;cursor:pointer;color:var(--ink);line-height:1.55}
.opt.en{font-family:var(--en);direction:ltr;text-align:left}
.opt:hover{border-color:var(--c)}
.opt.right{background:#e9f8f0;border-color:#5cc497}
.opt.wrong{background:#fdeeee;border-color:#ef9a9a}
.opt[disabled]{cursor:default}
.why{margin-top:12px;font-size:1rem;color:var(--muted)}
.next{display:flex;justify-content:flex-end;margin-top:10px;direction:ltr}   /* Next on the right, like all English navigation */
.result{text-align:center}
.result .big{font-size:4rem;line-height:1}
.result h2{margin:6px 0 0;color:var(--c)}
/* passport */
.pass{margin-top:16px;border-radius:30px;padding:22px 18px;background:linear-gradient(160deg,#fff9ea,#fff 60%);border:2px solid #f0dfaa}
.pass h1{margin:0;text-align:center;color:#8a6a10;font-size:1.9rem}
.pass .sub{text-align:center;color:var(--muted);margin:6px 0 0}
.ph{margin:22px 0 10px;font-size:1.25rem;color:#8a6a10}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:640px){.stamps{grid-template-columns:repeat(3,1fr)}}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;text-align:center;color:var(--ink)}
.stp .c{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;border:3px dashed #d9dcea;background:#fff;position:relative}
.stp.v .c{border:3px solid #9fb2ea;background:#f0f4ff}
.stp.g .c{border:3px solid var(--gold);background:radial-gradient(circle,#fff8dc,#ffe9a6);box-shadow:0 8px 18px -10px #c99a1c;transform:rotate(-8deg)}
.stp.e .c{filter:grayscale(1);opacity:.45}
.stp .c em{position:absolute;bottom:-4px;left:-4px;font-style:normal;font-size:1.1rem}
.stp span{font-size:.92rem;font-weight:700;line-height:1.35}
.stp small{font-size:.8rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:16px;font-size:.95rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232c47;color:#fff;border-radius:16px;padding:10px 18px;font-weight:700;z-index:50;max-width:92vw;text-align:center}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

/* ---------- mission path (13 Nov 2026): one clear step at a time ---------- */
.now{margin-top:16px;position:relative;border-radius:26px;padding:18px;background:linear-gradient(140deg,var(--t),#fff 75%);border:3px solid var(--c);box-shadow:0 18px 34px -26px var(--c)}
.now .tag{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:.95rem;border-radius:999px;padding:3px 14px}
.now h2{margin:8px 0 2px;font-size:1.45rem;color:var(--ink);line-height:1.4}
.now h2 .en{font-family:var(--en);font-size:1rem;color:var(--c);display:block;direction:ltr;text-align:right}
.now .goal{margin:4px 0 0;color:var(--muted);font-size:1.05rem}
.how{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.how li{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;font-size:1.05rem;line-height:1.5}
.how li i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--t);color:var(--c);font-weight:800;font-size:.95rem}
.how li.back i{background:var(--ok);color:#fff}
.now .act{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.now .big-go{flex:1;min-width:220px;text-align:center;text-decoration:none;font-weight:800;font-size:1.2rem;border:0;cursor:pointer;border-radius:999px;padding:14px 20px;background:var(--c);color:#fff;box-shadow:0 10px 20px -12px var(--c)}
.now .score{font-weight:800;color:var(--c);background:#fff;border-radius:999px;padding:6px 14px;border:1.5px solid var(--line)}
.cele{margin-top:16px;border-radius:22px;padding:14px 16px;background:linear-gradient(120deg,#e9f8f0,#fff 80%);border:2px solid #9fdcbf;font-size:1.1rem;font-weight:700;color:#17603f;animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.trail{position:relative;list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.trail::before{content:"";position:absolute;top:26px;bottom:26px;right:27px;width:4px;border-radius:4px;background:repeating-linear-gradient(to bottom,#d6dcea 0 8px,transparent 8px 14px)}
.trail li{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.trail .n{position:relative;z-index:1;flex:none;width:34px;height:34px;margin-inline:-2px 0;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#eef0f7;color:var(--muted);font-size:1rem;border:3px solid #fff;box-shadow:0 0 0 2px #e1e6f2}
.trail .tx{flex:1;min-width:0}
.trail b{display:block;font-size:1.08rem;line-height:1.4}
.trail small{display:block;color:var(--muted);font-size:.92rem;line-height:1.45}
.trail .lnk{flex:none;text-decoration:none;font-weight:800;font-size:.95rem;color:var(--c);background:var(--t);border-radius:999px;padding:6px 12px;white-space:nowrap;border:0;cursor:pointer}
.trail li.done{border-color:#bfe5d3;background:linear-gradient(120deg,#effaf4,#fff 70%)}
.trail li.done .n{background:var(--ok);color:#fff;box-shadow:0 0 0 2px #9fdcbf}
.trail li.cur{border-color:var(--c);box-shadow:0 0 0 3px var(--t)}
.trail li.cur .n{background:var(--c);color:#fff;box-shadow:0 0 0 2px var(--c);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.trail li.cur b::after{content:"  ← أنت هنا";font-size:.9rem;color:var(--c)}
.trail li.lock{opacity:.7}
.trail li.goal{border-style:dashed}
.trail li.goal.done{border-style:solid}
.nextw{display:flex;align-items:center;gap:12px;margin-top:12px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.nextw .ic{font-size:2rem}
.nextw b{color:var(--c2,#4b62e0)}
.mission{display:flex;align-items:center;gap:12px;margin-top:14px;text-decoration:none;color:var(--ink);background:linear-gradient(120deg,var(--t),#fff 80%);border:3px solid var(--c);border-radius:24px;padding:14px 16px}
.mission .ic{font-size:2.4rem;flex:none}
.mission .tx{flex:1;min-width:0}
.mission small{display:block;color:var(--muted);font-size:.95rem}
.mission b{display:block;font-size:1.15rem;line-height:1.45}
.mission .go{flex:none;background:var(--c);color:#fff;font-weight:800;border-radius:999px;padding:9px 16px;white-space:nowrap}
@media (max-width:560px){.mission{flex-wrap:wrap}.mission .go{width:100%;text-align:center}}
@media (prefers-reduced-motion:reduce){.trail li.cur .n,.cele{animation:none}}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="topbar">
    <a class="home" href="../index.html">🏠 الرئيسية</a>
    <nav class="tabs"><a href="#" id="tMap">🌍 العوالم</a><a href="#passport" id="tPass">🛂 جواز سفري</a></nav>
  </div>
  <main id="app"><p style="text-align:center;margin-top:40px">جارٍ التحميل…</p></main>
</div>
<div class="toast hide" id="toast" role="status" aria-live="polite"></div>
<script src="../surprise/bank.js?v=1"></script>
<script>
(function(){
'use strict';
/* ---------- the worlds: one capsule theme each, with stations from the other sections ---------- */
// wq = Word Quest units on the theme, st = a story (stories/#id), lab = a conversation lab week
const WORLDS = [
  { k:'space',     ar:'عالم الفضاء',    en:'Space',     ic:'🚀', c:'#5b4bd6', t:'#efebff', wq:[3,2],          st:['wind-sun','The North Wind and the Sun'], lab:[19,'An Invention That Changed Us'] },
  { k:'nature',    ar:'عالم الطبيعة',   en:'Nature',    ic:'🌿', c:'#1d7a50', t:'#e4f5ec', wq:[17,25,37,38],  st:['crow-pitcher','The Crow and the Pitcher'], lab:[7,'Weather Through the Seasons'] },
  { k:'life',      ar:'عالم الحياة',    en:'Life',      ic:'🏡', c:'#7d47c4', t:'#f3ebff', wq:[4,31,35],      st:['town-country-mouse','The Town Mouse and the Country Mouse'], lab:[1,'Meet My Family'] },
  { k:'flavor',    ar:'عالم النكهات',   en:'Flavor',    ic:'🍲', c:'#c25a20', t:'#fff0e4', wq:[32,18],        st:['stone-soup','Stone Soup'], lab:[5,'How to Make Kabsa'] },
  { k:'sports',    ar:'عالم الرياضة',   en:'Sports',    ic:'⚽', c:'#1f8a4c', t:'#e4f6ea', wq:[20,23,24,42],  st:['tortoise-hare','The Tortoise and the Hare'], lab:[8,'The New Team Captain'] },
  { k:'health',    ar:'عالم الصحة',     en:'Health',    ic:'🩺', c:'#13807f', t:'#e2f5f4', wq:[21,33,45],     st:['ant-grasshopper','The Ant and the Grasshopper'], lab:[11,'A New Healthy Habit'] },
  { k:'adventure', ar:'عالم المغامرة',  en:'Adventure', ic:'🧭', c:'#2477b5', t:'#e6f3fc', wq:[9,16,26,27],   st:['lion-mouse','The Lion and the Mouse'], lab:[6,'A Trip to Remember'] },
  { k:'emotion',   ar:'عالم المشاعر',   en:'Emotions',  ic:'💜', c:'#8a4fb0', t:'#f6ecfb', wq:[48,34,43],     st:['bundle-sticks','The Bundle of Sticks'], lab:[14,'How I Beat Math Stress'] },
  { k:'tech',      ar:'عالم التقنية',   en:'Technology',ic:'🤖', c:'#3f51c9', t:'#e9ecfd', wq:[39,46,22],     st:['king-midas','King Midas and the Golden Touch'], lab:[9,'My Phone Is Dead'] },
  { k:'career',    ar:'عالم المهن',     en:'Careers',   ic:'💼', c:'#2f5fa8', t:'#e8effb', wq:[40,49,47],     st:['elves-shoemaker','The Elves and the Shoemaker'], lab:[17,'My Dream Job'] }
];
const OPEN_START = 3;      // the first 3 worlds are open; every stamp opens one more
const PASS = 7;            // the world challenge: 7 of 10 to pass
const QN = 10;

const $ = id => document.getElementById(id);
const J = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const S = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const N = k => { try { return +(localStorage.getItem(k) || 0) || 0; } catch (e) { return 0; } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sfx = n => { try { window.clubSfx && window.clubSfx(n); } catch (e) {} };
function toast(m, ms) { const t = $('toast'); t.textContent = m; t.classList.remove('hide'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hide'), ms || 3500); }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- progress, read from what each section saved ---------- */
function stations(W) {
  const capStars = J('cap2-' + W.k + '-stars', {}), capN = Object.keys(capStars).filter(k => (+capStars[k] || 0) >= 1).length;
  const wqBest = W.wq.map(n => N('wq-best-' + n)), wqOk = wqBest.some(b => b >= 7);
  const stBest = N('st-best-' + W.st[0]), labBest = N('cl-q-' + W.lab[0]);
  return [
    { ic:'🎧', ar:'كبسولة ' + W.ar.replace('عالم ', ''), goal:'نجمة في مرحلتين من الكبسولة', how:['افتح الكبسولة واستمع للجمل', 'رتّب جمل المرحلة الأولى حتى تنال نجمة ⭐', 'أكمل المرحلة الثانية بنجمة ⭐'], spec:{t:'cap', keys:['cap2-' + W.k + '-stars'], min:2}, what:'أنجز مرحلتين على الأقل في كبسولة هذا العالم (نجمة في كل مرحلة).', now: capN + ' من 2 مراحل', done: capN >= 2, href:'../capsules/' + W.k + '.html', go: capN ? 'تابع' : 'ابدأ' },

      return `<a class="stp ${s ? 'g' : x.n || x.b ? 'v' : 'e'}" href="#w-${W.k}"><span class="c">${W.ic}${s ? '<em>✅</em>' : ''}</span><span>${W.ar.replace('عالم ', '')}</span><small>${s ? 'مختوم' : x.n + '/4 محطات'}</small></a>`; }).join('')}</div>
    <h2 class="ph">🏛️ أختام الأقسام</h2>
    <div class="stamps">${secs.map(s => { const st = state(s[0]);
      return `<a class="stp ${st}" href="${s[3]}"><span class="c">${s[1]}${st === 'g' ? '<em>🏅</em>' : ''}</span><span>${s[2]}</span><small>${st === 'g' ? 'مكتمل' : st === 'v' ? 'زرته' : 'لم تزره بعد'}</small></a>`; }).join('')}</div>
    <div class="legend"><span>⚪ لم تزره بعد</span><span>🔵 زرته وجمعت فيه نقاطاً</span><span>🟡 أكملته</span></div>
  </section>`;
}

/* ---------- fireworks ---------- */
function fireworks(n) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('fx'), x = c.getContext('2d'), w = c.width = innerWidth, h = c.height = innerHeight, P = [];
  const cols = ['#f5b82e', '#6d4aff', '#1c8a5a', '#e2572b', '#2f9e9e', '#e05a8a'];
  for (let b = 0; b < n; b++) { const cx = w * (.2 + Math.random() * .6), cy = h * (.2 + Math.random() * .3);
    for (let i = 0; i < 40; i++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 5; P.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: cols[(b + i) % 6], l: 60 + Math.random() * 30, d: b * 12 }); } }
  let f = 0; (function step() { x.clearRect(0, 0, w, h); let alive = 0;
    P.forEach(p => { if (p.d > 0) { p.d--; alive++; return; } if (p.l <= 0) return; alive++; p.l--; p.x += p.vx; p.y += p.vy; p.vy += .08; p.vx *= .98; x.globalAlpha = Math.min(1, p.l / 30); x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, 3, 0, 6.28); x.fill(); });
    if (alive && ++f < 400) requestAnimationFrame(step); else x.clearRect(0, 0, w, h); })();
}

/* ---------- routing: every view is a history entry, so the phone's back button stays inside ---------- */
function route() {
  window.scrollTo(0, 0);
  const h = location.hash.slice(1);
  const got = checkStamps(); if (got.length) { toast('🏅 حصلت على ختم ' + got.map(W => W.ar).join(' و') + '!'); fireworks(3); syncPoints(); }
  if (h === 'passport') return viewPass();
  let m = /^(?:w|q|r)-([a-z]+)$/.exec(h), W = m && WORLDS.find(x => x.k === m[1]);
  if (W && /^q-/.test(h) && Q && Q.W === W && Q.i < QN) return drawQ();
  if (W && isOpen(WORLDS.indexOf(W))) return viewWorld(W);
  document.body.style.removeProperty('--c');
  viewMap();
}
addEventListener('hashchange', route);
route();
syncPoints();
})();
