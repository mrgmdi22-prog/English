<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>أصوات النادي · تجربة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" media="print" onload="this.media='all'">

<style>
body{margin:0;background:#F5F7FF;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;color:#1F2840;font-size:20px}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 6px;font-size:1.8rem}p{color:#5B6580;margin:0 0 20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:800;font-size:1.15rem;border:2px solid #E2E8F5;background:#fff;border-radius:20px;padding:22px 10px;cursor:pointer}

<body><div class="wrap">
<h1>🔊 أصوات النادي</h1>
<p>جرّب الأصوات الجديدة. اضغط «إجابة صحيحة» عدة مرات متتالية لتسمع النغمة ترتفع مع كل إجابة صحيحة.</p>
<div class="g">
  <button id="t"><b>👆</b>نقرة</button>
  <button id="g"><b>✅</b>إجابة صحيحة</button>
  <button id="b"><b>❌</b>إجابة خاطئة</button>
  <button id="w"><b>🏆</b>نهاية التحدي</button>
</div>
</div>
<script>
const p=n=>window.clubSfx&&clubSfx(n);
document.getElementById('g').onclick=()=>p('good');document.getElementById('b').onclick=()=>p('bad');

</script>
