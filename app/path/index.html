<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<script src="../assets/gate.js?v=9"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خارطة طريقي · نادي اللغة الإنجليزية</title>
<meta name="theme-color" content="#f5f8ff">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Lexend:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* خارطة طريقي (15 Nov 2026): a student who feels lost among the many sections draws his own road map.
   1) Awareness: a language is a house — vocabulary + structures are the foundation, the four skills are the pillars.
   2) Four questions: goal, level (from the level test when there is one), a self-rating of the six parts, daily time.
   3) The map: 3 stages (the three parts that need most work, foundation first on a tie), each with 2–3 stations
      chosen from the club's sections for his level and goal, a daily mission sized to his time, and a check-in
      every two weeks / after the post test that redraws the map. Progress is read from the honor points (parts),
      measured from the moment the map was drawn; stations without points are ticked by the student.
   Saved in localStorage `my-path` (backed up with the rest of the progress) and `mp-day` (today's snapshot). */
:root{color-scheme:light;--paper:#f5f8ff;--card:#fff;--ink:#232c47;--muted:#5a6482;--line:#e3e8f4;
  --blue:#3157d5;--blue-soft:#e8eeff;--teal:#11826a;--teal-soft:#e3f6ef;--sun:#a26f00;--sun-soft:#fff4d6;--coral:#c2452a;--coral-soft:#ffece4;--violet:#6046e8;--violet-soft:#efebff;
  --weak:#f6b5a6;--weak-t:#9e3a22;--ok:#ffe08a;--ok-t:#7a5600;--good:#a8e3c8;--good-t:#0e6b52;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;--en:"Lexend","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:20px;line-height:1.75;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:14px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{text-decoration:none;font-weight:800;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1rem}
.hero{margin-top:16px;border-radius:30px;padding:26px 20px;text-align:center;background:linear-gradient(135deg,#e8eeff,#e9f8f2 55%,#fff6e0);border:1px solid #e1e6f8}
.hero .big{font-size:3.2rem;line-height:1}
.hero h1{margin:6px 0 0;font-size:2.1rem;line-height:1.3;color:#2a46b8}
.hero p{margin:8px auto 0;max-width:640px;color:var(--muted);font-size:1.1rem}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:1rem}
.card{overflow:hidden;margin-top:18px;background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:20px 18px}
.card h2{margin:0 0 6px;font-size:1.45rem;line-height:1.4}
.card .lead{margin:0;color:var(--muted);font-size:1.06rem}
.btn{display:inline-block;text-decoration:none;font-weight:800;border:0;border-radius:999px;padding:12px 24px;font-size:1.12rem;background:var(--blue);color:#fff;line-height:1.4}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.center{text-align:center}

/* ---------- the language house (centred; roof with eaves + chimney, beam, 4 columns, floor slab, brick foundation, grass) ---------- */
.house{width:100%;max-width:520px;margin:18px auto 6px;padding:0 10px;display:flex;flex-direction:column;align-items:stretch}
.roof{position:relative;height:118px;margin:0 -10px;display:grid;place-items:end center;padding-bottom:16px}
.roof::before{content:"";position:absolute;inset:0;background:linear-gradient(170deg,#b9c9ff,#dfe7ff);clip-path:polygon(50% 0,100% 100%,0 100%);z-index:1}
.roof::after{content:"";position:absolute;top:30px;left:16%;width:30px;height:46px;background:#cdd8fb;border:2px solid #b3c3f5;border-bottom:0;border-radius:4px 4px 0 0;z-index:0}
.roof .win{z-index:2;position:absolute;top:40px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#fff8dc;border:3px solid #9fb2ee;display:grid;place-items:center;font-size:1rem}
.roof b{z-index:2;position:relative;font-size:1.25rem;color:#2a46b8;line-height:1.2}
.roof b .en{font-size:.95rem;color:#5a6aa8;margin-inline-start:6px}
.beam{height:14px;margin:0 2px;border-radius:4px;background:#c9d4f6;border:1.5px solid #b3c3f5}
.cap{margin:6px 0 4px;text-align:center;font-size:.92rem;font-weight:800;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 6px}
.found{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.blk{min-width:0;border-radius:14px;padding:10px 4px;text-align:center;border:2px solid #dbe2f3;background:#f7f9ff;transition:background .4s,border-color .4s}
.pillars .blk{position:relative;min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:6px;
  border-top-width:7px;border-bottom-width:7px}
.blk .i{font-size:1.8rem;line-height:1.2}
.blk b{display:block;font-size:1.02rem;line-height:1.35;overflow-wrap:anywhere}
.blk small{display:block;font-size:.78rem;color:var(--muted);font-family:var(--en);direction:ltr;overflow-wrap:anywhere;line-height:1.3}
.blk .f{display:block;font-size:.9rem;font-weight:800;margin-top:2px;line-height:1.3}
.floor{height:12px;margin:0 -4px;border-radius:4px;background:#cfc3a6}
.found .blk{border-radius:10px;padding:12px 6px;border-color:#d9c9a3;
  background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(160,130,80,.16) 22px 24px),#f6efdf}
.found .blk .i{font-size:1.6rem}
.blk.r0{background-color:#fff0ec;border-color:var(--weak)}.blk.r0 .f{color:var(--weak-t)}
.blk.r1{background-color:#fff8de;border-color:var(--ok)}.blk.r1 .f{color:var(--ok-t)}
.blk.r2{background-color:#e9f8f1;border-color:var(--good)}.blk.r2 .f{color:var(--good-t)}
.pillars .blk.r0,.pillars .blk.r1,.pillars .blk.r2{background-image:none}
.blk.fx{box-shadow:0 0 0 4px #9fb2ee}
.ground{height:12px;margin:2px -14px 0;border-radius:999px;background:linear-gradient(90deg,#bfe3c4,#d6efd8,#bfe3c4)}
@media (max-width:520px){.house{padding:0 6px}.pillars{gap:6px;padding:0 2px}.pillars .blk{min-height:150px}.blk b{font-size:.92rem}.blk .i{font-size:1.5rem}.blk small{font-size:.7rem}.blk .f{font-size:.82rem}.roof{height:100px}.roof .win{top:34px;width:30px;height:30px}}
.facts{display:grid;gap:10px;margin-top:14px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:12px 14px;font-size:1.05rem}
.fact .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}
.fact b{color:#2a46b8}

/* ---------- wizard ---------- */
.steps{display:flex;gap:6px;justify-content:center;margin:16px 0 4px;direction:ltr}
.steps i{width:40px;height:9px;border-radius:999px;background:#dfe5f2}
.steps i.on{background:var(--blue)}
.qh{font-size:1.5rem;margin:6px 0 4px;line-height:1.45}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:right;width:100%;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 16px;color:var(--ink);transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:#b9c7f2}
.opt .i{flex:none;font-size:2.1rem;width:56px;height:56px;display:grid;place-items:center;background:var(--paper);border-radius:18px}
.opt b{display:block;font-size:1.16rem;line-height:1.4}
.opt small{display:block;color:var(--muted);font-size:.96rem;line-height:1.5}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .i{background:#fff}
.note{margin-top:12px;background:var(--sun-soft);border:1.5px solid #f2dc97;border-radius:18px;padding:10px 14px;font-size:1.02rem;color:#6b4a00}
.note a{color:#2a46b8;font-weight:800}
.rate{background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 14px}
.rate.set{border-color:#cfd9f6}
.rate .top{display:flex;align-items:center;gap:10px}
.rate .top .i{font-size:1.8rem}
.rate .top b{font-size:1.15rem}
.rate .top small{font-family:var(--en);direction:ltr;color:var(--muted);font-size:.9rem}
.rate p{margin:4px 0 8px;color:var(--muted);font-size:1rem;line-height:1.6}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.faces button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:1rem;color:var(--ink);line-height:1.4}
.faces button span{display:block;font-size:1.6rem}
.faces button[aria-pressed="true"].f0{background:#fff0ec;border-color:#e9907b}
.faces button[aria-pressed="true"].f1{background:#fff8de;border-color:#e8c44c}
.faces button[aria-pressed="true"].f2{background:#e9f8f1;border-color:#6fc7a0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;direction:ltr}
.nav .btn{min-width:130px;text-align:center}

/* ---------- map ---------- */
.today{background:linear-gradient(135deg,#eef3ff,#fff 70%);border-color:#d3ddfa}
.today .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today .hd h2{flex:1;margin:0}
.streak{font-weight:800;background:#fff4d6;color:#8a5d00;border:1.5px solid #f2dc97;border-radius:999px;padding:2px 12px;font-size:1rem}
.tasks{display:grid;gap:10px;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.task.done{border-color:#bfe5d3;background:linear-gradient(120deg,#effaf4,#fff 70%)}
.task .i{flex:none;font-size:1.9rem;width:52px;height:52px;display:grid;place-items:center;background:var(--paper);border-radius:16px}
.task .tx{flex:1;min-width:0}
.task b{display:block;font-size:1.12rem;line-height:1.4}
.task small{display:block;color:var(--muted);font-size:.95rem;line-height:1.5}
.task .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.go{text-decoration:none;font-weight:800;border-radius:999px;padding:8px 16px;background:var(--blue);color:#fff;white-space:nowrap;border:0;text-align:center;font-size:1rem}
.tick{font-weight:800;border-radius:999px;padding:6px 12px;background:#fff;color:var(--teal);border:1.5px solid #bfe5d3;white-space:nowrap;font-size:.95rem}
.task.done .tick,.stn.done .tick{background:var(--teal);color:#fff;border-color:var(--teal)}
.alldone{margin-top:12px;text-align:center;font-weight:800;color:var(--teal);font-size:1.12rem}
.trail{position:relative;margin-top:22px;padding-inline-start:34px}
.trail::before{content:"";position:absolute;top:10px;bottom:10px;right:15px;width:5px;border-radius:5px;background:repeating-linear-gradient(180deg,#c9d4f3 0 12px,transparent 12px 20px)}
.stage{position:relative;margin-bottom:18px}
.stage .dot{position:absolute;right:-34px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:3px solid #c9d4f3;color:var(--muted);font-size:1rem}
.stage.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px #dbe4ff;animation:pulse 2.4s ease-in-out infinite}
.stage.fin .dot{background:var(--teal);border-color:var(--teal);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(49,87,213,.12)}}
.sbox{background:#fff;border:2px solid var(--line);border-radius:24px;padding:16px}
.stage.cur .sbox{border-color:#b9c7f2;box-shadow:0 18px 36px -30px #3157d5}
.stage.later .sbox{background:#fbfcff}
.stage .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage .hd h3{margin:0;font-size:1.3rem;flex:1;line-height:1.4}
.stage .tag{font-size:.92rem;font-weight:800;border-radius:999px;padding:2px 12px;background:var(--paper);color:var(--muted)}
.stage.cur .tag{background:var(--blue-soft);color:var(--blue)}
.stage.fin .tag{background:var(--teal-soft);color:var(--teal)}
.stage .why{margin:6px 0 0;color:var(--muted);font-size:1rem}
.stns{display:grid;gap:10px;margin-top:12px}
.stn{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px}
.stn.done{border-color:#bfe5d3;background:#f3fbf7}
.stn .i{flex:none;font-size:1.7rem;width:48px;height:48px;display:grid;place-items:center;background:var(--paper);border-radius:14px}
.stn .tx{flex:1;min-width:0}
.stn b{display:block;font-size:1.08rem;line-height:1.4}
.stn small{display:block;color:var(--muted);font-size:.93rem;line-height:1.5}
.bar{height:10px;border-radius:999px;background:#eef0f7;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .6s var(--ease)}
.stn .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.next{margin-top:12px;text-align:center}
.flag{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff6e0,#fff 70%);border:2px dashed #f0d48a;border-radius:24px;padding:16px}
.flag .i{font-size:2.2rem}
.flag b{display:block;font-size:1.18rem;color:#8a5d00}
.flag small{display:block;color:var(--muted);font-size:.98rem}
.checkin{background:linear-gradient(135deg,#fff8e1,#fff 70%);border-color:#f2dc97}
.checkin .rate{margin-top:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.98rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232c47;color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;z-index:50;font-size:1.02rem;max-width:calc(100% - 30px);text-align:center;transition:opacity .3s}
.toast.hide{opacity:0;pointer-events:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:560px){.hero h1{font-size:1.8rem}.task,.stn{flex-wrap:wrap}.task .acts,.stn .acts{flex-direction:row;width:100%}.task .acts>*,.stn .acts>*{flex:1}}
@media (prefers-reduced-motion:reduce){.stage.cur .dot{animation:none}}
</style>

<div class="wrap">
  <div class="topbar">
    <a class="pill" href="../index.html">🏠 الرئيسية</a>
    <a class="pill" href="../guide.html">🧭 دليل المتعلم</a>
  </div>
  <main id="app"><p class="center" style="margin-top:40px">جارٍ التحميل…</p></main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
/* ================= data ================= */
// The six parts of a language. Foundation first (vocabulary, structures), then receptive skills, then productive ones.
var C = [
  {k:'voc', ar:'المفردات', en:'Vocabulary', ic:'🧱', base:1, q:'هل تفهم معاني أغلب الكلمات في كتابك المدرسي؟', why:'الكلمات هي الطوب: بلا كلمات لا فهم ولا كلام.'},
  {k:'gra', ar:'التراكيب', en:'Grammar', ic:'🔩', base:1, q:'هل ترتّب كلمات الجملة صحيحة، وتعرف متى تستعمل كل زمن؟', why:'التراكيب هي الإسمنت الذي يربط الكلمات في جمل صحيحة.'},
  {k:'lis', ar:'الاستماع', en:'Listening', ic:'🎧', q:'هل تفهم جملة قصيرة حين تسمعها دون أن تراها مكتوبة؟', why:'تسمع قبل أن تتكلم: الأذن تفتح الطريق للسان.'},
  {k:'rea', ar:'القراءة', en:'Reading', ic:'📖', q:'هل تقرأ فقرة قصيرة وتفهم فكرتها العامة؟', why:'القراءة تزيد كلماتك وتريك التراكيب في مكانها.'},
  {k:'spe', ar:'التحدث', en:'Speaking', ic:'🗣️', q:'هل تعرّف بنفسك وتجيب عن سؤال بسيط بالإنجليزية بصوتك؟', why:'التحدث يحوّل ما تعرفه إلى لغة حيّة تستعملها.'},
  {k:'wri', ar:'الكتابة', en:'Writing', ic:'✍️', q:'هل تكتب جملة صحيحة من تأليفك دون نسخ؟', why:'الكتابة تثبّت الكلمات والتراكيب في ذاكرتك.'}
];
var CK = {}; C.forEach(function(c, i){ c.i = i; CK[c.k] = c; });
var FACE = [['😟','ضعيف'],['🙂','مقبول'],['😎','قوي']];

var GOALS = [
  {k:'school', ic:'🏫', b:'التفوّق في مادة الإنجليزي بالمدرسة', s:'درجات أعلى في الاختبارات والكتاب المدرسي', w:{voc:-3, gra:-3, rea:-2}},
  {k:'step', ic:'📝', b:'الاستعداد لاختبار ستيب (STEP)', s:'قراءة وقواعد واستماع بأسلوب الاختبار', w:{rea:-4, gra:-4, voc:-2, lis:-2}},
  {k:'talk', ic:'💬', b:'أن أتحدث وأفهم من يكلّمني', s:'محادثة وثقة في السفر والحياة اليومية', w:{spe:-6, lis:-5}},
  {k:'fun', ic:'🌟', b:'المتعة وتطوير نفسي', s:'قصص وتعبيرات وتحديات بلا ضغط', w:{rea:-3, lis:-2, voc:-1}}
];
var GK = {}; GOALS.forEach(function(g){ GK[g.k] = g; });
var LVL = [
  {ic:'🌱', b:'مبتدئ', s:'أعرف الحروف وكلمات قليلة'},
  {ic:'🌿', b:'متوسط', s:'أفهم جملاً بسيطة وأكوّن بعضها'},
  {ic:'🌳', b:'متقدّم', s:'أقرأ نصوصاً وأتحدث بثقة نسبياً'}
];
var TIMES = [{m:10, ic:'⏱️', b:'10 دقائق', s:'مهمة واحدة في اليوم'}, {m:20, ic:'⏰', b:'20 دقيقة', s:'مهمتان: تعلّم + مراجعة', rec:1}, {m:30, ic:'🔥', b:'30 دقيقة', s:'ثلاث مهام: انطلاقة قوية'}];

// Club sections as stations. key = honor points part (progress measured since the map was drawn); t = target in that part's
// units; no key = the student ticks it. lv = [min,max] level band (0 beginner, 1 middle, 2 advanced); el = needs B1 by the test.
var T = {
  lvl:  {n:'قياس المستوى', ic:'📈', h:'../level/index.html', c:[], lv:[0,2], how:'اختبار قصير يحدد مستواك، فتُبنى خارطتك عليه'},
  dict: {n:'قاموس الألف كلمة', ic:'📖', h:'../journey/dictionary.html', c:['voc'], lv:[0,0], how:'تصفّح 20 كلمة وانطقها بصوتك'},

    + '<div class="chips"><span>' + (g.ic || '🎯') + ' ' + esc(g.b || '') + '</span><span>📈 ' + (plan.lvSrc === 'test' ? '<span class="en">' + esc(plan.lvName) + '</span>' : LVL[plan.lvl].b + ' (تقديرك)') + '</span><span>⏳ ' + plan.time + ' دقيقة يومياً</span></div>'
    + '<div style="margin-top:14px"><button class="btn soft" data-new>🔄 ارسم خارطة جديدة</button></div></section>';

  if (fresh) h += '<section class="card center" style="background:linear-gradient(135deg,#e9f8f1,#fff 70%);border-color:#bfe5d3"><h2>🎉 رُسمت خارطتك!</h2><p class="lead">ركّز أولاً على <b>' + CK[focus[0]].ar + '</b>، ثم <b>' + CK[focus[1]].ar + '</b>، ثم <b>' + CK[focus[2]].ar + '</b>. ابدأ بمهمة اليوم بالأسفل، وكل الأقسام الأخرى تبقى مفتوحة لك متى شئت.</p></section>';

  // check-in: after the post test, or every 14 days
  var newTest = tl && tl.at > plan.at;
  if (newTest) h += '<section class="card checkin"><h2>📈 اختبرت مستواك من جديد!</h2><p class="lead">نتيجتك الآن <b class="en">' + esc(tl.name) + '</b>. أعد رسم خارطتك لتناسب مستواك الجديد.</p><div class="center" style="margin-top:12px"><a class="btn" href="#intro" id="redraw1">✏️ أعد رسم خارطتي</a></div></section>';
  else if (age >= 14 && (plan.ci || 0) < Math.floor(age / 14)) {
    var ck = focus[Math.min(cur, 2)];
    h += '<section class="card checkin"><h2>⏰ مرّ أسبوعان على خارطتك</h2><p class="lead">كيف تشعر الآن في <b>' + CK[ck].ar + '</b>؟</p><div class="rate"><div class="faces">'
      + FACE.map(function(f, i){ return '<button class="f' + i + '" data-ci="' + i + '" data-k="' + ck + '"><span>' + f[0] + '</span>' + f[1] + '</button>'; }).join('') + '</div></div></section>';
  }

  // today's mission
  h += '<section class="card today"><div class="hd"><h2>☀️ مهمة اليوم</h2>' + (streak ? '<span class="streak">🔥 ' + streak + (streak === 1 ? ' يوم' : streak === 2 ? ' يومان' : streak <= 10 ? ' أيام' : ' يوماً') + '</span>' : '') + '</div>'
    + '<p class="lead">' + (cur < plan.stages.length ? 'على قدر وقتك (' + plan.time + ' دقيقة). اضغط «ابدأ»، ثم ارجع هنا.' : 'أنهيت مراحل خارطتك! حافظ على المراجعة اليومية، ثم اختبر مستواك وأعد الرسم.') + '</p><div class="tasks">'
    + tasks.map(function(id){ var t = T[id], dn = taskDone(id, ds); return '<div class="task' + (dn ? ' done' : '') + '"><span class="i">' + t.ic + '</span><div class="tx"><b>' + nm(t) + '</b><small>' + esc(t.how) + '</small></div><div class="acts">'
      + (t.h ? '<a class="go" href="' + t.h + '"' + (/^https/.test(t.h) ? ' target="_blank" rel="noopener"' : '') + '>ابدأ ←</a>' : '')
      + ((!t.key && id !== 'mb' && id !== 'lvl') || dn ? '<button class="tick" data-tk="' + id + '"' + (dn ? ' disabled' : '') + '>' + (dn ? '✓ أُنجزت' : 'أنجزتها ✓') + '</button>' : '') + '</div></div>'; }).join('')
    + '</div>' + (nDone === tasks.length ? '<div class="alldone">🌟 أحسنت! أنهيت مهمة اليوم. نلتقي غداً.</div>' : '') + '</section>';

  // the house coloured by the student's own rating
  h += '<section class="card"><h2>🏠 بيت لغتك</h2><p class="lead">هكذا قيّمت نفسك. الإطار الأزرق = ما تركّز عليه خارطتك.</p>' + house(plan.r, cur < focus.length ? [focus[cur]] : []) + '</section>';

  // the trail
  h += '<section class="card"><h2>🧭 مسارك</h2><p class="lead">3 مراحل، لكل مرحلة قرابة أسبوعين. تنتقل تلقائياً حين تنهي محطاتها.</p><div class="trail">';
  plan.stages.forEach(function(s, i){
    var c = CK[s.k], ids = stageIds(plan, i), fin = i < cur, isCur = i === cur;
    h += '<div class="stage ' + (fin ? 'fin' : isCur ? 'cur' : 'later') + '"><span class="dot">' + (fin ? '✓' : i + 1) + '</span><div class="sbox"><div class="hd"><h3>' + c.ic + ' المرحلة ' + (i + 1) + ': ' + c.ar + ' <span class="en" style="font-size:.95rem;color:var(--muted)">' + c.en + '</span></h3><span class="tag">' + (fin ? 'أنجزتها' : isCur ? 'أنت هنا' : 'لاحقاً') + '</span></div>'
      + '<p class="why">' + c.why + '</p><div class="stns">'
      + ids.map(function(id){ var t = T[id], p = prog(plan, id), dn = p >= 1; return '<div class="stn' + (dn ? ' done' : '') + '"><span class="i">' + t.ic + '</span><div class="tx"><b>' + nm(t) + '</b><small>' + esc(t.how) + '</small>'
        + (t.key || id === 'lvl' ? '<div class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></div>' : '') + '</div><div class="acts">'
        + (t.h ? '<a class="go" href="' + t.h + '"' + (/^https/.test(t.h) ? ' target="_blank" rel="noopener"' : '') + '>' + (dn ? 'تدرّب' : 'ابدأ') + ' ←</a>' : '')
        + (id !== 'lvl' ? '<button class="tick" data-st="' + id + '"' + (dn ? ' disabled' : '') + '>' + (dn ? '✓ أنجزتها' : 'أنجزتها ✓') + '</button>' : '') + '</div></div>'; }).join('')
      + '</div>' + (isCur ? '<div class="next"><button class="btn ghost" id="skip">أتقنت هذا الجزء؟ انتقل للمرحلة التالية</button></div>' : '') + '</div></div>';
  });
  h += '<div class="stage ' + (cur >= plan.stages.length ? 'cur' : 'later') + '"><span class="dot">🏁</span><div class="flag"><span class="i">📈</span><div><b>قِس تحسّنك وأعد الرسم</b><small>بعد 4 أسابيع من الاختبار القبلي يُفتح الاختبار البعدي. اختبر، ثم ارسم خارطة جديدة على مستواك الجديد.</small></div></div></div>';
  h += '</div></section>';

  h += '<div class="tools"><button class="btn" data-new>🔄 ارسم خارطة جديدة</button><a class="btn soft" href="#intro">✏️ عدّل خارطتي</a><a class="btn ghost" href="../index.html#sections">🗂️ كل أقسام النادي</a></div>'
    + '<p class="foot">خارطتك محفوظة في حسابك، وتراها في أي جهاز تدخل منه برمزك.<br>إعداد: <b>أ. أحمد بن سالم</b></p>';
  app.innerHTML = h;
  if (fresh) { fresh = 0; fireworks(); }

  app.querySelectorAll('[data-tk]').forEach(function(b){ b.onclick = function(){ var s = dayState(); s.ok[b.dataset.tk] = 1; S('mp-day', s); sfx(1); vMap(); }; });
  app.querySelectorAll('[data-st]').forEach(function(b){ b.onclick = function(){
    var t = T[b.dataset.st];
    if (t.key && prog(plan, t.id) < .5 && !confirm('هل أنهيت فعلاً «' + t.n + '»؟ تقدّمك فيها يُحسب تلقائياً من تدريبك.')) return;
    var before = plan.stage; plan.done[b.dataset.st] = 1; S('my-path', plan); sfx(1);
    var s = dayState(); s.ok[b.dataset.st] = 1; S('mp-day', s);
    vMap(); if (stageDone(plan, before)) { fireworks(); toast('🎉 أنهيت المرحلة ' + (before + 1) + '! انطلق للمرحلة التالية'); } }; });
  // A brand-new map from scratch (empty answers); the old one is replaced only when the new one is drawn, and the 🔥 days stay.
  app.querySelectorAll('[data-new]').forEach(function(b){ b.onclick = function(){
    if (!confirm('ستصمّم خارطة جديدة من البداية بإجابات جديدة، وتحلّ محل خارطتك الحالية حين تنتهي منها. أيام إنجازك 🔥 تبقى محفوظة. هل تريد البدء؟')) return;
    A = { goal: null, lvl: null, r: {}, time: null, redrawn: (plan.redrawn || 0) + 1 }; step = 0; location.hash = '#q'; }; });
  var sk = document.getElementById('skip');
  if (sk) sk.onclick = function(){ if (!confirm('ستنتقل إلى المرحلة التالية، وتبقى محطات هذه المرحلة مفتوحة لك. هل أنت متأكد؟')) return;
    stageIds(plan, plan.stage).forEach(function(id){ if (id !== 'lvl') plan.done[id] = 1; }); S('my-path', plan); fireworks(); vMap(); window.scrollTo(0, 0); };
  app.querySelectorAll('[data-ci]').forEach(function(b){ b.onclick = function(){
    var k = b.dataset.k, v = +b.dataset.ci;
    plan.ci = Math.floor((Date.now() - plan.at) / 864e5 / 14); plan.r[k] = v; S('my-path', plan);
    if (v === 2 && plan.stage < plan.stages.length && plan.stages[plan.stage].k === k) { stageIds(plan, plan.stage).forEach(function(id){ if (id !== 'lvl') plan.done[id] = 1; }); S('my-path', plan); fireworks(); toast('💪 رائع! انتقلت للمرحلة التالية'); }
    else toast(v === 0 ? 'لا بأس، الاستمرار هو السر. واصل مهمتك اليومية' : 'تقدّم جميل! واصل');
    vMap(); }; });
}

function vRoute(){
  var hs = location.hash, has = !!J('my-path', null);
  if (hs === '#q') vWizard();
  else if (hs === '#intro' || !has) vIntro();
  else vMap();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', vRoute);
window.addEventListener('pageshow', function(e){ if (e.persisted) vRoute(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && location.hash !== '#q') load().then(vRoute); });

/* ================= fireworks ================= */
function fireworks(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('fx'), x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, ps = [], cols = ['#3157d5','#11826a','#f2b53a','#e8607a','#8a6cf0'];
  for (var b = 0; b < 4; b++) { var cx = W * (.2 + .6 * Math.random()), cy = H * (.2 + .3 * Math.random()); for (var i = 0; i < 40; i++) { var a = Math.random() * 6.28, s = 2 + Math.random() * 4; ps.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 60 + Math.random() * 30, c: cols[(b + i) % 5] }); } }
  (function f(){ x.clearRect(0, 0, W, H); ps = ps.filter(function(p){ return p.l-- > 0; }); ps.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += .06; x.globalAlpha = Math.min(1, p.l / 30); x.fillStyle = p.c; x.fillRect(p.x, p.y, 4, 4); }); if (ps.length) requestAnimationFrame(f); else x.clearRect(0, 0, W, H); })();
}

/* ================= start ================= */
function load(){
  return import('../assets/honor.js?v=20261112b').then(function(H){
    PARTS = H.computeScore().parts || {};
    var p = J('my-path', null);
    if (p && (!p.base || !Object.keys(p.base).length)) { p.base = snap(); S('my-path', p); }   // map drawn before the points loaded
  }).catch(function(){});
}
vRoute();
load().then(function(){ if (location.hash !== '#q') vRoute(); });
})();
</script>
