<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<script src="../assets/gate.js?v=12"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>هندسة مساري · نادي اللغة الإنجليزية</title>
<meta name="theme-color" content="#f5f8ff">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Lexend:wght@500;600&display=swap" media="print" onload="this.media='all'">
<style>
/* هندسة مساري — مخطط بيتي (renamed 16 Nov 2026 from «خارطة طريقي», 15 Nov 2026): a student who feels lost among the many sections draws his own road map.
   1) Awareness: a language is a house — vocabulary + structures are the foundation, the four skills are the pillars.
   2) Four questions: goal, level (from the level test when there is one), a self-rating of the six parts, daily time.
   3) The map: 3 stages (the three parts that need most work, foundation first on a tie), each with 2–3 stations
      chosen from the club's sections for his level and goal, a daily mission sized to his time, and a check-in
      every two weeks / after the post test that redraws the map. Progress is read from the honor points (parts),
      measured from the moment the map was drawn; stations without points are ticked by the student.
   Saved in localStorage `my-path` (backed up with the rest of the progress) and `mp-day` (today's snapshot). */
:root{color-scheme:light;--paper:#f5f8ff;--card:#fff;--ink:#232c47;--muted:#5a6482;--line:#e3e8f4;
  --blue:#3157d5;--blue-soft:#e8eeff;--teal:#11826a;--teal-soft:#e3f6ef;--sun:#a26f00;--sun-soft:#fff4d6;--coral:#c2452a;--coral-soft:#ffece4;--violet:#6046e8;--violet-soft:#efebff;
  --weak:#f6b5a6;--weak-t:#9e3a22;--ok:#ffe08a;--ok-t:#7a5600;--good:#a8e3c8;--good-t:#0e6b52;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;--en:"Lexend","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:20px;line-height:1.75;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:14px}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{text-decoration:none;font-weight:800;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:1rem}
.hero{margin-top:16px;border-radius:30px;padding:26px 20px;text-align:center;background:linear-gradient(135deg,#e8eeff,#e9f8f2 55%,#fff6e0);border:1px solid #e1e6f8}
.hero .big{font-size:3.2rem;line-height:1}
.hero h1{margin:6px 0 0;font-size:2.1rem;line-height:1.3;color:#2a46b8}
.hero p{margin:8px auto 0;max-width:640px;color:var(--muted);font-size:1.1rem}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:1rem}
.card{overflow:hidden;margin-top:18px;background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:20px 18px}
.card h2{margin:0 0 6px;font-size:1.45rem;line-height:1.4}
.card .lead{margin:0;color:var(--muted);font-size:1.06rem}
.btn{display:inline-block;text-decoration:none;font-weight:800;border:0;border-radius:999px;padding:12px 24px;font-size:1.12rem;background:var(--blue);color:#fff;line-height:1.4}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.teal{background:var(--teal)}
.btn.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.center{text-align:center}

/* ---------- the language house (centred; roof with eaves + chimney, beam, 4 columns, floor slab, brick foundation, grass) ---------- */
.house{width:100%;max-width:520px;margin:18px auto 6px;padding:0 10px;display:flex;flex-direction:column;align-items:stretch}
.roof{position:relative;height:118px;margin:0 -10px;display:grid;place-items:end center;padding-bottom:16px}
.roof::before{content:"";position:absolute;inset:0;background:linear-gradient(170deg,#b9c9ff,#dfe7ff);clip-path:polygon(50% 0,100% 100%,0 100%);z-index:1}
.roof::after{content:"";position:absolute;top:30px;left:16%;width:30px;height:46px;background:#cdd8fb;border:2px solid #b3c3f5;border-bottom:0;border-radius:4px 4px 0 0;z-index:0}
.roof .win{z-index:2;position:absolute;top:40px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#fff8dc;border:3px solid #9fb2ee;display:grid;place-items:center;font-size:1rem}
.roof b{z-index:2;position:relative;font-size:1.25rem;color:#2a46b8;line-height:1.2}
.roof b .en{font-size:.95rem;color:#5a6aa8;margin-inline-start:6px}
.beam{height:14px;margin:0 2px;border-radius:4px;background:#c9d4f6;border:1.5px solid #b3c3f5}
.cap{margin:6px 0 4px;text-align:center;font-size:.92rem;font-weight:800;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 6px}
.found{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.blk{min-width:0;border-radius:14px;padding:10px 4px;text-align:center;border:2px solid #dbe2f3;background:#f7f9ff;transition:background .4s,border-color .4s}
.pillars .blk{position:relative;min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:6px;
  border-top-width:7px;border-bottom-width:7px}
.blk .i{font-size:1.8rem;line-height:1.2}
.blk b{display:block;font-size:1.02rem;line-height:1.35;overflow-wrap:anywhere}
.blk small{display:block;font-size:.78rem;color:var(--muted);font-family:var(--en);direction:ltr;overflow-wrap:anywhere;line-height:1.3}
.blk .f{display:block;font-size:.9rem;font-weight:800;margin-top:2px;line-height:1.3}
.floor{height:12px;margin:0 -4px;border-radius:4px;background:#cfc3a6}
.found .blk{border-radius:10px;padding:12px 6px;border-color:#d9c9a3;
  background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(160,130,80,.16) 22px 24px),#f6efdf}
.found .blk .i{font-size:1.6rem}
.blk.r0{background-color:#fff0ec;border-color:var(--weak)}.blk.r0 .f{color:var(--weak-t)}
.blk.r1{background-color:#fff8de;border-color:var(--ok)}.blk.r1 .f{color:var(--ok-t)}
.blk.r2{background-color:#e9f8f1;border-color:var(--good)}.blk.r2 .f{color:var(--good-t)}
.pillars .blk.r0,.pillars .blk.r1,.pillars .blk.r2{background-image:none}
.blk.fx{box-shadow:0 0 0 4px #9fb2ee}
.ground{height:12px;margin:2px -14px 0;border-radius:999px;background:linear-gradient(90deg,#bfe3c4,#d6efd8,#bfe3c4)}
@media (max-width:520px){.house{padding:0 6px}.pillars{gap:6px;padding:0 2px}.pillars .blk{min-height:150px}.blk b{font-size:.92rem}.blk .i{font-size:1.5rem}.blk small{font-size:.7rem}.blk .f{font-size:.82rem}.roof{height:100px}.roof .win{top:34px;width:30px;height:30px}}
/* ---------- مخطط بيتي (16 Nov 2026): the same house, each part filled to the student's level; scaffold sign on the part he builds now ---------- */
.house.bp .blk{position:relative;background:linear-gradient(to top,var(--fc) var(--lv),#fbfcff var(--lv))}
.house.bp .found .blk{background:linear-gradient(to left,var(--fc) var(--lv),#fbfcff var(--lv))}
.house.bp .blk.r0{--fc:#ffd9cf}.house.bp .blk.r1{--fc:#ffeaa6}.house.bp .blk.r2{--fc:#c4ecd9}
.house.bp .blk .pc{display:block;font-family:var(--en);font-weight:600;font-size:.9rem;color:#2a46b8}
.house.bp .pillars{margin-top:16px}
.house.bp .blk.wip{border-style:dashed;border-color:#e9907b;box-shadow:none}
.house.bp .blk .sign{position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff4d6;color:#8a5d00;border:1.5px solid #f2c94c;border-radius:999px;padding:0 8px;font-size:.78rem;font-weight:800;line-height:1.7;z-index:2}
.house.bp .blk .ok{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:1.05rem}
.bphd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bphd h2{flex:1;margin:0}
.bpno{font-weight:800;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 12px;font-size:.95rem}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.92rem;font-weight:800;color:var(--muted)}
.legend span{background:var(--paper);border-radius:999px;padding:2px 12px}
@media (max-width:520px){.house.bp .blk .sign{font-size:.7rem;padding:0 6px}}
/* ---------- v3 (16 Nov 2026): one clear screen — header, today's work order (clipboard), 3-stage stepper, the house ---------- */
.top{display:flex;align-items:center;gap:14px;margin-top:16px;background:linear-gradient(120deg,#e4f1ff,#e3f8ef);border:2px solid #9fcdf2;border-radius:26px;padding:16px}
.top .ic{flex:none;font-size:2.2rem;width:66px;height:66px;background:#fff;border-radius:20px;display:grid;place-items:center;border:2px solid #9fcdf2;transform:rotate(-6deg)}
.top .tx{flex:1;min-width:0}
.top h1{margin:0;font-size:1.75rem;line-height:1.3;color:#1e3a8a}.top h1 span{color:#0d9488}
.top p{margin:2px 0 0;color:#475569;font-size:1.04rem;line-height:1.6}
.top .chips{justify-content:flex-start;margin-top:8px}.top .chips span{font-size:.92rem;padding:2px 12px;border-color:#cfe0f5}
.cta{display:block;width:100%;margin-top:16px;background:linear-gradient(90deg,#0d9488,#1d6fd1);color:#fff;border:0;border-radius:999px;padding:15px;font-size:1.25rem;font-weight:800;text-align:center;text-decoration:none}
.how3{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:12px}
.how3 li{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #e3e8f4;border-radius:20px;padding:12px 14px}
.how3 .n{flex:none;position:relative;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem}
.how3 .n i{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#1e3a8a;color:#fff;font-style:normal;font-size:.8rem;font-weight:800;display:grid;place-items:center}
.how3 li:nth-child(1) .n{background:#e1efff}.how3 li:nth-child(2) .n{background:#fff1dc}.how3 li:nth-child(3) .n{background:#ddf6ef}
.how3 b{display:block;font-size:1.15rem;color:#1e3a8a;line-height:1.4}.how3 small{display:block;color:#64748b;font-size:1rem;line-height:1.55}
.order{margin-top:18px;background:#fff;border:2px solid #9fcdf2;border-radius:26px;overflow:hidden}
.order .clip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#0d9488,#1d6fd1);color:#fff;padding:12px 16px;font-weight:800;font-size:1.2rem}
.order .clip .dt{font-size:.95rem;font-weight:500}
.order .ob{padding:16px}
.ohd{display:flex;align-items:center;gap:14px}
.ring{flex:none;width:74px;height:74px;border-radius:50%;background:conic-gradient(#10b981 var(--p),#e5edf5 0);display:grid;place-items:center}
.ring b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--en);font-size:1.2rem;color:#1e3a8a;direction:ltr}
.ohd .t{flex:1;min-width:0}.ohd .t b{display:block;font-size:1.25rem;color:#1e3a8a;line-height:1.4}.ohd .t small{display:block;color:#64748b;font-size:1rem}
.ohd .fire{flex:none;font-weight:800;background:#fff3dc;color:#9a4a00;border:1.5px solid #f6c48a;border-radius:999px;padding:2px 12px;font-size:.98rem}
.olist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.olist li{display:flex;align-items:center;gap:12px;border:2px solid #e3e8f4;border-radius:18px;padding:12px}
.olist .bx{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid #9fcdf2;display:grid;place-items:center;font-weight:800;color:#1d6fd1;font-family:var(--en)}
.olist .i{flex:none;font-size:1.7rem}
.olist .tx{flex:1;min-width:0}.olist .tx b{display:block;font-size:1.1rem;line-height:1.4}.olist .tx small{display:block;color:#64748b;font-size:.94rem;line-height:1.5}
.olist .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.olist li.done{background:#effaf5;border-color:#a9e4c6}.olist li.done .bx{background:#10b981;border-color:#10b981;color:#fff}
.order .go,.sdet .go{background:#1d6fd1}
.yay{margin-top:12px;text-align:center;font-weight:800;color:#0f766e;font-size:1.12rem;background:#e3f8ef;border-radius:16px;padding:10px}
.steps3{position:relative;display:flex;justify-content:space-between;margin:18px 0 4px}
.steps3 .ln,.steps3 .ln2{position:absolute;top:29px;right:16.6%;height:5px;border-radius:5px}
.steps3 .ln{left:16.6%;background:#e3e8f4}.steps3 .ln2{background:#10b981}
.sn{position:relative;z-index:1;flex:1;min-width:0;text-align:center;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer}
.sn .c{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:#fff;border:3px solid #dbe3ef}
.sn.fin .c{border-color:#10b981;background:#e9f9f1}.sn.cur .c{border-color:#f59e0b;background:#fff6e5;box-shadow:0 0 0 6px #fdebc8}
.sn b{display:block;font-size:1.02rem;margin-top:6px;line-height:1.3}.sn small{display:block;font-size:.84rem;color:#64748b;font-weight:800}
.sn.cur small{color:#b45309}.sn.fin small{color:#0f766e}
.sn.sel .c{outline:3px solid #1d6fd1;outline-offset:3px}
.sdet{margin-top:16px;background:#f6f9fe;border:2px solid #e3e8f4;border-radius:22px;padding:14px}
.sdet h3{margin:0;font-size:1.22rem;color:#1e3a8a;line-height:1.4}.sdet .why{margin:4px 0 0;color:#64748b;font-size:1rem}
.sdet .stn{background:#fff}
.endl{margin-top:12px;text-align:center;color:#64748b;font-size:.98rem}
@media (max-width:560px){.olist li{flex-wrap:wrap}.olist .acts{flex-direction:row;width:100%}.olist .acts>*{flex:1}.top h1{font-size:1.5rem}.top .ic{width:56px;height:56px;font-size:1.9rem}}
/* ---------- intro story (16 Nov 2026): the language is a house; each part of the language is a building material ---------- */
.story{margin-top:18px;background:#fff;border:2px solid #9fcdf2;border-radius:26px;padding:20px 18px;position:relative;overflow:hidden}
.story::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#0d9488,#1d6fd1,#f59e0b)}
.story h2{margin:4px 0 6px;font-size:1.5rem;color:#1e3a8a;line-height:1.4}
.story .lead{font-size:1.1rem;color:#334155;line-height:1.85}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.mat{border-radius:20px;padding:14px 12px;border:2px solid;background:#fff;min-width:0}
.mat .e{font-size:2rem;line-height:1.1}
.mat b{display:block;font-size:1.1rem;line-height:1.35;margin-top:4px}
.mat b em{font-style:normal;font-weight:500;font-size:.95rem;color:#64748b}
.mat p{margin:4px 0 0;font-size:.98rem;line-height:1.6;color:#475569}
.mat.m1{border-color:#f6c48a;background:#fffaf2}.mat.m1 b{color:#9a4a00}
.mat.m2{border-color:#9fcdf2;background:#f5faff}.mat.m2 b{color:#1d4ed8}
.mat.m3{border-color:#8fdcc4;background:#f3fcf8}.mat.m3 b{color:#0f766e}
.mat.m4{border-color:#b5e08a;background:#f8fdf1}.mat.m4 b{color:#3f6212}
.mat.m5{border-color:#cbd5e1;background:#f8fafc}.mat.m5 b{color:#334155}
.mat.wide{grid-column:1/-1;display:flex;gap:12px;align-items:center}.mat.wide .e{flex:none}
.eng{margin-top:14px;display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#e4f1ff,#e3f8ef);border-radius:20px;padding:14px}
.eng .e{flex:none;font-size:2.2rem}.eng b{display:block;font-size:1.15rem;color:#1e3a8a}.eng p{margin:2px 0 0;color:#475569;font-size:1rem;line-height:1.6}
.quote{margin:16px 0 0;text-align:center;font-weight:800;color:#0f766e;font-size:1.12rem}
.top .go2{display:inline-block;margin-top:8px;text-decoration:none;font-weight:800;background:#1d6fd1;color:#fff;border-radius:999px;padding:7px 16px;font-size:1rem}
@media (max-width:420px){.mats{grid-template-columns:1fr}.mat{display:flex;gap:12px;align-items:center}.mat .e{flex:none}}
.facts{display:grid;gap:10px;margin-top:14px}
.fact{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:12px 14px;font-size:1.05rem}
.fact .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}
.fact b{color:#2a46b8}

/* ---------- wizard ---------- */
.steps{display:flex;gap:6px;justify-content:center;margin:16px 0 4px;direction:ltr}
.steps i{width:40px;height:9px;border-radius:999px;background:#dfe5f2}
.steps i.on{background:var(--blue)}
.qh{font-size:1.5rem;margin:6px 0 4px;line-height:1.45}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:right;width:100%;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 16px;color:var(--ink);transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:#b9c7f2}
.opt .i{flex:none;font-size:2.1rem;width:56px;height:56px;display:grid;place-items:center;background:var(--paper);border-radius:18px}
.opt b{display:block;font-size:1.16rem;line-height:1.4}
.opt small{display:block;color:var(--muted);font-size:.96rem;line-height:1.5}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .i{background:#fff}
.note{margin-top:12px;background:var(--sun-soft);border:1.5px solid #f2dc97;border-radius:18px;padding:10px 14px;font-size:1.02rem;color:#6b4a00}
.note a{color:#2a46b8;font-weight:800}
.rate{background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 14px}
.rate.set{border-color:#cfd9f6}
.rate .top{display:flex;align-items:center;gap:10px}
.rate .top .i{font-size:1.8rem}
.rate .top b{font-size:1.15rem}
.rate .top small{font-family:var(--en);direction:ltr;color:var(--muted);font-size:.9rem}
.rate p{margin:4px 0 8px;color:var(--muted);font-size:1rem;line-height:1.6}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.faces button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;font-weight:800;font-size:1rem;color:var(--ink);line-height:1.4}
.faces button span{display:block;font-size:1.6rem}
.faces button[aria-pressed="true"].f0{background:#fff0ec;border-color:#e9907b}
.faces button[aria-pressed="true"].f1{background:#fff8de;border-color:#e8c44c}
.faces button[aria-pressed="true"].f2{background:#e9f8f1;border-color:#6fc7a0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;direction:ltr}
.nav .btn{min-width:130px;text-align:center}

/* ---------- map ---------- */
.today{background:linear-gradient(135deg,#eef3ff,#fff 70%);border-color:#d3ddfa}
.today .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today .hd h2{flex:1;margin:0}
.streak{font-weight:800;background:#fff4d6;color:#8a5d00;border:1.5px solid #f2dc97;border-radius:999px;padding:2px 12px;font-size:1rem}
.tasks{display:grid;gap:10px;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 14px}
.task.done{border-color:#bfe5d3;background:linear-gradient(120deg,#effaf4,#fff 70%)}
.task .i{flex:none;font-size:1.9rem;width:52px;height:52px;display:grid;place-items:center;background:var(--paper);border-radius:16px}
.task .tx{flex:1;min-width:0}
.task b{display:block;font-size:1.12rem;line-height:1.4}
.task small{display:block;color:var(--muted);font-size:.95rem;line-height:1.5}
.task .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.go{text-decoration:none;font-weight:800;border-radius:999px;padding:8px 16px;background:var(--blue);color:#fff;white-space:nowrap;border:0;text-align:center;font-size:1rem}
.tick{font-weight:800;border-radius:999px;padding:6px 12px;background:#fff;color:var(--teal);border:1.5px solid #bfe5d3;white-space:nowrap;font-size:.95rem}
.task.done .tick,.stn.done .tick{background:var(--teal);color:#fff;border-color:var(--teal)}
.alldone{margin-top:12px;text-align:center;font-weight:800;color:var(--teal);font-size:1.12rem}
.trail{position:relative;margin-top:22px;padding-inline-start:34px}
.trail::before{content:"";position:absolute;top:10px;bottom:10px;right:15px;width:5px;border-radius:5px;background:repeating-linear-gradient(180deg,#c9d4f3 0 12px,transparent 12px 20px)}
.stage{position:relative;margin-bottom:18px}
.stage .dot{position:absolute;right:-34px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:3px solid #c9d4f3;color:var(--muted);font-size:1rem}
.stage.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px #dbe4ff;animation:pulse 2.4s ease-in-out infinite}
.stage.fin .dot{background:var(--teal);border-color:var(--teal);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(49,87,213,.12)}}
.sbox{background:#fff;border:2px solid var(--line);border-radius:24px;padding:16px}
.stage.cur .sbox{border-color:#b9c7f2;box-shadow:0 18px 36px -30px #3157d5}
.stage.later .sbox{background:#fbfcff}
.stage .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage .hd h3{margin:0;font-size:1.3rem;flex:1;line-height:1.4}
.stage .tag{font-size:.92rem;font-weight:800;border-radius:999px;padding:2px 12px;background:var(--paper);color:var(--muted)}
.stage.cur .tag{background:var(--blue-soft);color:var(--blue)}
.stage.fin .tag{background:var(--teal-soft);color:var(--teal)}
.stage .why{margin:6px 0 0;color:var(--muted);font-size:1rem}
.stns{display:grid;gap:10px;margin-top:12px}
.stn{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px}
.stn.done{border-color:#bfe5d3;background:#f3fbf7}
.stn .i{flex:none;font-size:1.7rem;width:48px;height:48px;display:grid;place-items:center;background:var(--paper);border-radius:14px}
.stn .tx{flex:1;min-width:0}
.stn b{display:block;font-size:1.08rem;line-height:1.4}
.stn small{display:block;color:var(--muted);font-size:.93rem;line-height:1.5}
.bar{height:10px;border-radius:999px;background:#eef0f7;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .6s var(--ease)}
.stn .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.next{margin-top:12px;text-align:center}
.flag{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff6e0,#fff 70%);border:2px dashed #f0d48a;border-radius:24px;padding:16px}
.flag .i{font-size:2.2rem}
.flag b{display:block;font-size:1.18rem;color:#8a5d00}
.flag small{display:block;color:var(--muted);font-size:.98rem}
.checkin{background:linear-gradient(135deg,#fff8e1,#fff 70%);border-color:#f2dc97}
.checkin .rate{margin-top:10px}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.98rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232c47;color:#fff;font-weight:800;border-radius:999px;padding:10px 22px;z-index:50;font-size:1.02rem;max-width:calc(100% - 30px);text-align:center;transition:opacity .3s}
.toast.hide{opacity:0;pointer-events:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:560px){.hero h1{font-size:1.8rem}.task,.stn{flex-wrap:wrap}.task .acts,.stn .acts{flex-direction:row;width:100%}.task .acts>*,.stn .acts>*{flex:1}}
@media (prefers-reduced-motion:reduce){.stage.cur .dot{animation:none}}

<script>
(function(){
'use strict';
/* ================= data ================= */
// The six parts of a language. Foundation first (vocabulary, structures), then receptive skills, then productive ones.
var C = [
  {k:'voc', ar:'المفردات', en:'Vocabulary', ic:'🧱', base:1, q:'هل تفهم معاني أغلب الكلمات في كتابك المدرسي؟', why:'الكلمات هي الطوب: بلا كلمات لا فهم ولا كلام.'},
  {k:'gra', ar:'التراكيب', en:'Grammar', ic:'🔩', base:1, q:'هل ترتّب كلمات الجملة صحيحة، وتعرف متى تستعمل كل زمن؟', why:'التراكيب هي الإسمنت الذي يربط الكلمات في جمل صحيحة.'},
  {k:'lis', ar:'الاستماع', en:'Listening', ic:'🎧', q:'هل تفهم جملة قصيرة حين تسمعها دون أن تراها مكتوبة؟', why:'تسمع قبل أن تتكلم: الأذن تفتح الطريق للسان.'},
  {k:'rea', ar:'القراءة', en:'Reading', ic:'📖', q:'هل تقرأ فقرة قصيرة وتفهم فكرتها العامة؟', why:'القراءة تزيد كلماتك وتريك التراكيب في مكانها.'},
  {k:'spe', ar:'التحدث', en:'Speaking', ic:'🗣️', q:'هل تعرّف بنفسك وتجيب عن سؤال بسيط بالإنجليزية بصوتك؟', why:'التحدث يحوّل ما تعرفه إلى لغة حيّة تستعملها.'},
  {k:'wri', ar:'الكتابة', en:'Writing', ic:'✍️', q:'هل تكتب جملة صحيحة من تأليفك دون نسخ؟', why:'الكتابة تثبّت الكلمات والتراكيب في ذاكرتك.'}
];
var CK = {}; C.forEach(function(c, i){ c.i = i; CK[c.k] = c; });
var FACE = [['😟','ضعيف'],['🙂','مقبول'],['😎','قوي']];

var GOALS = [
  {k:'school', ic:'🏫', b:'التفوّق في مادة الإنجليزي بالمدرسة', s:'درجات أعلى في الاختبارات والكتاب المدرسي', w:{voc:-3, gra:-3, rea:-2}},
  {k:'step', ic:'📝', b:'الاستعداد لاختبار ستيب (STEP)', s:'قراءة وقواعد واستماع بأسلوب الاختبار', w:{rea:-4, gra:-4, voc:-2, lis:-2}},
  {k:'talk', ic:'💬', b:'أن أتحدث وأفهم من يكلّمني', s:'محادثة وثقة في السفر والحياة اليومية', w:{spe:-6, lis:-5}},
  {k:'fun', ic:'🌟', b:'المتعة وتطوير نفسي', s:'قصص وتعبيرات وتحديات بلا ضغط', w:{rea:-3, lis:-2, voc:-1}}
];
var GK = {}; GOALS.forEach(function(g){ GK[g.k] = g; });
var LVL = [
  {ic:'🌱', b:'مبتدئ', s:'أعرف الحروف وكلمات قليلة'},
  {ic:'🌿', b:'متوسط', s:'أفهم جملاً بسيطة وأكوّن بعضها'},
  {ic:'🌳', b:'متقدّم', s:'أقرأ نصوصاً وأتحدث بثقة نسبياً'}
];
var TIMES = [{m:10, ic:'⏱️', b:'10 دقائق', s:'مهمة واحدة في اليوم'}, {m:20, ic:'⏰', b:'20 دقيقة', s:'مهمتان: تعلّم + مراجعة', rec:1}, {m:30, ic:'🔥', b:'30 دقيقة', s:'ثلاث مهام: انطلاقة قوية'}];

var PC = window.PathCore, T = PC.T, ORDER = PC.ORDER, FAV = PC.FAV, J = PC.J, S = PC.S, dayNo = PC.dayNo, testLevel = PC.testLevel, snap = PC.snap,
    prog = PC.prog, stageIds = PC.stageIds, stageDone = PC.stageDone, todayTasks = PC.todayTasks, dayState = PC.dayState, taskDone = PC.taskDone;

/* ================= storage & helpers ================= */
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var app = document.getElementById('app');

function nm(t){ return t.en ? '<span class="en">' + esc(t.n) + '</span>' : esc(t.n); }
function toast(t){ var e = document.getElementById('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(toast.h); toast.h = setTimeout(function(){ e.classList.add('hide'); }, 2600); }
function sfx(ok){ try { window.clubSfx && window.clubSfx(ok ? 'right' : 'wrong'); } catch (e) {} }

/* ================= plan building ================= */
function priority(r, goal){
  var w = (GK[goal] || {}).w || {};
  return C.map(function(c){ return { k: c.k, p: (r[c.k] == null ? 1 : r[c.k]) * 10 + (w[c.k] || 0) + c.i * .1 }; })
          .sort(function(a, b){ return a.p - b.p; }).map(function(x){ return x.k; });
}
function fits(t, band, b1, goal){
  if (t.goal && t.goal !== goal) return false;
  if (t.el && !b1) return false;
  return band >= t.lv[0] && band <= t.lv[1];
}
function build(a){
  var tl = testLevel(), band = tl ? tl.band : a.lvl, b1 = !!(tl && tl.b1);
  var focus = priority(a.r, a.goal).slice(0, 3), used = {}, fav = FAV[a.goal] || [];
  var stages = focus.map(function(k){
    var list = ORDER[k].filter(function(id){ return fits(T[id], band, b1, a.goal); });
    var top = ORDER[k].filter(function(id){ return fits(T[id], band, b1, a.goal); })[0];
    list.sort(function(x, y){
      var fx = fav.indexOf(x) >= 0 ? 0 : 1, fy = fav.indexOf(y) >= 0 ? 0 : 1;
      var ux = used[x] && x !== top ? 1 : 0, uy = used[y] && y !== top ? 1 : 0;
      return ux - uy || fx - fy || ORDER[k].indexOf(x) - ORDER[k].indexOf(y);
    });
    // a station already used by an earlier stage comes back only if it is this part's best fit
    var pick = list.filter(function(id){ return !used[id] || id === top; }).slice(0, 3);
    if (pick.length < 2) pick = list.slice(0, 3);
    pick.forEach(function(id){ used[id] = 1; });
    return { k: k, s: pick };
  });
  var p = { v: 1, at: Date.now(), goal: a.goal, lvl: band, lvSrc: tl ? 'test' : 'self', lvName: tl ? tl.name : '', r: a.r, time: a.time,
            stages: stages, stage: 0, base: {}, done: {}, days: {}, ci: 0, redrawn: (a.redrawn || 0), b1: b1, tlAt: tl ? tl.at : 0 };
  if (!tl) p.needTest = 1;
  if (PC.parts()) p.base = snap();
  return p;
}

/* ================= progress ================= */

/* ================= views ================= */
function house(r, focus){
  r = r || {}; focus = focus || [];
  var b = function(k){ var c = CK[k], v = r[k]; return '<div class="blk' + (v != null ? ' r' + v : '') + (focus.indexOf(k) >= 0 ? ' fx' : '') + '"><span class="i">' + c.ic + '</span><b>' + c.ar + '</b><small>' + c.en + '</small>' + (v != null ? '<span class="f">' + FACE[v][0] + ' ' + FACE[v][1] + '</span>' : '') + '</div>'; };
  return '<div class="house" aria-label="بيت اللغة"><div class="roof"><span class="win" aria-hidden="true">⭐</span><b>اللغة <span class="en">English</span></b></div>'
    + '<div class="beam"></div><div class="cap">الأعمدة: المهارات الأربع</div>'
    + '<div class="pillars">' + ['lis','rea','spe','wri'].map(b).join('') + '</div>'
    + '<div class="floor"></div><div class="cap">الأساس</div>'
    + '<div class="found">' + ['voc','gra'].map(b).join('') + '</div><div class="ground"></div></div>';
}

// The student's own house: each part filled to his level (self-rating, raised by the stations he finishes);
// the part he builds now carries a 🚧 sign, finished stages a ✅.
function bpHouse(plan){
  var cur = plan.stage, idx = {}; plan.stages.forEach(function(s, i){ idx[s.k] = i; });
  var BASE = [22, 50, 78];
  var b = function(k){
    var c = CK[k], v = plan.r[k] != null ? plan.r[k] : 1, lv = BASE[v], i = idx[k], tag = '';
    if (i != null) {
      var ids = stageIds(plan, i).filter(function(id){ return id !== 'lvl'; }), pr = ids.length ? ids.reduce(function(a, id){ return a + prog(plan, id); }, 0) / ids.length : 0;
      if (i < cur) pr = 1;
      lv = Math.round(lv + (96 - lv) * pr);
      tag = i === cur ? '<span class="sign">🚧 قيد البناء</span>' : i < cur ? '<span class="ok">✅</span>' : '';
    }
    return '<div class="blk r' + v + (i === cur ? ' wip' : '') + '" style="--lv:' + lv + '%">' + tag + '<span class="i">' + c.ic + '</span><b>' + c.ar + '</b><small>' + c.en + '</small><span class="pc">' + lv + '%</span></div>'; };
  return '<div class="house bp" aria-label="بيتي"><div class="roof"><span class="win" aria-hidden="true">⭐</span><b>بيتي <span class="en">English</span></b></div>'
    + '<div class="beam"></div><div class="cap">الأعمدة: المهارات الأربع</div>'
    + '<div class="pillars">' + ['lis','rea','spe','wri'].map(b).join('') + '</div>'
    + '<div class="floor"></div><div class="cap">الأساس</div>'
    + '<div class="found">' + ['voc','gra'].map(b).join('') + '</div><div class="ground"></div></div>';
}

function vIntro(){
  var has = !!J('my-path', null);
  app.innerHTML = '<section class="top"><span class="ic" aria-hidden="true">📐</span><div class="tx"><h1>هندسة <span>مساري</span></h1><p>خطة شخصية لك وحدك، تبني لغتك جزءاً بعد جزء.</p><a class="go2" href="#how">' + (has ? 'أعد تصميم مساري' : 'صمّم مساري') + ' ↓</a></div></section>'

    // the story: the language is a house
    + '<section class="story"><h2>🏠 اللغة بيت… وأنت مهندسه</h2>'
    + '<p class="lead">لا أحد يتعلّم الإنجليزية دفعة واحدة، كما لا يُبنى البيت في يوم. البيت يُبنى من مواد مختلفة، لكل مادة دورها، وإن نقصت واحدة ظهر الخلل في البناء كله. واللغة كذلك:</p>'
    + '<div class="mats">'
    + '<div class="mat m1"><div class="e">🧱</div><div><b>المفردات <em>= الطوب</em></b><p>كل كلمة تتعلمها طوبة. كلما كثر طوبك اتّسع بيتك، وقلت ما تريد.</p></div></div>'
    + '<div class="mat m2"><div class="e">🔩</div><div><b>التراكيب <em>= الإسمنت والحديد</em></b><p>القواعد وترتيب الجملة. بها تتماسك الكلمات، وبدونها يبقى الطوب كومة.</p></div></div>'
    + '<div class="mat m3"><div class="e">🔊</div><div><b>الأصوات <em>= الكهرباء</em></b><p>نطق الحروف والكلمات. لا تراها لكنها تُشغّل البيت: بها تفهم ما تسمع، ويفهمك من تكلّمه.</p></div></div>'
    + '<div class="mat m4"><div class="e">🏛️</div><div><b>المهارات الأربع <em>= الأعمدة</em></b><p>استماع وقراءة (تستقبل بهما)، وتحدث وكتابة (تنتج بهما). الاستقبال يسبق الإنتاج.</p></div></div>'
    + '<div class="mat m5 wide"><div class="e">🪟</div><div><b>التعبيرات والقصص <em>= النوافذ</em></b><p>منها تطلّ على أهل اللغة: كيف يمزحون ويصفون ويعبّرون. تجعل لغتك حيّة لا محفوظة.</p></div></div>'
    + '</div>'
    + '<div class="eng"><span class="e">👷</span><div><b>وأنت المهندس</b><p>لكل متعلم بيته؛ بيتك ليس كبيت زميلك. «هندسة مساري» تفحص بيتك، وتعرف أين النقص، ثم ترسم لك خطة البناء على قدر وقتك.</p></div></div>'
    + '<p class="quote">طوبة كل يوم… تبني بيتاً متيناً 💪</p></section>'

    // the house itself (design unchanged)
    + '<section class="card"><h2>🏗️ هكذا يبدو بيت اللغة</h2><p class="lead">الأساس من المفردات والتراكيب، وفوقه أعمدة المهارات الأربع. وكل قسم في النادي يبني جزءاً منه:</p>'
    + house() + '</section>'

    // how it works + start
    + '<section class="card" id="how"><h2>📐 كيف تصمّم مسارك؟</h2><ol class="how3">'
    + '<li><span class="n">🧭<i>1</i></span><span><b>أجب عن 4 أسئلة</b><small>هدفك، ومستواك، وتقييمك لنفسك، ووقتك اليومي. دقيقتان فقط.</small></span></li>'
    + '<li><span class="n">🏗️<i>2</i></span><span><b>يُرسم مخطط بيتك</b><small>3 مراحل بناء تبدأ بالجزء الأضعف عندك، من أقسام النادي المناسبة لمستواك.</small></span></li>'
    + '<li><span class="n">📋<i>3</i></span><span><b>نفّذ أمر عمل كل يوم</b><small>مهمة أو مهمتان على قدر وقتك، وترى بيتك يرتفع يوماً بعد يوم.</small></span></li>'
    + '</ol><button class="cta" id="go">📐 ' + (has ? 'أعد تصميم مساري' : 'صمّم مساري الآن') + '</button>'
    + (has ? '<div class="center" style="margin-top:10px"><a class="btn soft" href="#map">مخططي الحالي ←</a></div>' : '') + '</section>';
  document.getElementById('go').onclick = function(){ A = freshAnswers(); step = 0; location.hash = '#q'; };
  var g2 = app.querySelector('.go2'); if (g2) g2.onclick = function(e){ e.preventDefault(); document.getElementById('how').scrollIntoView({ behavior: 'smooth' }); };
}

var A = null, step = 0;
function freshAnswers(){
  var p = J('my-path', null) || {};
  return { goal: p.goal || null, lvl: p.lvSrc === 'self' ? p.lvl : null, r: Object.assign({}, p.r || {}), time: p.time || null, redrawn: p.v ? (p.redrawn || 0) + 1 : 0 };
}
function vWizard(){
  if (!A) A = freshAnswers();
  var tl = testLevel(), N = tl ? 3 : 4, idx = tl && step >= 1 ? step + 1 : step;  // idx: 0 goal, 1 level, 2 rating, 3 time
  var h = '<div class="steps">' + Array.apply(null, Array(N)).map(function(_, i){ return '<i class="' + (i <= step ? 'on' : '') + '"></i>'; }).join('') + '</div><section class="card">';
  var ok = false;
  if (idx === 0) {
    h += '<div class="qh">🎯 ما هدفك الأول من تعلّم الإنجليزية؟</div><p class="lead">اختر هدفاً واحداً الآن، وتستطيع تغييره متى شئت.</p><div class="opts">'
      + GOALS.map(function(g){ return '<button class="opt" data-g="' + g.k + '" aria-pressed="' + (A.goal === g.k) + '"><span class="i">' + g.ic + '</span><span><b>' + g.b + '</b><small>' + g.s + '</small></span></button>'; }).join('') + '</div>';
    ok = !!A.goal;
  } else if (idx === 1) {
    h += '<div class="qh">📈 كيف ترى مستواك الآن؟</div><p class="lead">لم تختبر مستواك بعد، فاختر ما يصفك أقرب وصف.</p><div class="opts">'
      + LVL.map(function(l, i){ return '<button class="opt" data-l="' + i + '" aria-pressed="' + (A.lvl === i) + '"><span class="i">' + l.ic + '</span><span><b>' + l.b + '</b><small>' + l.s + '</small></span></button>'; }).join('')
      + '</div><div class="note">💡 الأدق أن تختبر مستواك: <a href="../level/index.html">قياس المستوى ←</a> (ستكون أول محطة في مخططك إن لم تختبر).</div>';
    ok = A.lvl != null;
  } else if (idx === 2) {
    h += '<div class="qh">🔍 قيّم نفسك بصدق في الأجزاء الستة</div><p class="lead">' + (tl ? 'مستواك حسب الاختبار: <b class="en">' + esc(tl.name) + '</b>. ' : '') + 'لا أحد يرى إجاباتك؛ الصدق يرسم لك مخططاً أنفع.</p><div class="opts two">'
      + C.map(function(c){ var v = A.r[c.k]; return '<div class="rate' + (v != null ? ' set' : '') + '"><div class="top"><span class="i">' + c.ic + '</span><b>' + c.ar + '</b><small>' + c.en + '</small></div><p>' + c.q + '</p><div class="faces">'
        + FACE.map(function(f, i){ return '<button class="f' + i + '" data-c="' + c.k + '" data-v="' + i + '" aria-pressed="' + (v === i) + '"><span>' + f[0] + '</span>' + f[1] + '</button>'; }).join('') + '</div></div>'; }).join('') + '</div>';
    ok = C.every(function(c){ return A.r[c.k] != null; });
    if (!ok) h += '<p class="lead center" style="margin-top:10px">بقي ' + C.filter(function(c){ return A.r[c.k] == null; }).length + ' من 6</p>';
  } else {
    h += '<div class="qh">⏳ كم دقيقة تستطيع كل يوم؟</div><p class="lead">القليل الدائم أنفع من الكثير المنقطع.</p><div class="opts">'
      + TIMES.map(function(t){ return '<button class="opt" data-t="' + t.m + '" aria-pressed="' + (A.time === t.m) + '"><span class="i">' + t.ic + '</span><span><b>' + t.b + (t.rec ? ' <small style="display:inline;color:#11826a;font-weight:800">· ننصح بها</small>' : '') + '</b><small>' + t.s + '</small></span></button>'; }).join('') + '</div>';
    ok = !!A.time;
  }
  var last = step === N - 1;
  // English-style navigation: previous on the left, next on the right.
  h += '<div class="nav"><button class="btn ghost" id="prev">السابق</button><button class="btn' + (last ? ' teal' : '') + '" id="next"' + (ok ? '' : ' disabled') + '>' + (last ? 'صمّم مساري 📐' : 'التالي') + '</button></div></section>';
  app.innerHTML = h;
  app.querySelectorAll('[data-g]').forEach(function(b){ b.onclick = function(){ A.goal = b.dataset.g; vWizard(); }; });
  app.querySelectorAll('[data-l]').forEach(function(b){ b.onclick = function(){ A.lvl = +b.dataset.l; vWizard(); }; });
  app.querySelectorAll('[data-t]').forEach(function(b){ b.onclick = function(){ A.time = +b.dataset.t; vWizard(); }; });
  app.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(){ var y = window.scrollY; A.r[b.dataset.c] = +b.dataset.v; vWizard(); window.scrollTo(0, y); }; });
  document.getElementById('prev').onclick = function(){ if (step === 0) { location.hash = J('my-path', null) ? '#map' : ''; vRoute(); } else { step--; vWizard(); window.scrollTo(0, 0); } };
  document.getElementById('next').onclick = function(){
    if (!ok) return;
    if (!last) { step++; vWizard(); window.scrollTo(0, 0); return; }
    var old = J('my-path', null), p = build(A);
    if (old && old.days) p.days = old.days;                 // keep the streak of daily missions
    S('my-path', p); A = null; step = 0; fresh = 1; openSt = null;
    location.hash = '#map';
  };
}

var fresh = 0, openSt = null, lvKeep = 0;   // lvKeep: the «plan updated after your test» note stays until the page is left
function vMap(){
  var plan = J('my-path', null);
  if (!plan) { location.hash = ''; return; }
  // a level test taken after the plan was drawn updates the plan by itself (no questions asked again)
  var lvNote = 0, tl0 = testLevel();
  if (tl0 && tl0.at > (plan.tlAt || plan.at)) {
    if (tl0.band !== plan.lvl || (tl0.b1 && !plan.b1)) {
      var np = build({ goal: plan.goal, lvl: plan.lvl, r: plan.r || {}, time: plan.time, redrawn: (plan.redrawn || 0) + 1 });
      np.days = plan.days || {}; plan = np; lvNote = 2; openSt = null;
    } else { plan.lvSrc = 'test'; plan.lvName = tl0.name; plan.tlAt = tl0.at; delete plan.needTest; lvNote = 1; }
    S('my-path', plan); lvKeep = lvNote;
  }
  lvNote = lvKeep;
  // the stage moves on by itself once all its stations are done
  var moved = false;
  while (plan.stage < plan.stages.length && stageDone(plan, plan.stage)) { plan.stage++; moved = true; }
  if (moved) S('my-path', plan);
  var g = GK[plan.goal] || {}, tl = testLevel(), cur = plan.stage, ds = dayState(), d = dayNo();
  var focus = plan.stages.map(function(s){ return s.k; });
  var tasks = cur < plan.stages.length ? todayTasks(plan) : ['mb'];
  var nDone = tasks.filter(function(id){ return taskDone(id, ds); }).length;
  if (nDone === tasks.length && tasks.length && !plan.days[d]) { plan.days[d] = 1; S('my-path', plan); }
  var streak = 0, x = plan.days[d] ? d : d - 1; while (plan.days[x] && streak < 400) { streak++; x--; }
  var age = Math.floor((Date.now() - plan.at) / 864e5);

  var DT = ''; try { DT = new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) {}
  var N = plan.stages.length;
  if (openSt == null || openSt >= N) openSt = Math.min(cur, N - 1);
  var h = '<section class="top"><span class="ic" aria-hidden="true">📐</span><div class="tx"><h1>هندسة <span>مساري</span></h1>'
    + '<button type="button" class="newtop" data-new>📐 هندس مساراً جديداً</button>'
    + '<div class="chips"><span>' + (g.ic || '🎯') + ' ' + esc(g.b || '') + '</span><span>📈 ' + (plan.lvSrc === 'test' ? '<span class="en">' + esc(plan.lvName) + '</span>' : LVL[plan.lvl].b) + '</span><span>⏳ ' + plan.time + (plan.time <= 10 ? ' دقائق' : ' دقيقة') + '</span></div></div></section>';

  if (fresh) h += '<section class="card center" style="background:linear-gradient(135deg,#e3f8ef,#fff 70%);border-color:#a9e4c6"><h2>🎉 رُسم مخطط بيتك!</h2><p class="lead">تبني أولاً <b>' + CK[focus[0]].ar + '</b>، ثم <b>' + CK[focus[1]].ar + '</b>، ثم <b>' + CK[focus[2]].ar + '</b>. ابدأ بأمر عمل اليوم، وكل أقسام النادي تبقى مفتوحة لك.</p></section>';

  var onb = ''; try { onb = sessionStorage.getItem('club-onb') || ''; } catch (e) {}
  if (onb) h += '<section class="card center" style="border-color:#a9d3f5;background:#eaf3fd"><h2>✅ مسارك جاهز!</h2><p class="lead">الخطوة الأخيرة: ادخل الموقع وابدأ أول مهمة.</p><a class="cta" href="' + esc(onb) + '" onclick="try{sessionStorage.removeItem(\'club-onb\')}catch(e){}">🏠 ادخل الموقع ←</a></section>';

  var newTest = lvNote > 0;
  if (newTest) h += '<section class="card checkin"><h2>📈 حُدِّث مخططك حسب اختبارك</h2><p class="lead">مستواك الآن <b class="en">' + esc(tl.name) + '</b>. ' + (lvNote === 2 ? 'أعدنا اختيار محطاتك لتناسب مستواك، دون أسئلة جديدة.' : 'محطاتك مناسبة لمستواك، فواصل كما أنت.') + '</p></section>';
  else if (age >= 14 && (plan.ci || 0) < Math.floor(age / 14)) {
    var ck = focus[Math.min(cur, 2)];
    h += '<section class="card checkin"><h2>⏰ مرّ أسبوعان على مخططك</h2><p class="lead">كيف تشعر الآن في <b>' + CK[ck].ar + '</b>؟</p><div class="rate"><div class="faces">'
      + FACE.map(function(f, i){ return '<button class="f' + i + '" data-ci="' + i + '" data-k="' + ck + '"><span>' + f[0] + '</span>' + f[1] + '</button>'; }).join('') + '</div></div></section>';
  }

  // 1) today's work order — the first thing on the screen
  var left = tasks.length - nDone, pc = tasks.length ? Math.round(nDone / tasks.length * 100) : 0;
  h += '<section class="order"><div class="clip"><span>📋 أمر عمل اليوم</span><span class="dt">' + esc(DT) + '</span></div><div class="ob">'
    + '<div class="ohd"><div class="ring" style="--p:' + pc + '%"><b>' + nDone + '/' + tasks.length + '</b></div><div class="t"><b>'
    + (cur >= N ? 'اكتمل بناء مخططك! 🏁' : !left ? 'أنجزت أمر اليوم 👏' : left === 1 ? 'بقيت لك مهمة واحدة' : 'بقيت لك ' + left + ' مهام')
    + '</b><small>' + (cur >= N ? 'حافظ على المراجعة، ثم اختبر مستواك وصمّم مخططاً أعلى.' : 'اضغط «ابدأ»، وتدرّب، ثم ارجع إلى هنا.') + '</small></div>'
    + (streak ? '<span class="fire">🔥 ' + streak + '</span>' : '') + '</div><ol class="olist">'
    + tasks.map(function(id, n){ var t = T[id], dn = taskDone(id, ds); return '<li class="' + (dn ? 'done' : '') + '"><span class="bx">' + (dn ? '✓' : n + 1) + '</span><span class="i">' + t.ic + '</span><div class="tx"><b>' + nm(t) + '</b><small>' + esc(t.how) + '</small></div><div class="acts">'
      + (t.h ? '<a class="go" href="' + t.h + '"' + (/^https/.test(t.h) ? ' target="_blank" rel="noopener"' : '') + '>' + (dn ? 'تدرّب' : 'ابدأ') + ' ←</a>' : '')
      + (id === 'lvl' && !dn ? '<button class="tick" data-skiplv>تخطَّ (اختياري)</button>' : '')
      + ((!t.key && id !== 'mb' && id !== 'lvl') || dn ? '<button class="tick" data-tk="' + id + '"' + (dn ? ' disabled' : '') + '>' + (dn ? '✓ أُنجزت' : 'أنجزتها ✓') + '</button>' : '') + '</div></li>'; }).join('')
    + '</ol>' + (!left && tasks.length ? '<div class="yay">🌟 أحسنت! بيتك ارتفع اليوم. نلتقي غداً.</div>' : '') + '</div></section>';

  // 2) the three stages as a stepper; tap a stage to see its stations
  var lnW = Math.round(Math.min(cur, N - 1) / (N - 1) * 66.8);
  h += '<section class="card"><h2>🧱 مراحل البناء</h2><div class="steps3"><span class="ln"></span><span class="ln2" style="width:' + lnW + '%"></span>'
    + plan.stages.map(function(s, i){ var c = CK[s.k], st = i < cur ? 'fin' : i === cur ? 'cur' : 'later';
      return '<button class="sn ' + st + (i === openSt ? ' sel' : '') + '" data-os="' + i + '"><span class="c">' + (i < cur ? '✅' : c.ic) + '</span><b>' + c.ar + '</b><small>' + (i < cur ? 'اكتملت' : i === cur ? '🚧 تبنيها الآن' : 'المرحلة ' + (i + 1)) + '</small></button>'; }).join('')
    + '</div>';
  var os = plan.stages[openSt], oc = CK[os.k], oCur = openSt === cur;
  h += '<div class="sdet"><h3>' + oc.ic + ' المرحلة ' + (openSt + 1) + ': ' + oc.ar + ' <span class="en" style="font-size:.9rem;color:#64748b">' + oc.en + '</span></h3><p class="why">' + oc.why + '</p><div class="stns">'
    + stageIds(plan, openSt).map(function(id){ var t = T[id], p = prog(plan, id), dn = p >= 1; return '<div class="stn' + (dn ? ' done' : '') + '"><span class="i">' + t.ic + '</span><div class="tx"><b>' + nm(t) + '</b><small>' + esc(t.how) + '</small>'
      + (t.key || id === 'lvl' ? '<div class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></div>' : '') + '</div><div class="acts">'
      + (t.h ? '<a class="go" href="' + t.h + '"' + (/^https/.test(t.h) ? ' target="_blank" rel="noopener"' : '') + '>' + (dn ? 'تدرّب' : 'ابدأ') + ' ←</a>' : '')
      + (id !== 'lvl' ? '<button class="tick" data-st="' + id + '"' + (dn ? ' disabled' : '') + '>' + (dn ? '✓ أنجزتها' : 'أنجزتها ✓') + '</button>' : '') + '</div></div>'; }).join('')
    + '</div>' + (oCur ? '<div class="next"><button class="btn ghost" id="skip">أتقنت هذا الجزء؟ انتقل للمرحلة التالية</button></div>' : '') + '</div>'
    + '<p class="endl">🏁 بعد المراحل الثلاث: اختبر مستواك، وصمّم مخططاً أعلى.</p></section>';

  // 3) the house — the big picture
  h += '<section class="card"><div class="bphd"><h2>🏗️ مخطط بيتي</h2><span class="bpno">المخطط ' + ((plan.redrawn || 0) + 1) + '</span></div>'
    + '<p class="lead">كل جزء ممتلئ بقدر إتقانك، ويرتفع كلما أنجزت محطاته.</p>' + bpHouse(plan)
    + '<div class="legend"><span>🚧 تبنيه الآن</span><span>✅ اكتمل</span><span>⬜ الفراغ = ما بقي لك</span></div></section>';

  h += '<div class="tools"><button class="btn" data-new>📐 مخطط جديد</button><a class="btn soft" href="#intro">✏️ عدّل إجاباتي</a><a class="btn ghost" href="../index.html#sections">🗂️ كل أقسام النادي</a></div>'
    + '<p class="foot">مخططك محفوظ في حسابك، وتراه في أي جهاز تدخل منه برمزك.<br>إعداد: <b>أ. أحمد بن سالم</b></p>';
  app.innerHTML = h;
  if (fresh) { fresh = 0; fireworks(); }
  app.querySelectorAll('[data-os]').forEach(function(b){ b.onclick = function(){ openSt = +b.dataset.os; var y = window.scrollY; vMap(); window.scrollTo(0, y); }; });

  app.querySelectorAll('[data-skiplv]').forEach(function(b){ b.onclick = function(){ plan.skipTest = 1; S('my-path', plan); vMap(); }; });
  app.querySelectorAll('[data-tk]').forEach(function(b){ b.onclick = function(){ var s = dayState(); s.ok[b.dataset.tk] = 1; S('mp-day', s); sfx(1); vMap(); }; });
  app.querySelectorAll('[data-st]').forEach(function(b){ b.onclick = function(){
    var t = T[b.dataset.st];
    if (t.key && prog(plan, t.id) < .5 && !confirm('هل أنهيت فعلاً «' + t.n + '»؟ تقدّمك فيها يُحسب تلقائياً من تدريبك.')) return;
    var before = plan.stage; plan.done[b.dataset.st] = 1; S('my-path', plan); sfx(1);
    var s = dayState(); s.ok[b.dataset.st] = 1; S('mp-day', s);
    vMap(); if (stageDone(plan, before)) { fireworks(); toast('🎉 أنهيت المرحلة ' + (before + 1) + '! انطلق للمرحلة التالية'); } }; });
  // A brand-new map from scratch (empty answers); the old one is replaced only when the new one is drawn, and the 🔥 days stay.
  app.querySelectorAll('[data-new]').forEach(function(b){ b.onclick = function(){
    if (!confirm('سترسم مخططاً جديداً من البداية بإجابات جديدة، ويحلّ محل مخططك الحالي حين تنتهي منه. أيام إنجازك 🔥 تبقى محفوظة. هل تريد البدء؟')) return;
    A = { goal: null, lvl: null, r: {}, time: null, redrawn: (plan.redrawn || 0) + 1 }; step = 0; location.hash = '#q'; }; });
  var sk = document.getElementById('skip');
  if (sk) sk.onclick = function(){ if (!confirm('ستنتقل إلى المرحلة التالية، وتبقى محطات هذه المرحلة مفتوحة لك. هل أنت متأكد؟')) return;
    stageIds(plan, plan.stage).forEach(function(id){ if (id !== 'lvl') plan.done[id] = 1; }); S('my-path', plan); fireworks(); vMap(); window.scrollTo(0, 0); };
  app.querySelectorAll('[data-ci]').forEach(function(b){ b.onclick = function(){
    var k = b.dataset.k, v = +b.dataset.ci;
    plan.ci = Math.floor((Date.now() - plan.at) / 864e5 / 14); plan.r[k] = v; S('my-path', plan);
    if (v === 2 && plan.stage < plan.stages.length && plan.stages[plan.stage].k === k) { stageIds(plan, plan.stage).forEach(function(id){ if (id !== 'lvl') plan.done[id] = 1; }); S('my-path', plan); fireworks(); toast('💪 رائع! انتقلت للمرحلة التالية'); }
    else toast(v === 0 ? 'لا بأس، الاستمرار هو السر. واصل مهمتك اليومية' : 'تقدّم جميل! واصل');
    vMap(); }; });
}

function vRoute(){
  var hs = location.hash, has = !!J('my-path', null);
  if (hs === '#q') vWizard();
  else if (hs === '#intro' || !has) vIntro();
  else vMap();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', vRoute);
window.addEventListener('pageshow', function(e){ if (e.persisted) vRoute(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden && location.hash !== '#q') load().then(vRoute); });

/* ================= fireworks ================= */
function fireworks(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('fx'), x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, ps = [], cols = ['#3157d5','#11826a','#f2b53a','#e8607a','#8a6cf0'];
  for (var b = 0; b < 4; b++) { var cx = W * (.2 + .6 * Math.random()), cy = H * (.2 + .3 * Math.random()); for (var i = 0; i < 40; i++) { var a = Math.random() * 6.28, s = 2 + Math.random() * 4; ps.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 60 + Math.random() * 30, c: cols[(b + i) % 5] }); } }
  (function f(){ x.clearRect(0, 0, W, H); ps = ps.filter(function(p){ return p.l-- > 0; }); ps.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += .06; x.globalAlpha = Math.min(1, p.l / 30); x.fillStyle = p.c; x.fillRect(p.x, p.y, 4, 4); }); if (ps.length) requestAnimationFrame(f); else x.clearRect(0, 0, W, H); })();
}

/* ================= start ================= */
function load(){
  return import('../assets/honor.js?v=20261118c').then(function(H){
    PC.setParts(H.computeScore().parts || {});
    var p = J('my-path', null);
    if (p && (!p.base || !Object.keys(p.base).length)) { p.base = snap(); S('my-path', p); }   // map drawn before the points loaded
  }).catch(function(){});
}
vRoute();
load().then(function(){ if (location.hash !== '#q') vRoute(); });
})();
</script>
