:root{
  --bg:#F2FAF8;
  --surface:#FFFFFF;
  --surface-2:#E2F3EF;
  --ink:#221C35;
  --ink-soft:#6a6280;
  --accent:#0F7C6E;
  --accent-2:#0B5E54;
  --accent-ink:#FFFFFF;
  --good:#178A70;
  --good-bg:#E3F5EF;
  --bad:#D14432;
  --bad-bg:#FBE7E3;
  --gold:#C4860F;
  --border:#D3EAE4;
  --shadow: 0 10px 30px -12px rgba(34,28,53,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111F;
    --surface:#1E1930;
    --surface-2:#28213D;
    --ink:#F4EFFB;
    --ink-soft:#B3A9CC;
    --accent:#B481D6;
    --accent-2:#9A63C4;
    --accent-ink:#1A1226;
    --good:#4FD3AE;
    --good-bg:#183B34;
    --bad:#FF8A76;
    --bad-bg:#3E211D;
    --gold:#F0C15C;
    --border:#362C4D;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.5);
  }

:root[data-theme="dark"]{
  --bg:#15111F;
  --surface:#1E1930;
  --surface-2:#28213D;
  --ink:#F4EFFB;
  --ink-soft:#B3A9CC;
  --accent:#B481D6;
  --accent-2:#9A63C4;
  --accent-ink:#1A1226;
  --good:#4FD3AE;
  --good-bg:#183B34;
  --bad:#FF8A76;
  --bad-bg:#3E211D;
  --gold:#F0C15C;
  --border:#362C4D;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.5);
}


*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(var(--border) 1px, transparent 1.4px) 0 0/22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:'Cairo',system-ui,sans-serif;
  padding-inline:18px;
  padding-block:22px;
  min-height:100dvh;
}
h1,h2,h3{ text-wrap:balance; margin:0; }
.wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-badge{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  color:var(--accent-ink); font-weight:900; font-size:19px;
  box-shadow:var(--shadow);
  flex:none;
}
.brand h1{ font-size:19px; font-weight:800; }
.brand p{ margin:0; font-size:12px; color:var(--ink-soft); font-weight:600; }

.iconbtn{
  border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft);
  width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  cursor:pointer; font-size:16px; flex:none;
}
.iconbtn:hover{ color:var(--ink); border-color:var(--accent); }

/* ---------- cards ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  box-shadow:var(--shadow); padding:20px;
}

/* ---------- start screen ---------- */
.hero-line{ display:flex; align-items:center; gap:8px; color:var(--accent); font-weight:800; font-size:12.5px; letter-spacing:.04em; }
.hero-line .dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); }
.start-title{ font-size:26px; font-weight:900; margin-top:6px; line-height:1.35; }
.start-sub{ color:var(--ink-soft); font-size:14px; margin-top:6px; font-weight:600; }

.section-label{ font-size:12.5px; font-weight:800; color:var(--ink-soft); letter-spacing:.03em; margin-bottom:8px; }

.unit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.unit-chip{
  text-align:start; border:1.6px solid var(--border); background:var(--surface-2);
  border-radius:14px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
}
.unit-chip .en{ font-family:'Poppins',sans-serif; font-size:10.5px; color:var(--ink-soft); font-weight:600; direction:ltr; text-align:start; }
.unit-chip .ar{ font-size:14.5px; font-weight:800; }
.unit-chip .count{ font-size:10.5px; color:var(--ink-soft); font-weight:700; margin-top:2px; }
.unit-chip.active{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.unit-chip.all{ grid-column:1 / -1; }

.len-row{ display:flex; gap:8px; }
.len-btn{
  flex:1; border:1.6px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:12px; padding:9px 0; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit;
}
.len-btn.active{ border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }

.start-btn{
  width:100%; border:none; border-radius:15px; padding:15px 0; margin-top:4px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2)); color:var(--accent-ink);
  font-family:inherit; font-weight:900; font-size:16.5px; cursor:pointer;
  box-shadow:0 10px 22px -8px color-mix(in srgb, var(--accent) 60%, transparent);
}
.start-btn:active{ transform:translateY(1px); }

.legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:2px; }
.legend span{ font-size:11.5px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:5px; }
.legend b{ color:var(--ink); }

/* ---------- game hud ---------- */
.hud{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.hearts{ display:flex; gap:4px; font-size:18px; letter-spacing:1px; }
.heart.lost{ opacity:.25; filter:grayscale(1); }
.hud-mid{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
.progress-track{ width:100%; height:7px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:5px; transition:width .35s ease; }
.progress-text{ font-size:11px; color:var(--ink-soft); font-weight:700; }
.score-pill{
  background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:6px 11px;
  font-weight:900; font-size:14px; display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.score-pill .star{ color:var(--gold); }

/* ---------- question card ---------- */
.timer-track{ height:5px; border-radius:4px; background:var(--surface-2); overflow:hidden; margin-bottom:16px; }
.timer-fill{ height:100%; background:var(--good); border-radius:4px; transition:width 1s linear, background .3s; }
.timer-fill.warn{ background:var(--gold); }
.timer-fill.danger{ background:var(--bad); }

.direction-tag{
  display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); color:var(--ink-soft);
  font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px; margin-bottom:14px;
}

.prompt-box{
  text-align:center; padding:26px 10px 30px; border-radius:16px;
  background:var(--surface-2);
  margin-bottom:18px;
}
.prompt-box .unit-tag{ font-size:11px; font-weight:800; color:var(--accent); letter-spacing:.03em; }
.prompt-word{
  margin-top:8px; font-weight:900; line-height:1.3;
}
.prompt-word.en{ font-family:'Poppins',sans-serif; font-size:clamp(24px,7vw,32px); direction:ltr; }
.prompt-word.ar{ font-size:clamp(21px,6.4vw,28px); }

.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.choice{
  border:1.8px solid var(--border); background:var(--surface); border-radius:14px;
  padding:14px 10px; cursor:pointer; font-family:inherit; font-weight:700; font-size:14.5px;
  text-align:center; color:var(--ink); transition:transform .12s ease, border-color .15s, background .15s;
  min-height:58px; display:flex; align-items:center; justify-content:center; line-height:1.35;
}
.choice.en{ font-family:'Poppins',sans-serif; direction:ltr; font-size:13.5px; }
.choice:active{ transform:scale(.97); }
.choice.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
.choice.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); animation:shake .35s; }
.choice.dim{ opacity:.45; }
.choice[disabled]{ cursor:default; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

.feedback-row{ min-height:26px; text-align:center; margin-top:14px; font-weight:800; font-size:13.5px; }
.feedback-row.good{ color:var(--good); }
.feedback-row.bad{ color:var(--bad); }
.feedback-row.neutral{ color:var(--ink-soft); }
.choice.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); }

.test-name-input{
  width:100%; border:1.6px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:12px; padding:10px 12px; font-family:inherit; font-size:14px; margin-top:10px;
}
.test-name-input::placeholder{ color:var(--ink-soft); }

.test-result-card{
  text-align:center; border:2px dashed var(--accent); background:var(--surface-2);
}
.test-result-label{ font-size:13px; font-weight:800; color:var(--accent); letter-spacing:.02em; }
.test-result-name{ font-size:20px; font-weight:900; margin-top:8px; }
.test-result-score{ font-size:42px; font-weight:900; margin-top:10px; color:var(--accent); }
.test-result-pct{ font-size:15px; color:var(--ink-soft); font-weight:700; margin-top:4px; }
.test-result-date{ font-size:11px; color:var(--ink-soft); margin-top:10px; }
.test-result-hint{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:10px; }

.level-meter{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
.level-dot{ flex:1; height:8px; border-radius:5px; background:var(--surface); }
.level-dot.reached{ background:linear-gradient(160deg,var(--accent),var(--accent-2)); }
.level-name{ font-size:24px; font-weight:900; margin-top:14px; }
.level-name-en{ font-family:'Poppins',sans-serif; font-size:13px; color:var(--ink-soft); font-weight:700; direction:ltr; margin-top:2px; }
.level-desc{ font-size:13.5px; color:var(--ink-soft); font-weight:600; margin-top:10px; line-height:1.5; }

/* ---------- end screen ---------- */
.result-badge{
  width:74px;height:74px;border-radius:50%; margin:4px auto 4px;
  background:linear-gradient(160deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center; font-size:32px; color:var(--accent-ink);
  box-shadow:var(--shadow);
}
.result-title{ text-align:center; font-size:20px; font-weight:900; margin-top:6px; }
.result-sub{ text-align:center; color:var(--ink-soft); font-size:13.5px; font-weight:700; margin-top:4px; }
.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px; }
.stat{ background:var(--surface-2); border-radius:13px; padding:12px 6px; text-align:center; }
.stat b{ display:block; font-size:20px; font-weight:900; }
.stat span{ font-size:10.5px; color:var(--ink-soft); font-weight:700; }

.review-list{ margin-top:18px; display:flex; flex-direction:column; gap:7px; }
.review-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--bad-bg); border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);
  border-radius:11px; padding:9px 12px; font-size:13px; font-weight:700;
}
.review-item .en{ font-family:'Poppins',sans-serif; direction:ltr; color:var(--bad); }
.review-item .ar{ color:var(--ink); }

.action-row{ display:flex; gap:10px; margin-top:20px; }
.action-row .start-btn{ margin-top:0; }
.ghost-btn{
  flex:1; border:1.6px solid var(--border); background:transparent; color:var(--ink);
  border-radius:15px; font-family:inherit; font-weight:800; font-size:14.5px; cursor:pointer;
}

[hidden]{ display:none !important; }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important; }
}

function allWordsFromSelection(){
  let list = [];
  if (state.selectedUnits.has('ALL')) {
    UNITS.forEach(u => u.words.forEach(w => list.push({en:w[0], ar:w[1], unit:u.ar})));
  } else {
    UNITS.filter(u => state.selectedUnits.has(u.id)).forEach(u => u.words.forEach(w => list.push({en:w[0], ar:w[1], unit:u.ar})));
  }
  return list;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRound(){
  const fullSource = allWordsFromSelection();
  const source = state.retryQueue && state.retryQueue.length ? state.retryQueue : fullSource;
  const distractSource = fullSource.length >= 4 ? fullSource : source;
  const n = state.retryQueue ? source.length : Math.min(state.roundLen, source.length);
  const chosen = shuffle(source).slice(0, n);
  state.pool = chosen.map(item => {
    const dir = Math.random() < 0.5 ? 'en2ar' : 'ar2en';
    const correct = dir === 'en2ar' ? item.ar : item.en;
    let distractPool = distractSource.filter(x => x !== item).map(x => dir === 'en2ar' ? x.ar : x.en);
    distractPool = [...new Set(distractPool)].filter(x => x !== correct);
    const distractors = shuffle(distractPool).slice(0, 3);
    const choices = shuffle([correct, ...distractors]);
    return { item, dir, correct, choices };
  });
}

/* ================= SPEECH ================= */
function speak(text, lang){
  try {
    if (!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

/* ================= SOUND EFFECTS ================= */
let audioCtx = null;
function getAudioCtx(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch(e) { return null; }
}
function playTone(freqStart, freqEnd, duration, volume){
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    const t0 = ctx.currentTime;
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + duration + 0.02);
  } catch(e) {}
}
function playCorrectSound(){ playTone(520, 830, 0.18, 0.08); }
function playWrongSound(){ playTone(340, 190, 0.24, 0.06); }
function playClickSound(){ playTone(600, 700, 0.06, 0.045); }

function startTimer(){
  stopTimer();
  state.timeLeft = TIME_PER_Q;
  state.locked = false;
  const fillEl = document.getElementById('timerFill');
  if (!fillEl) return;
  fillEl.style.transition = 'none';
  fillEl.style.width = '100%';
  fillEl.className = 'timer-fill';
  void fillEl.offsetWidth;
  fillEl.style.transition = 'width 1s linear, background .3s';

  state.timer = setInterval(() => {
    state.timeLeft -= 1;
    const pct = Math.max(0, (state.timeLeft / TIME_PER_Q) * 100);
    if (fillEl) {
      fillEl.style.width = pct + '%';
      fillEl.className = 'timer-fill' + (pct < 25 ? ' danger' : pct < 55 ? ' warn' : '');
    }
    if (state.timeLeft <= 0) {
      stopTimer();
      timeExpired();
    }
  }, 1000);
}
function stopTimer(){ if (state.timer) { clearInterval(state.timer); state.timer = null; } }

function timeExpired(){
  if (state.locked) return;
  state.locked = true;
  const q = state.pool[state.qIndex];
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => {
    b.disabled = true;
    if (state.testMode) { b.classList.add('dim'); }
    else if (b.textContent === q.correct) b.classList.add('correct'); else b.classList.add('dim');
  });
  registerWrong(q);
  const fb = document.querySelector('.feedback-row');
  if (state.testMode) {
    playClickSound();
    if (fb) { fb.textContent = '⏰ انتهى الوقت لهذا السؤال'; fb.className = 'feedback-row neutral'; }
  } else {
    playWrongSound();
    if (fb) { fb.textContent = '⏰ انتهى الوقت!'; fb.className = 'feedback-row bad'; }
  }
  advanceSoon();
}

function handleAnswer(choice, btnEl, choicesEl){
  if (state.locked) return;
  state.locked = true;
  stopTimer();
  const q = state.pool[state.qIndex];
  const buttons = choicesEl.querySelectorAll('.choice');
  const fb = document.querySelector('.feedback-row');
  const isCorrect = choice === q.correct;

  buttons.forEach(b => {
    b.disabled = true;
    if (state.testMode) {
      if (b === btnEl) b.classList.add('selected'); else b.classList.add('dim');
    } else if (b.textContent === q.correct) b.classList.add('correct');
    else if (b === btnEl && !isCorrect) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  if (isCorrect) {
    try { const _k='mg3-known', _s=new Set(JSON.parse(localStorage.getItem(_k)||'[]')); _s.add(String(q.item.en)); localStorage.setItem(_k, JSON.stringify([..._s])); } catch(e) {}
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const bonus = Math.min(state.streak - 1, 5) * 2;
    state.score += 10 + bonus;
    if (state.testMode) {
      playClickSound();
      if (fb) { fb.textContent = '✔️ تم تسجيل إجابتك'; fb.className = 'feedback-row neutral'; }
    } else {
      if (fb) { fb.textContent = state.streak > 1 ? `🔥 صحيح! سلسلة من ${state.streak}` : '✅ إجابة صحيحة!'; fb.className = 'feedback-row good'; }
      burst(btnEl);
      playCorrectSound();
      if (q.dir === 'ar2en') speak(q.correct, 'en-US');
    }
  } else {
    registerWrong(q);
    if (state.testMode) {
      playClickSound();
      if (fb) { fb.textContent = '✔️ تم تسجيل إجابتك'; fb.className = 'feedback-row neutral'; }
    } else {
      playWrongSound();
      if (fb) { fb.textContent = `❌ خطأ، الصحيح: ${q.correct}`; fb.className = 'feedback-row bad'; }
    }
  }
  advanceSoon();
}

function registerWrong(q){
  state.streak = 0;
  state.wrongList.push({ en: q.item.en, ar: q.item.ar });
  if (!state.practiceMode) {
    state.lives -= 1;
    const hearts = document.querySelectorAll('.heart');
    if (hearts.length) hearts[state.lives]?.classList.add('lost');
  }
}

function advanceSoon(){
  setTimeout(() => {
    if (!state.practiceMode && state.lives <= 0) { state.screen = 'gameover'; render(); return; }
    state.qIndex += 1;
    if (state.qIndex >= state.pool.length) { state.screen = 'result'; render(); }
    else render();
  }, state.testMode ? 650 : 1300);
}

function burst(originEl){
  try {
    const rect = originEl.getBoundingClientRect();
    const colors = ['#7B3FA0','#178A70','#C4860F','#D14432'];
    for (let i=0;i<10;i++){
      const p = document.createElement('div');
      const size = 5 + Math.random()*4;
      p.style.cssText = `position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;width:${size}px;height:${size}px;border-radius:50%;background:${colors[i%colors.length]};pointer-events:none;z-index:999;`;
      document.body.appendChild(p);
      const ang = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*50;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      p.animate([
        { transform:'translate(0,0)', opacity:1 },
        { transform:`translate(${dx}px,${dy}px)`, opacity:0 }
      ], { duration:600+Math.random()*300, easing:'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
    }
  } catch(e) {}
}

/* ---------- result screen ---------- */
function renderResult(){
  const frag = document.createDocumentFragment();
  frag.appendChild(topbar(false));

  const total = state.pool.length;
  const correctCount = total - state.wrongList.length;
  const pct = Math.round((correctCount/total)*100);

  if (state.testMode) {
    const testCard = el('div','card test-result-card');
    const typeLabel = state.testType === 'pre' ? '📝 اختبار قبلي (Pre-Test)' : '📝 اختبار بعدي (Post-Test)';
    testCard.appendChild(el('div','test-result-label', typeLabel));
    if (state.studentName && state.studentName.trim()) {
      testCard.appendChild(el('div','test-result-name', state.studentName.trim()));
    }
    testCard.appendChild(el('div','test-result-score', `${correctCount} / ${total}`));
    testCard.appendChild(el('div','test-result-pct', `${pct}% نسبة الإجابات الصحيحة`));
    const dateStr = new Date().toLocaleDateString('ar-SA');
    testCard.appendChild(el('div','test-result-date', dateStr));
    testCard.appendChild(el('div','test-result-hint','📸 التقط صورة شاشة لهذه النتيجة وأرسلها لمعلمك'));
    frag.appendChild(testCard);
  }

  const card = el('div','card');
  card.appendChild(el('div','result-badge', pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'));
  card.appendChild(el('div','result-title', pct >= 80 ? 'أداء رائع!' : pct >= 50 ? 'أداء جيد!' : 'استمر بالمحاولة!'));
  card.appendChild(el('div','result-sub', `أجبت بشكل صحيح على ${correctCount} من ${total} سؤال`));

  const stats = el('div','stat-row');
  const s1 = el('div','stat'); s1.appendChild(el('b',null,state.score)); s1.appendChild(el('span',null,'النقاط')); stats.appendChild(s1);
  const s2 = el('div','stat'); s2.appendChild(el('b',null,pct+'%')); s2.appendChild(el('span',null,'الدقة')); stats.appendChild(s2);
  const s3 = el('div','stat'); s3.appendChild(el('b',null,state.bestStreak)); s3.appendChild(el('span',null,'أفضل سلسلة')); stats.appendChild(s3);
  card.appendChild(stats);

  if (state.wrongList.length){
    card.appendChild((() => { const l = el('div','section-label','كلمات للمراجعة'); l.style.marginTop='20px'; return l; })());
    const list = el('div','review-list');
    state.wrongList.forEach(w => {
      const item = el('div','review-item');
      const en = el('span','en'); en.dir='ltr'; en.textContent = w.en;
      item.appendChild(en);
      item.appendChild(el('span','ar', w.ar));
      list.appendChild(item);
    });
    card.appendChild(list);
  }

  if (state.wrongList.length){
    const retryBtn = el('button','ghost-btn','🎯 راجع أخطائي فقط (' + state.wrongList.length + ')');
    retryBtn.style.width = '100%';
    retryBtn.style.marginTop = '10px';
    retryBtn.onclick = () => {
      state.retryQueue = state.wrongList.map(w => ({ en:w.en, ar:w.ar, unit:'مراجعة' }));
      startGame();
    };
    card.appendChild(retryBtn);
  }

  const actions = el('div','action-row');
  const again = el('button','start-btn','العب مرة أخرى 🔁');
  again.style.flex = '1';
  again.onclick = () => { state.retryQueue = null; startGame(); };
  const change = el('button','ghost-btn','تغيير الوحدة');
  change.onclick = () => { state.retryQueue = null; state.screen = 'start'; render(); };
  actions.appendChild(again);
  actions.appendChild(change);
  card.appendChild(actions);

  frag.appendChild(card);
  return frag;
}

function renderGameOver(){
  const frag = document.createDocumentFragment();
  frag.appendChild(topbar(false));

  const card = el('div','card');
  card.appendChild(el('div','result-badge', '💔'));
  card.appendChild(el('div','result-title', 'انتهت محاولاتك!'));
  card.appendChild(el('div','result-sub', `وصلت للسؤال ${state.qIndex + 1} برصيد ${state.score} نقطة`));

  if (state.wrongList.length){
    card.appendChild((() => { const l = el('div','section-label','الكلمات التي أخطأت بها'); l.style.marginTop='20px'; return l; })());
    const list = el('div','review-list');
    state.wrongList.forEach(w => {
      const item = el('div','review-item');
      const en = el('span','en'); en.dir='ltr'; en.textContent = w.en;
      item.appendChild(en);
      item.appendChild(el('span','ar', w.ar));
      list.appendChild(item);
    });
    card.appendChild(list);
  }

  if (state.wrongList.length){
    const retryBtn = el('button','ghost-btn','🎯 راجع أخطائي فقط (' + state.wrongList.length + ')');
    retryBtn.style.width = '100%';
    retryBtn.style.marginTop = '10px';
    retryBtn.onclick = () => {
      state.retryQueue = state.wrongList.map(w => ({ en:w.en, ar:w.ar, unit:'مراجعة' }));
      startGame();

  }

  const change = el('button','ghost-btn','تغيير الوحدة');
  change.onclick = () => { state.retryQueue = null; state.screen = 'start'; render(); };

/* ---------- placement (level) test screen ---------- */
function renderPlacementQuiz(){
  const frag = document.createDocumentFragment();
  frag.appendChild(topbar(true));

  const hud = el('div','card');
  const hudRow = el('div','hud');
  hudRow.appendChild(el('div',null,'🎯'));
  const mid = el('div','hud-mid');
  const track = el('div','progress-track');
  const fill = el('div','progress-fill');
  fill.style.width = Math.round((state.placementIndex / state.placementTotal) * 100) + '%';
  track.appendChild(fill);
  mid.appendChild(track);
  mid.appendChild(el('div','progress-text', `سؤال ${state.placementIndex + 1} من ${state.placementTotal}`));
  hudRow.appendChild(mid);
  hudRow.appendChild(el('div',null,''));
  hud.appendChild(hudRow);
  frag.appendChild(hud);

  const qCard = el('div','card');
  const timerTrack = el('div','timer-track');
  const timerFill = el('div','timer-fill');
  timerFill.id = 'timerFill';
  timerFill.style.width = '100%';
  timerTrack.appendChild(timerFill);
  qCard.appendChild(timerTrack);

  const q = state.currentPlacementQ;
  qCard.appendChild(el('div','direction-tag', catLabel(q.type)));

  const promptBox = el('div','prompt-box');
  const promptWord = el('div','prompt-word en');
  promptWord.dir = 'ltr';
  promptWord.style.fontSize = 'clamp(17px,4.6vw,21px)';
  promptWord.style.lineHeight = '1.5';
  promptWord.textContent = q.q;
  promptBox.appendChild(promptWord);
  qCard.appendChild(promptBox);

  const choicesEl = el('div','choices');
  q.choices.forEach(choice => {
    const btn = el('button','choice en', choice);
    btn.type = 'button';
    btn.dir = 'ltr';
    btn.onclick = () => handlePlacementAnswer(choice, btn, choicesEl);
    choicesEl.appendChild(btn);
  });
  qCard.appendChild(choicesEl);

  qCard.appendChild(el('div','feedback-row', ''));
  frag.appendChild(qCard);

  setTimeout(() => { startPlacementTimer(); }, 0);
  return frag;
}

function startPlacementTimer(){
  stopPlacementTimer();
  state.pTimeLeft = TIME_PER_PLACEMENT_Q;
  state.pLocked = false;
  const fillEl = document.getElementById('timerFill');
  if (!fillEl) return;
  fillEl.style.transition = 'none';
  fillEl.style.width = '100%';
  fillEl.className = 'timer-fill';
  void fillEl.offsetWidth;
  fillEl.style.transition = 'width 1s linear, background .3s';

  state.pTimer = setInterval(() => {
    state.pTimeLeft -= 1;
    const pct = Math.max(0, (state.pTimeLeft / TIME_PER_PLACEMENT_Q) * 100);
    if (fillEl) {
      fillEl.style.width = pct + '%';
      fillEl.className = 'timer-fill' + (pct < 25 ? ' danger' : pct < 55 ? ' warn' : '');
    }
    if (state.pTimeLeft <= 0) {
      stopPlacementTimer();
      placementTimeExpired();
    }
  }, 1000);
}
function stopPlacementTimer(){ if (state.pTimer) { clearInterval(state.pTimer); state.pTimer = null; } }

function placementTimeExpired(){
  if (state.pLocked) return;
  state.pLocked = true;
  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => { b.disabled = true; b.classList.add('dim'); });
  playClickSound();
  const fb = document.querySelector('.feedback-row');
  if (fb) { fb.textContent = '⏰ انتهى الوقت، لا بأس، إلى السؤال التالي!'; fb.className = 'feedback-row neutral'; }
  registerPlacementAnswer(false);
  advancePlacementSoon();
}

function handlePlacementAnswer(choice, btnEl, choicesEl){
  if (state.pLocked) return;
  state.pLocked = true;
  stopPlacementTimer();
  const q = state.currentPlacementQ;
  const buttons = choicesEl.querySelectorAll('.choice');
  const fb = document.querySelector('.feedback-row');
  const isCorrect = choice === q.correct;

  buttons.forEach(b => {
    b.disabled = true;
    if (b === btnEl) b.classList.add('selected'); else b.classList.add('dim');
  });

  playClickSound();
  if (fb) { fb.textContent = '✔️ تم تسجيل إجابتك'; fb.className = 'feedback-row neutral'; }
  registerPlacementAnswer(isCorrect);
  advancePlacementSoon();
}

function registerPlacementAnswer(isCorrect){
  if (isCorrect) {
    state.placementScore += 1;
    state.currentLevel = Math.min(6, state.currentLevel + 1);
  } else {
    state.currentLevel = Math.max(1, state.currentLevel - 1);
  }
}

function advancePlacementSoon(){
  setTimeout(() => {
    state.placementIndex += 1;
    if (state.placementIndex >= state.placementTotal) {
      state.screen = 'placementResult';
      render();
    } else {
      buildPlacementQuestion();
      render();
    }
  }, 650);
}

function computeFinalLevel(){
  const recent = state.levelHistory.slice(-8);
  const avg = recent.reduce((a,b)=>a+b,0) / recent.length;
  return Math.min(6, Math.max(1, Math.round(avg)));
}

/* ---------- placement result screen ---------- */
function renderPlacementResult(){
  const frag = document.createDocumentFragment();
  frag.appendChild(topbar(false));

  const finalLevel = computeFinalLevel();
  const levelInfo = LEVELS.find(l => l.n === finalLevel);

  const card = el('div','card test-result-card');
  card.appendChild(el('div','test-result-label','🎯 نتيجة اختبار تحديد المستوى'));
  if (state.studentName && state.studentName.trim()) {
    card.appendChild(el('div','test-result-name', state.studentName.trim()));
  }
  card.appendChild(el('div','level-name', levelInfo.ar));
  card.appendChild(el('div','level-name-en', levelInfo.en));

  const meter = el('div','level-meter');
  for (let i=1;i<=6;i++){
    meter.appendChild(el('div','level-dot' + (i<=finalLevel ? ' reached' : '')));
  }
  card.appendChild(meter);

  card.appendChild(el('div','level-desc', levelInfo.desc));
  const dateStr = new Date().toLocaleDateString('ar-SA');
  card.appendChild(el('div','test-result-date', dateStr));
  card.appendChild(el('div','test-result-hint','📸 التقط صورة شاشة واحتفظ بها لمقارنة تقدمك في المرة القادمة'));

  const actions = el('div','action-row');
  const again = el('button','start-btn','أعد الاختبار 🔁');
  again.style.flex = '1';
  again.onclick = () => { startPlacementTest(); };
  const change = el('button','ghost-btn','رجوع للقائمة');
  change.onclick = () => { state.screen = 'start'; render(); };
  actions.appendChild(again);
  actions.appendChild(change);
  card.appendChild(actions);

  frag.appendChild(card);
  return frag;
}

/* ================= GAME FLOW ================= */
function startGame(){
  stopTimer();
  buildRound();
  state.qIndex = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.lives = 3;
  state.wrongList = [];
  state.screen = 'quiz';
  render();
}

function startPlacementTest(){
  stopTimer();
  stopPlacementTimer();
  state.currentLevel = 3;
  state.levelHistory = [];
  state.usedPlacementIds = new Set();
  state.placementIndex = 0;
  state.placementTotal = 16;
  state.placementScore = 0;
  state.pLocked = false;
  buildPlacementQuestion();
  state.screen = 'placementQuiz';
  render();
}

function buildPlacementQuestion(){
  let pool = PLACEMENT_BANK.filter(q => q.level === state.currentLevel && !state.usedPlacementIds.has(q.id));
  let spread = 1;
  while (!pool.length && spread <= 5) {
    pool = PLACEMENT_BANK.filter(q => Math.abs(q.level - state.currentLevel) <= spread && !state.usedPlacementIds.has(q.id));
    spread += 1;
  }
  if (!pool.length) {
    state.usedPlacementIds.clear();
    pool = PLACEMENT_BANK.filter(q => q.level === state.currentLevel);
  }
  const picked = pool[Math.floor(Math.random() * pool.length)];
  state.usedPlacementIds.add(picked.id);
  state.currentPlacementQ = picked;
  state.levelHistory.push(picked.level);
}

/* ================= BOOT ================= */
function boot(data){
  render();
}
if (window.claude && window.claude.hot) {
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
} else {
  boot({});
}
})();
