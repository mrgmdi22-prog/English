<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-180.png?v=2"><meta name="apple-mobile-web-app-title" content="English Club"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<style>
/* Teacher moderation: pending nicknames first (approve / edit / delete), then the approved list. */
:root{color-scheme:light;--paper:#f8f9fe;--card:#fff;--ink:#232c47;--muted:#5a6482;--line:#e4e8f3;--gold:#b27a00;--ok:#16825d;--ok-soft:#e3f6ee;--bad:#b3261e;--bad-soft:#fdeceb;--wait-soft:#fff0dc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;font-size:19px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:64px 16px 60px}
h1{font-size:2rem;margin:0 0 4px;font-weight:800}
.note{color:var(--muted);margin:0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-top:18px}
.panel h2{margin:0 0 10px;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.count{background:var(--wait-soft);color:#a35a00;border-radius:999px;padding:0 12px;font-size:1rem}
.btn{font:inherit;font-weight:800;font-size:1rem;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;background:#6046e8;color:#fff}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad-soft);color:var(--bad)}.btn.soft{background:#eef0f6;color:var(--ink)}
.btn:disabled{opacity:.5}
.item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:140px;font-weight:800;font-size:1.15rem;overflow-wrap:anywhere}
.real{display:block;font-weight:500;font-size:.95rem;color:var(--muted)}
.real.miss{color:#a35a00}
.item .sc{color:var(--gold);font-weight:800;min-width:110px;font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.dup{display:block;margin-top:4px;font-weight:700;font-size:.98rem;color:#b25400;background:#fff1e0;border:1px solid #f5cf9f;border-radius:10px;padding:3px 10px}
.item:has(.dup){background:#fffaf2;border-inline-start:5px solid #f0a64a;padding-inline-start:10px;border-radius:8px}
.btn.dupb{background:#f0a64a;color:#fff}
.sortbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;font-weight:700}
.duphint{margin:4px 0 10px;background:#fff1e0;border:1px solid #f5cf9f;border-radius:14px;padding:10px 14px;font-size:1.02rem;line-height:1.7}
.empty{color:var(--muted);padding:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-weight:700;margin-top:10px}
.lvsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.lvsum div{background:#f3f5fc;border-radius:16px;padding:8px 12px}.lvsum b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}.lvsum small{color:var(--muted)}
.lvt{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px}
.lvt th,.lvt td{border-bottom:1px solid var(--line);padding:7px 5px;text-align:center;vertical-align:middle}
.lvt th:first-child,.lvt td:first-child{text-align:right}
.lvwrap{overflow-x:auto}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.btn.sm{font-size:.85rem;padding:5px 10px}
/* 📊 student activity */
.acTabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.acTabs .btn{font-size:1.05rem}.acTabs .btn.on{background:#6046e8;color:#fff}.acTabs .btn:not(.on){background:#eef0f6;color:var(--ink)}
.acTabs select{font:inherit;font-size:1.05rem;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink)}
.acSum{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 8px}.acSum div{background:#f4f2ff;border-radius:16px;padding:8px 14px;font-size:1.05rem}.acSum b{font-size:1.4rem;color:#4b33c9;margin-inline-end:6px}
.ac{border-bottom:1px solid var(--line);padding:10px 2px}.ac:last-child{border-bottom:0}
.ac .h{display:flex;justify-content:space-between;align-items:center;gap:10px}.ac .p{font-size:1.35rem;font-weight:800;color:#4b33c9;white-space:nowrap}
.ac .secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ac .secs span{background:#f6f7fb;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.98rem}
.ac .days{display:flex;gap:4px;margin-top:6px;direction:rtl}.ac .days i{flex:1;max-width:52px;text-align:center;font-style:normal;font-size:.8rem;color:var(--muted)}
.ac .days i b{display:block;border-radius:8px;padding:3px 0;font-size:.9rem;color:#4b33c9;background:#f1efff}.ac .days i b.z{background:#f6f7fb;color:#b8b5c8}
.ac .rp{margin-top:8px;font-size:.95rem;padding:6px 14px}
#rpBox{position:fixed;inset:0;z-index:2000;background:rgba(40,36,70,.35);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:12px}
#rpBox .sheet{background:#fff;border-radius:22px;max-width:640px;width:100%;padding:18px 16px 26px;margin:6px 0 40px;font-size:1.08rem;box-shadow:0 20px 50px -20px rgba(40,36,70,.5)}
#rpBox h2{margin:0 0 4px;font-size:1.45rem}#rpBox h3{margin:20px 0 8px;font-size:1.2rem;color:#4b33c9}
#rpBox .x{float:left;font:inherit;font-size:1.05rem;font-weight:800;border:0;background:#eef0f6;border-radius:999px;padding:7px 16px;cursor:pointer}
.rpSum{background:#f6f4ff;border:1.5px solid #e2dcff;border-radius:16px;padding:10px 14px;margin-top:10px}.rpSum li{margin:4px 0}
.bar2{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:8px;align-items:center;margin:6px 0}.bar2 .t{height:14px;border-radius:9px;background:#f0eef8;overflow:hidden}.bar2 .t i{display:block;height:100%;border-radius:9px;background:#9b8cf2}
.bar2 .t i.g{background:#5cc28a}.bar2 .t i.y{background:#f2c14e}.bar2 .t i.r{background:#ef8a80}.bar2 small{color:var(--muted)}
.rpT{width:100%;border-collapse:collapse}.rpT td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top}.rpT td:last-child{text-align:left;white-space:nowrap;font-weight:800}
.rpT small{display:block;color:var(--muted);font-weight:500}
.acIdle{margin-top:10px}.acIdle summary{cursor:pointer;font-weight:800;color:var(--muted);font-size:1.05rem}
</style>
</head>
<body>
<a class="club-home" href="honor.html">🏆 لوحة الشرف</a>
<div class="wrap">
  <div class="top"><div><h1>لوحة التحكم</h1><p class="note" id="who">للمعلم فقط</p></div><div id="authBox"></div></div>
  <div id="main"></div>
</div>
<script type="module">
import * as H from './assets/honor.js?v=20261112b';
const $ = id => document.getElementById(id);
const LV_NEW_AT = 1793547780000; // same as NEW_AT in level/index.html: start of the harder level-check version
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('en-US');
// When this student's points last reached the board — helps tell whether a device is still sending them.
const ago = t => { const ms = t && t.toMillis ? Date.now() - t.toMillis() : NaN; if (!(ms >= 0)) return '';
  const m = Math.round(ms / 60000); return 'آخر تحديث: ' + (m < 1 ? 'الآن' : m < 60 ? 'قبل ' + m + ' د' : m < 1440 ? 'قبل ' + Math.round(m / 60) + ' س' : 'قبل ' + Math.round(m / 1440) + ' يوم'); };

async function start() {
  if (!H.ready) { $('main').innerHTML = '<div class="panel"><h2>لم يُربط Firebase بعد</h2><p class="note">أضف إعدادات المشروع في الملف assets/firebase-config.js.</p></div>'; return; }
  const u = await H.teacherUser();
  if (!u) {
    $('authBox').innerHTML = '';
    $('main').innerHTML = '<div class="panel"><h2>تسجيل الدخول</h2><p class="note">ادخل بحساب Google الخاص بالمعلم لمراجعة الأسماء المستعارة والموافقة عليها.</p><p style="margin-top:14px"><button class="btn" id="si">الدخول بحساب Google</button></p><div class="err" id="er"></div></div>';
    $('si').onclick = async () => { const b = $('si'); if (b.disabled) return; b.disabled = true; $('er').textContent = '';
      try { await H.teacherSignIn(); start(); } catch (e) { b.disabled = false; $('er').textContent = 'تعذّر الدخول: ' + (e.code || e.message); } };
    return;
  }
  $('who').textContent = 'مسجّل باسم: ' + (u.email || '');
  try { localStorage.setItem('club-reg', 'teacher'); } catch (e) {}
  $('authBox').innerHTML = '<button class="btn soft" id="so">خروج</button>';
  $('so').onclick = async () => { await H.teacherSignOut(); start(); };
  $('main').innerHTML = '<div class="panel"><p class="note">جارٍ تحميل البيانات…</p></div>';
  try { await H.syncSuggested(); } catch (e) { console.warn('suggested nicknames not saved', e); }
  try { await load(); }
  catch (e) { console.error(e); $('main').innerHTML = '<div class="panel"><h2>تعذّر عرض اللوحة</h2><p class="err">' + esc(e && (e.code || e.message) || e) + '</p><p class="note">حدّث الصفحة، وإن تكرر الخطأ فأرسل صورة هذه الرسالة.</p></div>'; }
}

async function load() {
  let rows;
  try { rows = await H.allPlayers(); }
  catch (e) { $('main').innerHTML = '<div class="panel"><h2>لا توجد صلاحية</h2><p class="note">هذا الحساب ليس حساب المعلم المسجّل في إعدادات اللوحة.</p></div>'; return; }
  // Honour order: how many weeks the student was a star, then all-time points.
  const ST = H.stars(rows.filter(r => r.approved)), nS = id => ST.count[id] || 0, tot = r => r.total || r.score || 0;
  const sWeeks = id => ST.weeks.filter(w => w.top.some(x => x.id === id)).map(w => w.w === H.FOUND_WEEK ? 'التأسيسي' : H.weekLabel(w.w));
  rows.sort((a,b) => nS(b.id) - nS(a.id) || tot(b) - tot(a));
  let priv = {}; try { priv = await H.allPrivate(); } catch (e) { console.warn(e); }
  let codes = {}; try { codes = await H.allCodes(); } catch (e) { console.warn('recovery codes', e); }
  let lv = {}, lvCfg = {}, lvErr = ''; try { [lv, lvCfg] = await Promise.all([H.allLevels(), H.teacherLevelsConfig()]); } catch (e) { console.warn('levels', e); lvErr = (e && (e.code || e.message) || 'error') + ''; }
  // Sorting by the student's real name (default) puts duplicate accounts of the same student next to each other.
  const nkey = id => String((priv[id] || {}).name || '').replace(/[\u0640\u064B-\u065F]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
  const sortKey = r => nkey(r.id) || '\uffff' + H.cleanNick(r.nick);   // students without a real name go last
  let SORT = 'name'; try { SORT = sessionStorage.getItem('t-sort') || 'name'; } catch (e) {}
  const byName = (a, b) => sortKey(a).localeCompare(sortKey(b), 'ar') || tot(b) - tot(a);
  const dups = {}; rows.forEach(r => { const k = nkey(r.id); if (k) (dups[k] = dups[k] || []).push(r); });
  const twins = r => { const k = nkey(r.id); return k && dups[k].length > 1 ? dups[k].filter(x => x.id !== r.id) : []; };
  const nDup = Object.values(dups).filter(g => g.length > 1).length;
  const pend = rows.filter(r => !r.approved), ok = rows.filter(r => r.approved);
  if (SORT === 'name') { pend.sort(byName); ok.sort(byName); }
  const item = (r, pending) => `<div class="item" data-id="${r.id}"><span class="nm">${esc(r.nick)}${priv[r.id] ? `<small class="real">👤 ${esc(priv[r.id].name)} · ${priv[r.id].grade === H.EXTERNAL ? '🌐 من خارج المدرسة: ' + esc(priv[r.id].school || 'لم يذكر الجهة') : esc(priv[r.id].grade) + ' · الشعبة ' + esc(priv[r.id].section)}</small>` : '<small class="real miss">⚠️ لم يكتب بياناته الحقيقية بعد</small>'}${twins(r).length ? `<small class="dup">🔁 الاسم نفسه في حساب آخر: ${twins(r).map(t => `«${esc(t.nick)}» (${fmt(tot(t))} نقطة${t.approved ? '' : '، بانتظار الموافقة'})`).join('، ')}</small>` : ''}<small class="real">${esc(ago(r.updatedAt))}</small></span><span class="sc">${(r.week ?? H.FOUND_WEEK) === H.weekNo() ? fmt(r.score) : 0}<small class="real">هذا الأسبوع · المجموع ${fmt(tot(r))}${nS(r.id) ? ' · 🌟×' + nS(r.id) : ''}</small><small class="real">${ago(r.updatedAt)}</small>${codes[r.id] ? `<small class="real" dir="ltr" style="font-family:Lexend,monospace;letter-spacing:1px">🔑 ${esc(codes[r.id])}</small>` : ''}</span><span class="acts">
    ${pending ? '<button class="btn ok" data-a="ok">✓ موافقة</button>' : '<button class="btn soft" data-a="hide">إخفاء</button>'}
    <button class="btn soft" data-a="ren">تعديل الاسم</button><button class="btn soft" data-a="reg">📍 ${r.region ? esc(r.region) : "المنطقة"}</button>${twins(r).map(t => `<button class="btn dupb" data-a="mergeid" data-from="${t.id}">🔗 ضمّ «${esc(t.nick)}» إلى هذا</button>`).join('')}<button class="btn soft" data-a="merge">🔗 ضمّ حساب قديم</button><button class="btn bad" data-a="del">حذف</button></span></div>`;
  const nickOf = id => (rows.find(r => r.id === id) || {}).nick || '';
  const pc = r => r ? Math.round(r.score / r.max * 100) : null;
  const lvIds = Object.keys(lv).filter(id => lv[id].pre || lv[id].post).sort((a, b) => ((priv[a] || {}).name || nickOf(a)).localeCompare((priv[b] || {}).name || nickOf(b), 'ar'));
  const both = lvIds.filter(id => lv[id].pre && lv[id].post), avg = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : '—';
  const gain = id => pc(lv[id].post) - pc(lv[id].pre);
  const lvNew = r => !!r && +r.at >= LV_NEW_AT; // results before this date are from the old, easier test
  const levelPanel = `<div class="panel"><h2>📈 قياس المستوى</h2>
    <p class="note">نتائج الاختبار القبلي والبعدي في <a href="level/index.html">صفحة قياس المستوى</a>. الاختبار البعدي مغلق حتى تفتحه أنت. «نسخة قديمة» تعني أن الطالب أدّى الاختبار السهل القديم، وسيُطلب منه أداء النسخة الجديدة الأصعب.</p>
    ${lvErr ? `<p class="err">⚠️ ${/permission/i.test(lvErr) ? 'قواعد Firebase الجديدة لم تُنشر بعد، لذلك لا تصل نتائج الاختبار. انسخ ملف القواعد كاملاً في Firestore ← Rules ثم اضغط Publish. نتائج الطلاب محفوظة في أجهزتهم وستصل تلقائياً بعد ذلك.' : 'تعذّر تحميل النتائج: ' + esc(lvErr)}</p>` : ''}
    <p style="margin:10px 0"><button class="btn ${lvCfg.postOpen ? 'bad' : 'ok'}" id="postT">${lvCfg.postOpen ? '🔒 أغلق الاختبار البعدي' : '🔓 افتح الاختبار البعدي للطلاب'}</button> <span class="note">${lvCfg.postOpen ? 'البعدي مفتوح الآن.' : 'البعدي مغلق الآن.'}</span></p>
    <div class="lvsum"><div><small>أدّوا القبلي</small><b>${lvIds.filter(id => lv[id].pre).length}</b></div><div><small>أدّوا البعدي</small><b>${lvIds.filter(id => lv[id].post).length}</b></div>
      <div><small>متوسط القبلي (النسخة الجديدة)</small><b>${avg(lvIds.filter(id => lvNew(lv[id].pre)).map(id => pc(lv[id].pre)))}${lvIds.some(id => lvNew(lv[id].pre)) ? '٪' : ''}</b></div>
      <div><small>متوسط التحسّن (لمن أدّى الاثنين)</small><b>${both.length ? (avg(both.map(gain)) > 0 ? '+' : '') + avg(both.map(gain)) + '٪' : '—'}</b></div></div>
    ${lvIds.length ? `<p><button class="btn ok" id="lvCsv">⬇️ تنزيل نتائج قياس المستوى</button></p><div class="lvwrap"><table class="lvt"><thead><tr><th>الطالب</th><th>القبلي</th><th>البعدي</th><th>التحسّن</th><th></th></tr></thead><tbody>
      ${lvIds.map(id => { const L = lv[id], p = priv[id] || {}; const g = L.pre && L.post ? gain(id) : null;
        return `<tr data-id="${id}"><td><b>${esc(p.name || nickOf(id) || 'طالب')}</b><small class="real">${p.grade ? esc(p.grade === H.EXTERNAL ? 'من خارج المدرسة' : p.grade + ' · ' + (p.section || '')) : esc(nickOf(id))}</small></td>
          <td>${L.pre ? pc(L.pre) + '٪<br><small>' + esc(L.pre.level) + (lvNew(L.pre) ? '' : ' · نسخة قديمة') + '</small>' : '—'}</td><td>${L.post ? pc(L.post) + '٪<br><small>' + esc(L.post.level) + '</small>' : '—'}</td>
          <td>${g === null ? '—' : `<span class="${g > 0 ? 'up' : g < 0 ? 'down' : ''}">${g > 0 ? '+' : ''}${g}٪</span>`}</td>
          <td><button class="btn soft sm" data-lr="${L.post ? 'post' : 'pre'}">↺ إعادة ${L.post ? 'البعدي' : 'القبلي'}</button></td></tr>`; }).join('')}</tbody></table></div>`
      : '<div class="empty">لم يؤدِّ أحد الاختبار بعد.</div>'}</div>`;
  // newest registrations first: the real-name record is written at the moment a student registers
  const ts = t => t && t.toMillis ? t.toMillis() : 0;
  const newest = Object.keys(priv).sort((a, b) => ts(priv[b].updatedAt) - ts(priv[a].updatedAt)).slice(0, 15);
  const newPanel = `<div class="panel"><h2>🆕 أحدث المسجلين <span class="count" style="background:#eef0f6;color:var(--ink)">${Object.keys(priv).length} طالباً</span></h2>
    ${newest.map(id => { const p = priv[id], r = rows.find(x => x.id === id);
      return `<div class="item"><span class="nm">${esc(p.name)}<small class="real">${p.grade === H.EXTERNAL ? '🌐 ' + esc(p.school || 'من خارج المدرسة') : esc(p.grade) + ' · الشعبة ' + esc(p.section)} · ${r ? '🏷️ ' + esc(r.nick) + (r.approved ? ' ✓' : ' (بانتظار الموافقة)') : '⚠️ لم يكمل اختيار الاسم المستعار'}${lv[id] && lv[id].pre ? ' · 📈 أدّى القبلي' : ''}</small></span><span class="note" style="font-size:.95rem">${ago(p.updatedAt).replace('آخر تحديث: ', '')}</span></div>`; }).join('') || '<div class="empty">لا يوجد مسجلون بعد.</div>'}</div>`;
  // Word Quest follow-up: sent by each student's device together with the points
  const todayNo = (() => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset() * 60000) / 864e5); })();
  const wqRows = rows.filter(r => r.parts && r.parts.wqx && (r.parts.wqx.k || r.parts.wqx.t)).sort((a, b) => (b.parts.wqx.m - a.parts.wqx.m) || (b.parts.wqx.k - a.parts.wqx.k));
  const dAgo = d => { const x = todayNo - (d || 0); return !d ? '—' : x <= 0 ? '<span class="up">اليوم</span>' : x === 1 ? 'أمس' : 'قبل ' + x + ' يوم'; };
  const wqPanel = `<div class="panel"><h2>🗺️ English Word Quest <span class="count" style="background:#e8f0fd;color:#2f6fd6">${wqRows.length} طالباً</span></h2>

      <h2>📋 ${esc(p.name || r.nick)}</h2><p class="note">${esc(r.nick)}${gradeOf(r.id) ? ' · ' + esc(gradeOf(r.id)) : ''} · المستوى: ${lvTxt} · المجموع ${fmt(tot(r))} نقطة</p>
      <ul class="rpSum">${sum.map(x => `<li>${x}</li>`).join('')}</ul>
      <h3>🎯 أين يركّز؟ (توزيع نقاطه على الأقسام)</h3>
      ${F.length ? F.slice(0, 8).map(x => bar(`${ICON[x.k] || ''} ${esc(SEC_AR[x.k] || x.k)}`, x.v, F[0].v, `${pct(x.v, fT)}٪`)).join('') : '<p class="note">لا نقاط بعد.</p>'}
      ${wT ? `<p class="note" style="margin-top:8px">هذا الأسبوع: ${Object.keys(W).sort((a, b) => W[b] - W[a]).slice(0, 4).map(k => `${ICON[k] || ''} ${esc(SEC_AR[k] || k)} ${pct(W[k], wT)}٪`).join(' · ')}</p>` : ''}
      <h3>✅ دقة إجاباته في كل قسم</h3>
      ${acc.length ? acc.map(x => bar(`${ICON[x.k] || ''} ${esc(SEC_AR[x.k] || x.k)} <small>(${x.t} سؤالاً)</small>`, x.r, x.t, `${pct(x.r, x.t)}٪`, tone(pct(x.r, x.t)))).join('') : '<p class="note">تُسجَّل الدقة من 4/11/2026، وتظهر بعد أن يجيب الطالب أسئلة جديدة.</p>'}
      <h3>📚 تقدّمه في الأقسام</h3>
      ${tried.length ? `<table class="rpT">${tried.map(x => `<tr><td>${x[0]}<small>${x[2]}</small></td><td>${x[3]}</td></tr>`).join('')}</table>` : '<p class="note">لم يصل تقدّم من أدوات الموقع بعد.</p>'}
      ${steps.length ? `<h3>📝 مهارات ستيب (الأضعف أولاً)</h3>${steps.sort((a, b) => a.p - b.p).map(x => bar(`${esc(STEP_AR[x.k] || x.k)} <small>(${x.t})</small>`, x.r, x.t, `${x.p}٪`, tone(x.p))).join('')}` : ''}
      <p class="note" style="margin-top:16px">آخر نسخة من تقدّمه وصلت: ${d.__at ? new Date(d.__at).toLocaleString('ar-SA-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }) : '—'}</p></div>`;
  }
  async function openReport(id) {
    const r = rows.find(x => x.id === id); if (!r) return;
    let box = $('rpBox'); if (!box) { box = document.createElement('div'); box.id = 'rpBox'; document.body.appendChild(box); }
    box.innerHTML = '<div class="sheet"><p class="note">جارٍ تحميل التقرير…</p></div>'; box.hidden = false; document.body.style.overflow = 'hidden';
    const close = () => { box.hidden = true; box.innerHTML = ''; document.body.style.overflow = ''; };
    box.onclick = e => { if (e.target === box) close(); };
    let d = null; try { d = await H.teacherProgress(id); } catch (e) { console.warn('progress', e); }
    box.innerHTML = reportHTML(r, d); $('rpX').onclick = close; box.scrollTop = 0;
  }
  const acSave = () => { try { sessionStorage.setItem('t-ac', JSON.stringify(AC)); } catch (e) {} $('acBody').innerHTML = acHTML(); acWire(); };
  acWire();
  $('csv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['الترتيب','الاسم الحقيقي','الصف','الشعبة','المدرسة / الجهة (للمشارك الخارجي)','الاسم المستعار','مرات النجومية','أسابيع النجومية','نقاط هذا الأسبوع','المجموع منذ البداية','الحالة'].map(q).join(',')];
    rows.forEach((r, i) => { const p = priv[r.id] || {}; lines.push([i + 1, p.name || '—', p.grade === H.EXTERNAL ? 'من خارج المدرسة' : (p.grade || ''), p.grade === H.EXTERNAL ? '' : (p.section || ''), p.school || '', r.nick, nS(r.id), sWeeks(r.id).join(' - '), (r.week ?? H.FOUND_WEEK) === H.weekNo() ? (r.score || 0) : 0, tot(r), r.approved ? 'ظاهر في اللوحة' : 'بانتظار الموافقة'].map(q).join(',')); });
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'قائمة-التكريم-لوحة-الشرف.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('postT').onclick = async () => { try { await H.setPostOpen(!lvCfg.postOpen); } catch (e) { alert('تعذّر التنفيذ: ' + (e.code || e.message)); } load(); };
  $('main').querySelectorAll('button[data-lr]').forEach(b => b.onclick = async () => {
    const id = b.closest('tr').dataset.id, k = b.dataset.lr, nm = (priv[id] || {}).name || nickOf(id);
    if (!confirm('السماح لـ «' + nm + '» بإعادة ' + (k === 'pre' ? 'الاختبار القبلي؟ (تُحذف نتيجته القبلية)' : 'الاختبار البعدي؟ (تُحذف نتيجته البعدية)'))) return;
    try { await H.resetLevel(id, k); } catch (e) { alert('تعذّر التنفيذ: ' + (e.code || e.message)); } load();
  });
  if ($('lvCsv')) $('lvCsv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', d = t => t ? new Date(t).toISOString().slice(0, 10) : '';
    const lines = [['الاسم الحقيقي','الصف','الشعبة','الاسم المستعار','القبلي٪','مستوى القبلي','مفردات','قواعد','قراءة','استماع','تاريخ القبلي','البعدي٪','مستوى البعدي','مفردات','قواعد','قراءة','استماع','تاريخ البعدي','التحسّن٪'].map(q).join(',')];
    lvIds.forEach(id => { const L = lv[id], p = priv[id] || {}, a = L.pre || {}, b = L.post || {};
      lines.push([p.name || '', p.grade || '', p.section || '', nickOf(id), L.pre ? pc(a) : '', a.level || '', a.v ?? '', a.g ?? '', a.r ?? '', a.l ?? '', d(a.at), L.post ? pc(b) : '', b.level || '', b.v ?? '', b.g ?? '', b.r ?? '', b.l ?? '', d(b.at), L.pre && L.post ? gain(id) : ''].map(q).join(',')); });
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'نتائج-قياس-المستوى.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('main').querySelectorAll('button[data-sort]').forEach(b => b.onclick = () => { try { sessionStorage.setItem('t-sort', b.dataset.sort); } catch (e) {} const y = scrollY; load().then(() => scrollTo(0, y)); });
  $('main').querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
    const id = b.closest('.item').dataset.id, a = b.dataset.a, r = rows.find(x => x.id === id);
    b.disabled = true;
    try {
      if (a === 'ok') await H.setApproved(id, true);
      if (a === 'hide') await H.setApproved(id, false);
      if (a === 'reg') {
        const list = H.REGIONS.map((x, i) => (i + 1) + '. ' + x).join('\n');
        const v = prompt('اكتب رقم المنطقة لـ «' + r.nick + '»:\n\n' + list, '');
        const k = parseInt(v, 10);
        if (k >= 1 && k <= H.REGIONS.length) await H.setRegionFor(id, H.REGIONS[k - 1]);
        else if (v) alert('رقم غير صحيح.');
      }
      if (a === 'mergeid') {
        const f = rows.find(x => x.id === b.dataset.from), pn = (priv[id] || {}).name || '';
        if (f && confirm('ضمّ الحسابين المكررين' + (pn ? ' لـ «' + pn + '»' : '') + ':\n\nتُضاف ' + fmt(tot(f)) + ' نقطة من «' + f.nick + '» إلى «' + r.nick + '»، ثم يُحذف «' + f.nick + '» نهائياً.\n\nهل تتابع؟')) {
          const add = await H.mergeInto(id, f.id); alert('تم ✓ أُضيفت ' + fmt(add) + ' نقطة إلى «' + r.nick + '».');
        }
      }
      if (a === 'merge') {
        const n = prompt('ضمّ نقاط حساب قديم إلى «' + r.nick + '»\n(لطالب ضاع جهازه القديم فسجّل من جديد)\n\nاكتب الاسم المستعار للحساب القديم كما يظهر في القائمة:', '');
        if (n) {
          const old = rows.filter(x => x.id !== id && H.cleanNick(x.nick) === H.cleanNick(n));
          if (old.length !== 1) alert(old.length ? 'يوجد أكثر من حساب بهذا الاسم؛ عدّل اسم أحدهما أولاً.' : 'لم أجد حساباً بهذا الاسم.');
          else if (confirm('تُضاف ' + fmt(tot(old[0])) + ' نقطة من «' + old[0].nick + '» إلى «' + r.nick + '»، ثم يُحذف «' + old[0].nick + '». هل تتابع؟')) {
            const add = await H.mergeInto(id, old[0].id); alert('تم ✓ أُضيفت ' + fmt(add) + ' نقطة إلى «' + r.nick + '».');
          }
        }
      }
      if (a === 'ren') { const n = prompt('الاسم المستعار:', r.nick); if (n && H.cleanNick(n).length >= 2) await H.rename(id, n); }
      if (a === 'del' && confirm('حذف «' + r.nick + '» من اللوحة؟')) await H.remove(id);
    } catch (e) { alert('تعذّر التنفيذ: ' + (e.code || e.message)); }
    load();
  });
}
start();
</script>
