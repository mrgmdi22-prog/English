/* Level check: a before test and an after test (parallel forms, same difficulty), one question at a time,
   no feedback during the test, then the score, the skills and an estimated CEFR level; the after test shows the gain. */
:root{color-scheme:light;--bg:#F4F7FF;--card:#fff;--ink:#1F2A44;--muted:#5B6685;--line:#E2E8F5;--pri:#3157D5;--pri-soft:#E8EEFF;--ok:#16825D;--ok-soft:#E3F6EE;--warn:#A35A00;--warn-soft:#FFF1DC;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--ar);font-size:20px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:68px 16px 80px}

.lead{color:var(--muted);margin:8px 0 0}

.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.wait{background:var(--warn-soft);color:var(--warn)}

.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:1rem}
.sec{border-radius:999px;padding:2px 14px;color:#fff;font-size:.95rem}
.passage{background:#F7F9FF;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;font-family:var(--en);direction:ltr;text-align:left;font-size:1.12rem;line-height:1.75;margin:10px 0 14px}
.qtext{font-family:var(--en);direction:ltr;text-align:left;font-size:1.3rem;font-weight:600;margin:10px 0 4px;line-height:1.5}
.qar{color:var(--muted);font-size:1rem;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-family:var(--en);direction:ltr;text-align:left;font-size:1.15rem;font-weight:500;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;color:var(--ink);display:flex;gap:12px;align-items:center}

.opt[aria-pressed=true]{border-color:var(--pri);background:var(--pri-soft)}
.opt[aria-pressed=true] .k{background:var(--pri);color:#fff}
.listen{display:flex;align-items:center;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.nav{direction:ltr;display:flex;justify-content:space-between;gap:10px;margin-top:18px}

.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:1.7rem;direction:ltr}

.note{background:var(--warn-soft);color:#6b3d00;border-radius:16px;padding:10px 14px;margin-top:14px;font-size:1rem}
[hidden]{display:none!important}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* voice */
let voices = []; const loadV = () => { try { voices = speechSynthesis.getVoices() || []; } catch(e){} };
if ('speechSynthesis' in window) { loadV(); speechSynthesis.onvoiceschanged = loadV; }
function say(t){ if (!('speechSynthesis' in window)) return false; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .88;
  const v = voices.find(v => v.lang === 'en-US') || voices.find(v => (v.lang||'').replace('_','-').startsWith('en')); if (v) u.voice = v; speechSynthesis.speak(u); return true; } catch(e){ return false; } }

/* scoring: per skill out of 8, per band, and the level */
function score(kind, answers){
  const items = FORMS[kind].items, sk = { v:0, g:0, r:0, l:0 }, band = { 1:[0,0], 2:[0,0], 3:[0,0] }; let total = 0;
  items.forEach((it, i) => { const ok = answers[i] === it[4]; band[it[1]][1]++; if (ok) { total++; sk[it[0]]++; band[it[1]][0]++; } });
  const pc = b => band[b][0] / band[b][1];
  let lv = 0; if (pc(1) >= .6) lv = 1; if (lv === 1 && pc(1) >= .75 && pc(2) >= .6) lv = 2; if (lv === 2 && pc(2) >= .75 && pc(3) >= .6) lv = 3;
  return { score: total, max: items.length, level: LEVELS[lv][0], v: sk.v, g: sk.g, r: sk.r, l: sk.l, at: Date.now() };
}

/* saved results: on this device always, and in the club database when the student is registered */
let H = null, cloud = {}, postOpen = false, online = false;
async function loadAll(){
  const local = store.get('lv-results') || {};
  try {
    H = await import('../assets/honor.js?v=20261029b');
    if (H.ready) {
      const t = new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 8000));
      const [mine, cfg] = await Promise.race([Promise.all([H.myLevels(), H.levelsConfig()]), t]);
      cloud = mine || {}; postOpen = !!(cfg && cfg.postOpen); online = true;
      // a result saved only on this device (no connection at the time) is sent now
      for (const k of ['pre', 'post']) if (local[k] && !cloud[k] && (k === 'pre' || cloud.pre)) { try { await H.saveLevel(k, local[k]); cloud[k] = local[k]; } catch(e){} }
    }
  } catch(e) { console.warn('level check offline', e); }
  const res = { pre: cloud.pre || local.pre || null, post: cloud.post || local.post || null };
  if (online) { const s = {}; ['pre', 'post'].forEach(k => { if (cloud[k]) s[k] = true; }); try { localStorage.setItem('lv-synced', JSON.stringify(s)); } catch(e){} }
  store.set('lv-results', res);
  return res;
}
async function save(kind, r){
  const res = store.get('lv-results') || {}; res[kind] = r; store.set('lv-results', res);
  if (H && H.ready) { try { await H.saveLevel(kind, r); try { const s = JSON.parse(localStorage.getItem('lv-synced') || '{}'); s[kind] = true; localStorage.setItem('lv-synced', JSON.stringify(s)); } catch(e){} return true; } catch(e){ console.warn(e); } }
  return false;
}

  const row = (k, ic, sub) => {
    const r = RES[k];
    const status = r ? `<span class="tag ok">✓ أنجزته: ${Math.round(r.score / r.max * 100)}٪ · <span class="en">${r.level}</span></span>`
      : k === 'post' && !postReady ? `<span class="tag wait">🔒 يفتحه المعلم في نهاية الفترة</span>` : '';
    const btn = r ? `<button class="btn soft" data-show="${k}">النتيجة</button>`
      : `<button class="btn" data-go="${k}" ${k === 'post' && !postReady ? 'disabled' : ''}>${store.get('lv-draft-' + k) ? 'أكمل الاختبار' : 'ابدأ'}</button>`;
    return `<div class="test"><span class="ic" aria-hidden="true">${ic}</span><span class="tx"><b>${NAME[k]}</b><small>${sub}</small>${status}</span>${btn}</div>`;
  };
  $('app').innerHTML = `<h1>قياس المستوى<span class="en">LEVEL CHECK</span></h1>
    <p class="lead">اختبار قصير يقيس مستواك في الإنجليزية الآن، ثم اختبار مثله في نهاية الفترة لترى كم تحسّنت.</p>
    <div class="card"><h2>عن الاختبار</h2>
      <div class="parts">${Object.entries(SK).map(([k, s]) => `<div class="part" style="border-color:var(${s[2]})"><b style="color:var(${s[2]})">${s[0]}</b><small class="en">${s[1]} · ${CNT[k]} questions</small></div>`).join('')}</div>
      <p class="muted" style="margin:0">32 سؤالاً في نحو 20 دقيقة. الأسئلة تبدأ سهلة وتصعب تدريجياً، فلا تقلق إن لم تعرف بعضها. أجب وحدك ودون مساعدة، لتكون النتيجة صادقة. يحتاج قسم الاستماع إلى الصوت 🔊.</p></div>
    <div class="tests">
      ${row('pre', '📝', 'في بداية الفترة: يحدد مستواك الآن.')}
      ${row('post', '🏁', 'في نهاية الفترة: أسئلة جديدة بالصعوبة نفسها، لقياس تحسّنك.')}
    </div>
    ${RES.pre && RES.post ? `<div class="card" id="cmpBox"></div>` : ''}
    ${!online && H && H.ready ? `<p class="note">لم يتصل الاختبار بقاعدة النادي الآن، فستُحفظ نتيجتك على هذا الجهاز وتُرسل للمعلم عند الاتصال.</p>` : ''}`;
  $('app').querySelectorAll('[data-go]').forEach(b => b.onclick = () => start(b.dataset.go));
  $('app').querySelectorAll('[data-show]').forEach(b => b.onclick = () => result(b.dataset.show));
  if (RES.pre && RES.post) $('cmpBox').innerHTML = compare();
  window.scrollTo(0, 0);
}

function start(kind){
  const F = FORMS[kind], N = F.items.length;
  // answer order is shuffled once per student and kept with the draft, so leaving and coming back changes nothing
  let d = store.get('lv-draft-' + kind);
  if (!d || !d.order || d.order.length !== N) d = { i: 0, ans: {}, order: F.items.map(it => shuffle(it.slice(4, 8))), plays: {} };
  const keep = () => store.set('lv-draft-' + kind, d);
  keep();
  function q(){
    const i = d.i, it = F.items[i], ex = it[8] || {}, s = SK[it[0]];
    const firstOf = i === 0 || F.items[i - 1][0] !== it[0];
    const plays = d.plays[i] || 0;
    $('app').innerHTML = `<div class="card">
      <div class="qhead"><span class="sec" style="background:var(${s[2]})">${s[0]} · <span class="en">${s[1]}</span></span><span class="en">${i + 1} / ${N}</span></div>
      <div class="bar"><i style="width:${i / N * 100}%"></i></div>
      ${firstOf && it[0] === 'l' ? `<p class="note" style="margin:0 0 8px">🎧 في هذا القسم تستمع إلى جملة، ثم تجيب. يمكنك الاستماع مرتين فقط لكل سؤال.</p>` : ''}
      ${ex.p !== undefined ? `<div class="passage">${esc(F.passages[ex.p])}</div>` : ''}
      ${ex.say ? `<div class="listen"><button class="btn" id="play" ${plays >= 2 ? 'disabled' : ''}>🔊 استمع</button><span class="muted" id="pl">${plays >= 2 ? 'انتهت مرات الاستماع' : plays === 1 ? 'باقي مرة واحدة' : 'تستطيع الاستماع مرتين'}</span></div>` : ''}
      <p class="qtext">${esc(it[2])}</p><p class="qar">${esc(it[3])}</p>
      <div class="opts">${d.order[i].map((o, k) => `<button class="opt" data-o="${esc(o)}" aria-pressed="${d.ans[i] === o}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="nav" dir="ltr"><button class="btn soft" id="back" ${i === 0 ? 'disabled' : ''}><bdi>←</bdi> <bdi>السابق</bdi></button><button class="btn" id="next" ${d.ans[i] ? '' : 'disabled'}>${i === N - 1 ? '<bdi>إنهاء الاختبار</bdi> ✓' : '<bdi>التالي</bdi> <bdi>→</bdi>'}</button></div></div>
      <p class="muted" style="text-align:center;font-size:1rem">تُحفظ إجاباتك أولاً بأول، فإن خرجت تستطيع أن تكمل من حيث توقفت.</p>`;
    if (ex.say) $('play').onclick = () => { if ((d.plays[i] || 0) >= 2) return; if (!say(ex.say)) { $('pl').textContent = 'الصوت غير متاح على هذا الجهاز'; return; } d.plays[i] = (d.plays[i] || 0) + 1; keep();
      const left = 2 - d.plays[i]; $('pl').textContent = left ? 'باقي مرة واحدة' : 'انتهت مرات الاستماع'; if (!left) $('play').disabled = true; };
    $('app').querySelectorAll('.opt').forEach(b => b.onclick = () => { d.ans[i] = b.dataset.o; keep();
      $('app').querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); $('next').disabled = false; });
    $('back').onclick = () => { d.i--; keep(); q(); };
    $('next').onclick = async () => {
      if (i < N - 1) { d.i++; keep(); q(); window.scrollTo(0, 0); return; }
      const missing = F.items.findIndex((_, k) => !d.ans[k]); if (missing >= 0) { d.i = missing; keep(); q(); return; }
      if (!confirm('هل تريد إنهاء الاختبار وإرسال إجاباتك؟ لا يمكن إعادته بعد ذلك.')) return;
      $('next').disabled = true; $('next').textContent = 'جاري الحفظ…';
      const r = score(kind, F.items.map((_, k) => d.ans[k]));
      const sent = await save(kind, r); store.del('lv-draft-' + kind);
      RES[kind] = r; result(kind, true, sent);
    };
    window.scrollTo(0, 0);
  }
  q();
}

function levelScale(lv){ return `<div class="scale">${LEVELS.map(L => `<div class="${L[0] === lv ? 'on' : ''}"><b>${L[0]}</b>${L[1]}</div>`).join('')}</div>`; }
function result(kind, fresh, sent){
  const r = RES[kind], pc = Math.round(r.score / r.max * 100), L = LEVELS.find(x => x[0] === r.level) || LEVELS[0];
  const tip = { 'Pre-A1':'ابدأ بقسم «التأسيس»: الحروف والأصوات ومحادثات التأسيس وقاموس الألف كلمة.', 'A1':'ركّز على «قوائم الكلمات» العامة و«خارطة الأزمنة» البسيطة، واقرأ قصة كل أسبوع.',
    'A2':'تابع «English Word Quest» و«ركن القصص» و«مختبر المحادثة»، وتدرّب على الأزمنة التامة.', 'B1':'مستوى رائع! جرّب الكلمات الأكاديمية و«Syntax Tree Lab» و«المكتبة الإثرائية».' }[r.level];
  $('app').innerHTML = `<h1>${fresh ? 'انتهى الاختبار 🎉' : 'نتيجتك'}<span class="en">${NAME[kind] === NAME.pre ? 'BEFORE TEST' : 'AFTER TEST'}</span></h1>
    <p class="lead">${NAME[kind]} · ${fmtDate(r.at)}</p>
    <div class="card"><div class="big"><div class="ring" style="--p:${pc}"><span>${pc}%</span></div>
      <div><div class="muted">مستواك التقريبي</div><div class="lvl">${r.level}</div><div style="font-weight:800">${L[1]}</div><div class="muted en" style="font-size:1rem">${r.score} / ${r.max}</div></div></div>
      ${levelScale(r.level)}</div>
    <div class="card"><h2>المهارات</h2>${Object.entries(SK).map(([k, s]) => `<div class="skill"><div class="row"><span style="color:var(${s[2]})">${s[0]}</span><span class="en">${r[k]} / ${CNT[k]}</span></div><div class="bar"><i style="width:${r[k] / CNT[k] * 100}%;background:var(${s[2]})"></i></div></div>`).join('')}</div>
    ${kind === 'post' && RES.pre ? `<div class="card">${compare()}</div>` : ''}
    <div class="card"><h2>💡 خطوتك التالية</h2><p style="margin:0">${tip}</p></div>
    ${fresh && sent === false && H && H.ready ? `<p class="note">حُفظت النتيجة على جهازك، وستصل للمعلم عندما تفتح هذه الصفحة وأنت متصل بالإنترنت.</p>` : ''}
    <p style="text-align:center;margin-top:18px"><button class="btn soft" id="bk" dir="ltr"><bdi>←</bdi> <bdi>العودة</bdi></button></p>`;
  $('bk').onclick = home; window.scrollTo(0, 0);
  if (fresh && window.clubSfx) clubSfx('win');
}
function compare(){
  const a = RES.pre, b = RES.post, d = (x, y, u = '') => { const v = y - x; return v > 0 ? `<span class="up">+${v}${u} ▲</span>` : v < 0 ? `<span class="down">${v}${u} ▼</span>` : '<span class="muted">=</span>'; };
  const pa = Math.round(a.score / a.max * 100), pb = Math.round(b.score / b.max * 100);
  return `<h2>📈 تحسّنك</h2><table class="cmp"><thead><tr><th></th><th>القبلي</th><th>البعدي</th><th>التغيّر</th></tr></thead><tbody>
    <tr><td><b>النتيجة</b></td><td class="en">${pa}%</td><td class="en">${pb}%</td><td>${d(pa, pb, '٪')}</td></tr>
    <tr><td><b>المستوى</b></td><td class="en">${a.level}</td><td class="en">${b.level}</td><td>${a.level === b.level ? '<span class="muted">=</span>' : LEVELS.findIndex(x => x[0] === b.level) > LEVELS.findIndex(x => x[0] === a.level) ? '<span class="up">ارتفع ▲</span>' : '<span class="down">انخفض ▼</span>'}</td></tr>
    ${Object.entries(SK).map(([k, s]) => `<tr><td>${s[0]}</td><td class="en">${a[k]}/${CNT[k]}</td><td class="en">${b[k]}/${CNT[k]}</td><td>${d(a[k], b[k])}</td></tr>`).join('')}</tbody></table>`;
}
home();
</script>
</body>
</html>
